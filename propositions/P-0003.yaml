id: P-0003
auteur: bidji29
regle: R3
texte_propose: 'R3 : à la condition « au moins relectures_requises relectures favorables d''autres utilisateurs
  portant sur le commit jugé, dont une Confirmé quand il y en a », ajouter : « (relectures en ajout seul,
  jamais deux de suite d''un relecteur sur le même commit ; seule compte la plus récente de chaque relecteur
  : une favorable si elle porte sur le commit jugé ; faite avant le verdict, sans commit, elle ne compte
  pas ; une abstention motivée ne compte ni pour ni contre, retire le poids de la relecture précédente
  de son relecteur, n''ouvre aucune porte et n''abaisse aucun seuil) » ; remplacer « plus de favorables
  que de défavorables, et aucune défavorable d''un gardien, du conseil ou d''un Confirmé ; aucun défaut
  confirmé » par « plus de favorables que de défavorables sur le commit jugé, et aucune défavorable d''un
  gardien, du conseil ou d''un Confirmé — la plus récente de son relecteur, quel que soit son commit,
  ou sa plus récente relecture du commit jugé : elle tient jusqu''à ce qu''il relise, un nouveau commit
  ne la fait pas tomber ; aucun défaut confirmé sur la relecture la plus récente de son relecteur, ou
  sur sa plus récente relecture du commit jugé ». Réputation : une abstention ne rapporte rien ; sur une
  contribution, un relecteur gagne ou perd au plus une fois, d''après sa relecture la plus récente et
  seulement si elle porte sur le commit où la contribution a été décidée ; +2 une fois si l''un de ses
  défauts est confirmé (docs/reputation.md).'
motif: 'Deux répétitions générales de suite ont buté sur le même défaut. Le 29/10 (trouvé par trois abeilles)
  : bee relire refusait une seconde relecture du même relecteur quel que soit le commit, et une relecture
  faite avant le verdict de la CI, sans sha, comptait dans verifier-acceptation puis disparaissait à l''arrivée
  du verdict, sans avertissement ; un gardien ne pouvait donc jamais relire le correctif qu''il avait
  demandé et, seul gardien, son avis défavorable devenait définitif. Le 30/10 (tour 2), le défaut est
  revenu, et un gardien a conclu « défavorable » et une relectrice « favorable » sur la même analyse,
  faute d''avis intermédiaire ou de portée déclarée. La revue adverse de la tâche ruche-0012 a montré
  qu''une relecture par commit ne suffit pas : en revenant à un ancien commit déjà approuvé, ou en poussant
  un commit vide, l''auteur effaçait le défaut confirmé et le refus du gardien posés depuis ; d''où la
  règle de la relecture la plus récente, et le défavorable privilégié qui tient jusqu''à la relecture
  suivante. bee relire, verifier-acceptation, verifier-pr et bee valider l''appliquent (tâche ruche-0012).'
ouverte_le: '2026-10-30T09:37:51Z'
statut: ouverte
