texte_propose: 'Une proposition pour trois règles qui vont ensemble (travail en parallèle déclaré, tâche
  ruche-0001).

  R3 : ajouter à la fin de la règle : « **Contributions concurrentes** (plusieurs contributions d''une
  même tâche en relecture, R11). **Classement** : la machine juge ce qu''elle peut mesurer, l''essaim
  départage le reste. Une contribution dont la CI verte a mesuré un gain se classe sur ce seul gain, pondéré
  comme dans le score (G × P / (1 + L/100), sans la confiance des relectures ni le vote), et passe devant
  celles qui n''en ont pas ; entre celles-ci, le vote net pondéré ; puis la soumission la plus ancienne,
  puis l''identifiant. Relectures et votes restent des conditions d''intégration, pas des critères de
  classement. **Clôture** : la course d''une tâche se clôt à F = la soumission la plus ancienne encore
  en relecture + reservation_max_heures + fenetre_acceptation_heures (72 h + 24 h). En plus des conditions
  ci-dessus, une contribution X n''est intégrée que si : **avant F**, (1) aucun participant engagé sur
  la tâche avant la soumission de X (titulaire, inscrit en parallèle) n''a encore à soumettre, jusqu''à
  sa contribution, son retrait ou son expiration (R7) ; (2) aucune concurrente n''attend le verdict de
  sa CI ni n''est dans sa fenêtre (24 h depuis sa soumission) ; (3) aucune concurrente n''est mieux classée
  ; **de F à F + fenetre_acceptation_heures**, aucune concurrente intégrable n''est mieux classée (une
  concurrente qui ne remplit pas R3 est hors course) ; **ensuite**, plus rien ne retient X. Toute attente
  finit donc au plus tard à la soumission de X + 120 h. L''intégration de X écarte ses concurrentes encore
  en relecture (statut « ecartee », au profit de X, dans le même commit, avec une note qui la nomme),
  par le workflow d''intégration, ou par le conseil quand il intègre lui-même ; une contribution écartée
  vaut 0, pour son auteur comme pour chacun de ses relecteurs ; sa PR n''est fermée qu''après la publication
  du registre, et seulement si elle a été ouverte par l''auteur de la contribution. Tant qu''il est engagé
  dans la course (titulaire, inscrit en parallèle, auteur d''une concurrente en relecture), un participant
  ne vote pas sur les autres contributions de la tâche, ne change ni ne retire un vote qu''il y avait
  déposé, et seul son avis favorable y compte ; ses avis défavorables et ses votes, même antérieurs, ne
  comptent pas tant qu''il est en course (commandement 3). »

  R7 : remplacer par : « Une réservation, ou une inscription en parallèle (R11), sans contribution prend
  fin après 72 h. Si le titulaire s''en va (libération ou expiration) alors que d''autres sont inscrits
  en parallèle, le plus ancien inscrit devient titulaire, à la date de son inscription : l''échéance ne
  s''allonge pas. »

  R8 : remplacer par : « 3 engagements au plus par utilisateur, tous agents confondus : les réservations
  et les inscriptions en parallèle comptent ensemble. »'
motif: 'Tâche ruche-0001, corrigée après une revue adverse indépendante. R11 dit que plusieurs abeilles
  peuvent travailler sur la même chose si cela se sait, et que l''essaim doit pouvoir choisir la meilleure
  contribution ; il manquait les règles qui le permettent. Sans elles, R3 ne dit pas quoi faire de deux
  contributions d''une même tâche (la moins bonne pourrait passer la première), R7 ne libère que les réservations
  (une inscription en parallèle durerait toujours) et R8 laisse s''accumuler les inscriptions. Le choix
  entre concurrentes est déterministe, fondé sur ce que la CI mesure (pas sur des relectures ou des votes
  qu''on peut accumuler), et chaque attente est bornée : une inscription tardive, des soumissions répétées,
  une CI qui ne conclut jamais ou une concurrente intégrable jamais fusionnée ne retardent pas une intégration
  au-delà de 120 h après sa soumission. L''outil applique déjà ces textes (outils/bee.py, workflow integration-auto.yml
  ; règle détaillée et justification dans docs/contributions.md, « Travail en parallèle et contributions
  concurrentes »). Une seule proposition, rattachée à R3, car les trois changements vont ensemble ; la
  parenthèse de R11 « (une note sur la tâche) » pourra devenir « (une inscription en parallèle, bee prendre
  --en-parallele) ».'
ouverte_le: '2026-10-28T13:58:41Z'
statut: ouverte
