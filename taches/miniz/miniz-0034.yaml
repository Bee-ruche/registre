  - "mz_deflateInit2, mz_inflateInit2, mz_deflateEnd et mz_inflateEnd apparaissent avec leurs vraies plages ; aucun appel de macro pris pour une fonction (liste avant/après jointe)"
  - "bee/bench/test_profil.py couvre un nom à majuscules et un appel de macro en tête de ligne"
