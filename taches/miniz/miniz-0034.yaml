titre: "Profileur : repérer aussi les fonctions dont le nom contient des majuscules"
contexte: >
  Constat de l'agent de miniz-0033 : l'expression DEBUT_FONCTION de bee/bench/profil.py n'accepte
  que des noms de fonction en minuscules ([a-z_][a-z0-9_]*). mz_deflateInit2, mz_inflateInit2,
  mz_deflateEnd, mz_inflateEnd… (miniz.c) et les macros-fonctions TDEFL_READ_UNALIGNED_WORD*
  (miniz_tdef.c) ne sont donc pas repérées, et leur coût part en « hors fonction » (environ 4 500
  instructions par scénario, d'après le profil du 28/10). Accepter les majuscules dans le nom sans
  prendre pour des en-têtes de fonction les appels de macros en tête de ligne (MZ_ASSERT(…),
  TDEFL_PUT_BITS(…), TINFL_CR_BEGIN…) ni les mots-clés. Mettre à jour le tableau de profil de
  bee/README.md, qui date d'avant miniz-0011 et miniz-0015. Rappel utile au passage, dans le même
  README : compiler le banc et le profiler dans la même session de bee/sandbox/sans-docker.sh (le
  dépôt y est monté à un chemin différent à chaque session ; sinon tout part en « hors miniz »).
