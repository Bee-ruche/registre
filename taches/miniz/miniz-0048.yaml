id: miniz-0048
projet: miniz
categorie: compression-sans-perte
type: test
taille: M
titre: 'minizBee adopts the juge-v3 contract: parameters on descriptor 0, timed metrics, the event''s base'
contexte: 'The common judge''s next version (juge-v3: ruche-0036, 0037, 0038, 0117) changes the contract between the
  judge and a fork''s harness and plugin. In minizBee: the harness reads its parameters as one fixed-length record from
  descriptor 0, copies what it needs and erases it before calling the library, and writes the same outputs at the same
  paths in every mode; the plugin checks every output, and each fixed metric (a ratio, memory) is also computed by the
  scenario from its timed outputs; bee-ci.yml passes the pull request''s own base and head SHAs (the event''s, not a
  merge base), and its verdict job checks the judging job''s report with `rapport.py --verifier`. Pin juge-v3 only once
  the council has tagged it; until then the fork stays on juge-v2.'
fichiers:
- .github/workflows/bee-ci.yml
- bee/juge/
- bee/ci/
- bee/README.md
portee: 0.8
metrique: null
depend_de:
- ruche-0117
critere_acceptation:
- the fork's CI judges an honest PR identically to juge-v2 on the same commits, and refuses the judge's meta-test variants
- the verdict job refuses a report whose hash differs from the judging job's outputs
- independent review attached
hors_perimetre:
