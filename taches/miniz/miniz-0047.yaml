titre: 'minizBee moves to the common judge juge-v2: pinned commit, declared corpus history, no fetch'
contexte: 'The registry''s common judge is juge-v2 since ruche-0024 (registry PR #126, merged at dab13a6 on 2 Nov 2026):
  juge.yml reads the judge at its own commit and refuses one that is not on the registry''s main, and a fork declares
  the git commits its plugin needs (`historique`), which juge.yml checks in the base''s ancestry and fetches in a step
  of its own, before any file of the PR; during judging, git has no transport. minizBee still calls juge.yml at juge-v1
  (821647d) and its plugin fetches the corpus commit 2948eeb on the host while judging (the workaround of miniz-0032).
  Pin bee-ci.yml''s juge job and JUGE_COMMUN_SHA (isoler.sh, image) to dab13a6, declare 2948eeb as history, remove the
  plugin''s fetch (a missing commit is an environment error), tie the declared history to COMMIT_CORPUS by a test, and
  update bee/README.md. A council change to the fork''s CI, merged by the council: minizBee PR #22.'
fichiers:
- .github/workflows/bee-ci.yml
- bee/juge/projet.py
- bee/ci/
- bee/README.md
- bee/juge/test_juge.py
portee: 0.9
