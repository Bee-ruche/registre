critere_acceptation:
- 'the fork''s CI passes on the PR: the common judge (juge-v2) fetches the declared history in its own step and gives
  code 0 on master''s code, with the same counts as juge-v1 (outputs compared, instructions)'
- no git fetch remains in the plugin; a test ties the declared history to COMMIT_CORPUS
- bee/README.md describes juge-v2 and the declared history; no stale juge-v1 statement is left
- independent review attached; merged by the council
