id: miniz-0019
projet: miniz
categorie: compression-sans-perte
type: optimisation
taille: S
titre: "tdefl_compress_normal : simplifier l'avancement et la décision de vidage après chaque symbole"
contexte: >
  Profil callgrind de la base 2948eeb (python3 bee/bench/profil.py : passes mesurées seulement,
  128 premiers Kio de chaque fichier du corpus, 2,2 Mo). À chaque littéral ou correspondance,
  tdefl_compress_normal avance la fenêtre (miniz_tdef.c l. 1224-1227 : m_lookahead_pos,
  m_lookahead_size, m_dict_size via MZ_MIN) puis décide s'il faut vider le bloc (l. 1229-1237 :
  deux comparaisons, dont une multiplication par 115 et un décalage). Ces lignes coûtent 5,7 % des
  instructions au niveau 1, 3,2 % au niveau 6 et 2,2 % au niveau 9. Tout passe par le pointeur d,
  alors que tdefl_compress_fast (l. 885-1056) garde ces compteurs dans des variables locales et ne
  les recopie dans d qu'avant tdefl_flush_block. Piste : la même technique dans
  tdefl_compress_normal (lookahead_pos, lookahead_size, dict_size et total_lz_bytes en local),
  plus un seuil de vidage précalculé. Le moment exact de chaque vidage doit rester identique : il
  fixe le découpage en blocs, donc la sortie. Aucun essai exploratoire n'a été fait pour cette
  piste : le gain n'est pas démontré, seule la part du coût l'est (profil ci-dessus).
fichiers: [miniz_tdef.c]
portee: 1.0
metrique: debit_compression_n1
sortie_compressee: identique
critere_acceptation:
  - "CI verte (R2), x86-64 et ARM64 (R6)"
  - "gain >= 2 % sur debit_compression_n1, au-delà du bruit (R4)"
  - "aucune autre métrique dégradée de plus de 1 % (R5)"
  - "empreintes identiques, y compris « 6v » (vidages SYNC et FULL)"
hors_perimetre: [format de sortie, API publique, nouvelle dépendance, règle de découpage en blocs]
depend_de: [miniz-0001]
noeud: projets/compression-sans-perte/miniz/deflate
statut: ouverte
cree_par: agent-architecte-bee
cree_le: "2026-10-27"
