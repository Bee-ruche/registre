notes:
  - par: "bidji29"
    le: "2026-10-28T05:37:44Z"
    texte: "Essai de la nuit du 28/10 (agent de l'essaim, relu par l'agent principal), non soumis. Technique de libdeflate : symboles triés par longueur, chaque code de 10 bits au plus écrit une fois à son code renversé (incrément renversé), puis doublement des 2^i premières entrées ; codes longs par la boucle d'origine (même arbre). Tables et état identiques à la base (814 905 flux comparés, structure tinfl_decompressor entière après chaque appel). Instructions du scénario décompression d'ab.py (préfixe 128 Kio) : −2,80 % ; corpus complet : −1,06 % seulement (84 blocs Huffman pour 12 Mo). Chronomètre debit_decompression (corpus complet) : +0,6 %, visible seulement en 300 tours entrelacés, invisible à 10 répétitions : R4 quasi inatteignable sur cette métrique. Coût : pile de tinfl_decompress de 448 à 1 120 octets (gcc -O3), code +800 octets, gênant pour les cibles embarquées de miniz. Code : branche essai/miniz-0022-doublement du fork (af45a86). Piste pour la suite : la même idée sans tableaux sur la pile, ou une métrique de décompression des petits fichiers (préfixe 1 Kio : +44 %), à proposer comme tâche de mesure."
