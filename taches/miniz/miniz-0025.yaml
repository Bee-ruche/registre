id: miniz-0025
projet: miniz
categorie: compression-sans-perte
type: test
taille: M
titre: "Fuzzing de l'état de flux : changer de vidage et de tampons en cours de compression"
contexte: >
  Le harnais bee/fuzz/fuzz_compression.c garde la même taille de tampon et la même politique de
  vidage pour toute une entrée. Or l'état de tdefl (m_output_flush_remaining, m_lookahead_size,
  m_saved_match_len, miniz_tdef.c l. 1266-1332 et 1185-1222) dépend de la suite exacte des appels.
  Écrire un troisième harnais, bee/fuzz/fuzz_flux.c : les octets de l'entrée pilotent une suite
  d'appels mz_deflate (taille d'entrée, taille de sortie au moins 8 octets avec MZ_SYNC_FLUSH,
  comme l'exige le manuel de zlib, choix entre MZ_NO_FLUSH, MZ_SYNC_FLUSH, MZ_FULL_FLUSH et
  MZ_FINISH), puis vérifient que zlib décompresse le tout en la donnée d'origine, et que la sortie
  sans vidage est identique à mz_compress2. L'ajouter à bee/fuzz/lancer.sh et au Makefile (cibles
  fuzz-libfuzzer et fuzz-gcc). Le harnais doit tourner 60 s sans faux positif sur la base.
fichiers: [bee/fuzz/fuzz_flux.c, bee/fuzz/lancer.sh, bee/Makefile]
portee: 0.6
metrique: null
critere_acceptation:
  - "CI verte (R2), fuzzing compris, sur la base et sur cette contribution"
  - "le nouveau harnais tourne 60 s sur la base sans écart (journal joint)"
  - "une mutation de tdefl_flush_output_buffer (par exemple un octet perdu) est détectée en moins de 60 s"
  - "aucune entrée fautive publiée (procédure de docs/securite.md du registre en cas de défaut)"
hors_perimetre: [code de miniz, harnais existants, nouvelle dépendance]
depend_de: [miniz-0001]
noeud: projets/compression-sans-perte/miniz/api
statut: ouverte
cree_par: agent-architecte-bee
cree_le: "2026-10-27"
