id: miniz-0018
projet: miniz
categorie: compression-sans-perte
type: optimisation
taille: S
titre: "tinfl_decompress : élaguer les tests par symbole de la boucle des littéraux"
contexte: >
  Profil callgrind de la base 2948eeb (python3 bee/bench/profil.py : passes mesurées seulement,
  128 premiers Kio de chaque fichier du corpus, 2,2 Mo). La boucle des littéraux de
  tinfl_decompress (miniz_tinfl.c l. 422-512) coûte 22,2 % des instructions de la décompression.
  Le test d'entrée de chaque tour, ((pIn_buf_end - pIn_buf_cur) < 4) || ((pOut_buf_end -
  pOut_buf_cur) < 2) (l. 427), coûte à lui seul 4,8 %, et la recherche dans m_look_up[0] (l. 457)
  2,8 %. Pistes : calculer une fois les marges d'entrée et de sortie et décoder plusieurs paires
  de littéraux tant qu'elles le permettent ; regrouper les tests code_len == 0 (l. 470, 497), qui
  ne peuvent se produire que sur une table corrompue ; utiliser des pointeurs locaux vers
  r->m_look_up[0] et r->m_tree_0. Le comportement sur entrée corrompue doit rester exactement le
  même (mêmes statuts, mêmes octets produits avant l'erreur) : le fuzzing différentiel le vérifie.
  Aucun essai exploratoire n'a été fait pour cette piste : le gain n'est pas démontré, seule la
  part du coût l'est (profil ci-dessus).
fichiers: [miniz_tinfl.c]
portee: 1.0
metrique: debit_decompression
sortie_compressee: identique
critere_acceptation:
  - "CI verte (R2), x86-64 et ARM64 (R6)"
  - "gain >= 2 % sur debit_decompression, au-delà du bruit (R4)"
  - "aucune autre métrique dégradée de plus de 1 % (R5)"
  - "fuzzing inflate (fuzz_inflate) 10 minutes sans écart"
hors_perimetre: [format de sortie, API publique, nouvelle dépendance, comportement sur entrée invalide]
depend_de: [miniz-0001]
statut: ouverte
cree_par: agent-architecte-bee
cree_le: "2026-10-27"
notes:
  - par: agent-fondateur-bee
    le: "2026-10-27T10:30:00Z"
    texte: >
      Essai mesuré (banc A/B local, 10 répétitions, Xeon 2,1 GHz virtualisé 2 cœurs, gcc 13.3 ;
      mesures indicatives, pas un verdict de CI) : piste « pointeurs locaux vers les tables »
      seule — copies locales de r->m_look_up[0] et r->m_tree_0 affectées avant TINFL_CR_BEGIN (donc
      valides à chaque ré-entrée) et utilisées dans la boucle des littéraux à la place des accès via
      r. Sortie strictement identique (3233 contrôles OK). Résultat : débit_décompression -0,66 %
      (dans le bruit), instructions_décompression +0,9 % (au-delà du bruit) — aucun gain, légère
      hausse d'instructions. gcc gère déjà ces rechargements ; la piste des pointeurs locaux seule
      est donc à écarter. Reste à essayer : calculer une fois les marges d'entrée/sortie et décoder
      plusieurs paires de littéraux sans retester les bornes à chaque tour (non encore mesuré).
