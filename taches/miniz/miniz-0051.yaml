titre: 'minizBee''s CI: a manifest is a regular file; each file is read only from the job that makes it'
contexte: 'Follow-up of libyaml-0020 (review of 8 Nov 2026), which hardened libyamlBee this way. In minizBee: the manifest
  must be a regular file (not a symbolic link or a folder) before anything reads or copies it (manifeste.sh, the workflow''s
  keep step, tache.py), and every file the verdict reads outside CI''s fixed paths is read only from the artifact of the
  job that produces it.'
