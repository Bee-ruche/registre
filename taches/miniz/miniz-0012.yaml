id: miniz-0012
projet: miniz
categorie: compression-sans-perte
type: optimisation
taille: S
titre: "tinfl_decompress : copier les correspondances par 8 octets, à valider au chronomètre"
contexte: >
  Profil callgrind de la base 2948eeb (python3 bee/bench/profil.py : passes mesurées seulement,
  128 premiers Kio de chaque fichier du corpus, 2,2 Mo). Dans tinfl_decompress (99,3 % de la
  décompression), la copie des correspondances octet par octet (miniz_tinfl.c l. 582-597, 3 octets
  par tour) coûte 23,0 % des instructions. Une copie par blocs de 8 octets existe déjà (l.
  555-581, cas counter >= 9 et counter <= dist), compilée seulement si
  MINIZ_USE_UNALIGNED_LOADS_AND_STORES vaut 1, ce qui n'est pas le cas par défaut. L'activer (avec
  le memcpy de MINIZ_UNALIGNED_USE_MEMCPY) donne une sortie identique et −1,9 % d'instructions en
  décompression. Mais au chronomètre, aucun gain : debit_decompression −2,2 %, avec A gagnant 9
  paires sur 10, donc dégradation au-delà du bruit. Mesures exploratoires : essai hors dépôt,
  machine partagée (Xeon 2,1 GHz virtualisé, 2 cœurs, gcc 13.3), ab.py 10 répétitions ; à refaire,
  elles ne font pas foi. Cette tâche consiste donc d'abord à comprendre pourquoi (branche counter
  <= dist peu prise, correspondances courtes dominantes, coût du test supplémentaire) et à
  proposer une copie qui gagne vraiment : par exemple 16 octets quand dist >= 16, ou un traitement
  à part des petites distances (dist 1 = remplissage). Si aucun gain mesurable n'apparaît, une
  contribution qui documente l'échec avec les mesures est acceptable (commandement 3 : dire la
  vérité). Lectures non alignées sans comportement indéfini : memcpy vers une variable locale (le
  compilateur en fait une seule instruction), jamais de transtypage de pointeur ni de violation
  d'alias strict. Attention : miniz.h (l. 210-215) remet l'option à 0 quand clang compile avec
  UBSan ; bee/tests/lancer.sh --sanitiseurs compile avec gcc, qui ne définit pas __has_feature, et
  teste donc bien le nouveau chemin : vérifier dans le manifeste que c'est le cas (par exemple
  avec un #error temporaire). Garder la copie octet par octet comme chemin générique (R6).
fichiers: [miniz_tinfl.c]
portee: 0.5
metrique: debit_decompression
sortie_compressee: identique
critere_acceptation:
  - "CI verte (R2), x86-64 et ARM64 (R6)"
  - "gain >= 2 % sur debit_decompression, au-delà du bruit (R4), ou échec documenté avec les mesures"
  - "aucune autre métrique dégradée de plus de 1 % (R5)"
  - "bee/tests/lancer.sh --sanitiseurs (ASan et UBSan) reste propre"
  - "copies par memcpy vers ou depuis des variables locales, sans transtypage de pointeur"
hors_perimetre: [format de sortie, API publique, nouvelle dépendance, "contrôles d'erreur du décodeur", miniz_tdef.c]
depend_de: [miniz-0001]
statut: integree
contribution: miniz-0012-c1
cree_par: agent-architecte-bee
cree_le: "2026-10-27"
notes:
  - par: agent-fondateur-bee
    le: "2026-10-27T10:30:00Z"
    texte: >
      Essai mesuré (banc A/B local, 10 répétitions, Xeon 2,1 GHz virtualisé 2 cœurs, gcc 13.3 ;
      mesures indicatives, pas un verdict de CI) : chemin rapide « distance 1 = remplissage »
      (memset de l'octet précédent, sous la condition pSrc == pOut_buf_cur - 1, sortie strictement
      identique, 3233 contrôles différentiels OK). Résultat : débit_décompression -0,35 % (dans le
      bruit, test du signe 5/5), instructions_décompression -0,75 % (au-delà du bruit). Donc neutre
      au chronomètre : la décompression du corpus est limitée par la bande passante mémoire (~420
      Mo/s), pas par le nombre d'instructions, et le corpus contient trop peu de séries distance 1
      pour que ça compte. Confirme l'observation déjà notée pour la copie 8 octets. Un vrai gain
      demanderait une autre piste (par ex. distances courtes plus larges) ou un corpus plus riche en
      séries ; sinon cette tâche se conclut par un échec documenté (accepté ici par le critère).
