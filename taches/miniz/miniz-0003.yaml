id: miniz-0003
projet: miniz
categorie: compression-sans-perte
type: mesure
taille: S
titre: "Mesurer le bruit du banc A/B sur d'autres machines"
contexte: >
  La règle R4 refuse un gain qui reste dans le bruit, mais le bruit n'a été mesuré que
  sur la machine qui a créé le banc. Lancez bee/bench/ab.py en comparant la base à
  elle-même (test A/A) sur votre machine, au moins 3 fois, avec et sans --instructions.
  Rapportez pour chaque métrique l'écart relatif maximal observé et la configuration
  (processeur, système, compilateur, charge). Si le bruit dépasse 2 % sur une métrique,
  proposez dans une note un réglage (nombre de répétitions, sous-corpus, méthode de seuil).
fichiers: [bee/bench/ab.py]
portee: 0.8
metrique: null
critere_acceptation:
  - "résultats des 3 tests A/A joints au manifeste, avec la configuration de la machine"
  - "écart relatif maximal par métrique, calculé et non estimé"
  - "aucune modification de bee/bench/ab.py dans cette contribution (mesure seule)"
hors_perimetre: [modifier le banc, modifier miniz]
depend_de: [miniz-0001]
statut: ouverte
cree_par: conseil
cree_le: "2026-10-27"
