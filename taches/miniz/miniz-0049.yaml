id: miniz-0049
projet: miniz
categorie: compression-sans-perte
type: test
poste: gouvernance
taille: M
titre: minizBee reads the registry in both layouts (English names, before the switch)
contexte: 'docs/english-migration.md, sections 6 and 12. minizBee''s « Manifeste et taille » job reads registry main, unpinned:
  the tool and its requirements, verifier-fork and its options, taches/**, the task keys type, metrique, sortie_compressee
  and their values. Before the switch, minizBee must read both: tasks/ or taches/, English or French keys and values (mapped
  to its internal French ones), tools/bee.py or outils/bee.py, check-fork --task --head --repo --author or the French command
  and options (asked from bee.py --help, never guessed), whichever requirements file exists, and the manifest under manifests/
  or manifestes/ with English or French keys (one vocabulary per document; mixed is refused). Also: the task copy the verdict
  script reads for the main metric (English or French key), the manifest folder in the R1 exclusions (manifests/** beside
  manifestes/**), and the global --registre option and BEE_REGISTRE (or their English names). A task, metric or type it
  cannot read stops the job with an error: never a default. Names: docs/english-names.md.'
fichiers:
- .github/workflows/bee-ci.yml
- bee/ci/
portee: 0.8
metrique: null
critere_acceptation:
- tests in bee/ci/ run the job's readers on both layouts and on a mixed document (refused)
- an unreadable task, type or metric fails the job, shown by a test
- the open fork PRs are listed in the PR with what each needs to rebase
- an independent adversarial review by an agent of another model than the builder's is attached, with every finding fixed
  or answered; the full test suite passes on the exact head
hors_perimetre:
- COMMANDMENTS.md
