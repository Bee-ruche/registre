id: miniz-0020
projet: miniz
categorie: compression-sans-perte
type: optimisation
taille: S
titre: "tdefl_record_literal et tdefl_record_match : moins d'écritures dans l'état par symbole"
contexte: >
  Profil callgrind de la base 2948eeb (python3 bee/bench/profil.py : passes mesurées seulement,
  128 premiers Kio de chaque fichier du corpus, 2,2 Mo). tdefl_record_literal (miniz_tdef.c l.
  1059-1070) et tdefl_record_match (l. 1072-1098) coûtent ensemble 5,6 % des instructions au
  niveau 1 (2,3 % et 3,3 %) et 2,3 % au niveau 6. Chaque appel lit et réécrit m_pLZ_code_buf,
  m_pLZ_flags, m_num_flags_left et m_total_lz_bytes à travers d. Dans tdefl_record_match, la
  distance passe par deux tables (s_tdefl_small_dist_sym l. 57-70 et s_tdefl_large_dist_sym l.
  83-87) avec un masque & 127 inutile si match_dist < 32768. Pistes : écrire l'octet de longueur
  et les 2 octets de distance en une fois (memcpy de 2 octets, comme le fait déjà
  tdefl_compress_fast l. 954-958) ; éviter de relire *m_pLZ_flags quand le drapeau est déjà connu.
  Le contenu de m_lz_code_buf doit rester identique octet pour octet. Un essai est mesuré dans la
  note du 28/10 ci-dessous : plafond vers 1,5 % d'instructions en moins au niveau 1, sous le seuil
  de R4 ; meilleure variante, 0,73 % d'instructions n1 en moins, mais un recul de 4 % au
  chronomètre (10 paires sur 10) ; la note ne dit ni la métrique de ce recul, ni la machine, ni le
  commit : à remesurer. Le gain n'est donc pas démontré ; seule la part du coût l'est (profil
  ci-dessus).
fichiers: [miniz_tdef.c]
portee: 1.0
metrique: debit_compression_n1
sortie_compressee: identique
critere_acceptation:
  - "CI verte (R2), x86-64 et ARM64 (R6)"
  - "R4 : au moins 2 % d'instructions en moins sur debit_compression_n1 (instructions_n1), que le chronomètre confirme au-delà du bruit (sinon une mesure d'une autre configuration)"
  - "aucune autre métrique dégradée de plus de 1 % (R5)"
  - "bee/tests/lancer.sh --sanitiseurs (ASan et UBSan) reste propre"
hors_perimetre: [format de sortie, API publique, nouvelle dépendance, format de m_lz_code_buf]
depend_de: [miniz-0001]
noeud: projets/compression-sans-perte/miniz/deflate
statut: ouverte
cree_par: agent-architecte-bee
cree_le: "2026-10-27"
notes:
  - par: "bidji29"
    le: "2026-10-28T02:46:30Z"
    texte: "Essai de l'essaim de nuit (28/10, agent Claude Opus 5.5) : au niveau 1, tdefl_record_literal et tdefl_record_match pèsent environ 5,3 % des instructions ; même tout l'évitable retiré, le plafond est vers 1,5 % d'instructions, sous le seuil de R4. Meilleure variante (correspondance en locales, branchement sur la distance) : -0,73 % d'instructions n1 mais -4 % au chronomètre (10 paires sur 10, R5) ; le cmov d'origine était le bon choix. État LZ en locales dans tdefl_compress_normal : +0,22 % (débordements de registres). À fusionner avec miniz-0019 ou à fermer."
  - par: "bidji29"
    le: "2026-10-30T18:11:26Z"
    texte: "Répétition générale n° 3 (30/10) : le plafond connu de cette tâche est sous le seuil de R4 (2 % d'instructions en moins sur la métrique visée) : la boucle visée pèse environ 1,5 % (miniz-0020) ou 1,7 % (miniz-0021) des instructions au niveau 1 (profil de la base 2948eeb, zone deflate). Une contribution seule ne passera pas R4 ; à combiner avec une autre piste du même scénario, ou à prendre pour apprendre. Le marquage par bee lister est la tâche ruche-0030."
