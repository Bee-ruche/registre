id: miniz-0032
projet: miniz
categorie: compression-sans-perte
type: test
taille: L
titre: "minizBee passe au juge commun : greffon, harnais et appel du workflow juge.yml@juge-v1"
contexte: >
  Spécification : docs/juge-commun.md du registre. La partie commune existe dans le registre
  (outils/juge/ : isolement, lanceur chrono, lecture sûre, analyse des objets, graine,
  statistiques, rapport ; workflow réutilisable .github/workflows/juge.yml ; méta-tests sur un
  projet jouet, outils/juge/jouet/, qui est aussi le modèle d'un greffon), étiquetée juge-v1. Reste
  la part du fork. (1) bee/juge/ réduit à ce qui est propre à miniz : projet.py (le greffon),
  execution.c (le harnais, inchangé), construire.sh (en-têtes de la base dans /outillage/base) et
  test_juge.py (les méta-tests de miniz, qui lancent le juge commun au lieu de bee/juge/juge.py) ;
  Dockerfile, chrono.c, analyse.py, juge.py et isoler.sh disparaissent du fork (la CI prend
  isoler.sh dans le registre, à l'étiquette). Un greffon d'essai, vérifié identique au juge v2 à
  graine égale le 28/10 (2 378 sorties comparées, décomptes d'instructions de A et de B identiques
  sur les quatre scénarios), est sur la branche essai/juge-commun du fork : partir de lui.
  (2) bee-ci.yml : le juge devient un job qui appelle
  Bee-ruche/registre/.github/workflows/juge.yml@juge-v1 (options : sortie_compressee du manifeste) ;
  le verdict lit l'artefact « juge » (juge.json et code) ; bee/ci/verdict.py reporte juge.commun.
  (3) bee/README.md : modèle de menace mis à jour (ce qui est dans le registre, ce qui reste ici).
  La PR modifie bee/juge/ : elle introduit le greffon (règle d'introduction de bee/ci/juges.sh,
  amorçage) et doit être jugée par l'ancien juge de la base ET par le juge commun.
fichiers: [bee/juge/, bee/ci/, .github/workflows/bee-ci.yml, bee/README.md]
portee: 1.0
metrique: null
critere_acceptation:
  - "CI verte (R2) ; sur cette PR, l'ancien juge (base) et le juge commun (greffon de la PR, amorçage) rendent tous deux un verdict juste"
  - "à graine égale (--graine), le juge commun donne sur une PR honnête le même nombre de sorties comparées et les mêmes décomptes d'instructions (A et B, chaque scénario) que le juge de miniz-0031 : comparaison jointe à la PR"
  - "les 7 méta-tests de minizBee (sortie anticipée, faux chronos, table précalculée, requête Valgrind, faux résumé, travail déplacé, honnête) passent contre le juge commun"
  - "le greffon est lu depuis la base de la PR, jamais depuis la PR ; modèle de menace de bee/README.md mis à jour"
hors_perimetre: [code de miniz, outils/juge/ du registre (tâche d'outillage du registre), changement des métriques suivies, nouvelle dépendance hors image]
depend_de: [miniz-0031]
statut: en_relecture
contribution: miniz-0032-c1
cree_par: conseil
cree_le: "2026-10-28"
notes:
  - par: "bidji29"
    le: "2026-10-28T22:33:28Z"
    texte: "28/10 au soir : le juge isolé (miniz-0031) est intégré sur master (PR #7, 978d90e). En passant au juge commun, retirer aussi le CONTRIBUTION.yaml laissé à la racine de master par les premières contributions : les manifestes vont dans manifestes/<tâche>.yaml. Rappel : une PR qui modifie un workflow de CI n'est jamais fusionnée automatiquement ; le conseil la fusionne après la relecture d'un gardien."
  - par: "bidji29"
    le: "2026-10-30T02:05:31Z"
    texte: "30/10, revue adverse de miniz-0033 (minizBee PR #9, fusionnée) : la CI lance test_profil.py derrière un garde « if [ -f base/bee/bench/test_profil.py ] », qui sauterait le test sans bruit si le fichier disparaissait. En passant au juge commun, retirer ce garde (ou faire échouer l'étape quand le fichier manque)."
