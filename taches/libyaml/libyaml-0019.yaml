titre: 'English bee/ folder: README, sandbox, bench and test messages'
contexte: 'Founder''s decision of 31/10: the hive moves to English now, before the first outside bee. The place
  is La Ruche; the tool and the agents stay `bee`. The commandments are authoritative in English (PR #91, for the
  council to merge); any other text is authoritative in English as soon as its English version is on main. The fork''s
  bee/ folder (README.md, Makefile help, sandbox, bench, tests and CI scripts) speaks French. Translate what a bee
  reads or sees printed into English, keeping every command, path and number. The CONTRIBUTION.yaml keys stay as
  they are: their renaming is planned by ruche-0060. No change to libyaml itself, and none to the judge being built
  (libyaml-0013 to libyaml-0018), which is written in English from the start where it is still to be written.'
