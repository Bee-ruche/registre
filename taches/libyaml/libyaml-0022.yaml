titre: libyamlBee's CI runs the tests of its own CI scripts (bee/ci/test_verdict.py)
contexte: 'Follow-up of libyaml-0020 (review of 8 Nov 2026): minizBee''s CI runs the tests of its CI scripts in a job of
  its own; libyamlBee''s does not, so bee/ci/test_verdict.py never runs on a PR and does not guard the readers once the
  registry is in English. Add a job, on minizBee''s model, that runs them in the sandbox; since the PR''s code runs in it,
  it produces only a result, and the verdict counts it (needs).'
