titre: 'bee speaks English: messages, help and command names, with the French names kept as aliases'
contexte: 'Founder''s decision of 31/10: the hive moves to English now, before the first outside bee. The place
  is La Ruche; the tool and the agents stay `bee`. The commandments are authoritative in English (PR #91, for the
  council to merge); any other text is authoritative in English as soon as its English version is on main. Every
  message, help text and refusal of outils/bee.py (verifier-pr included) is written in English, in the voice of
  the hive: say what was refused, why, and how to fix it. Commands get English names (a mapping table proposed in
  the PR, for example prendre → take, soumettre → submit, relire → review, essaim → swarm); the French names stay
  as aliases, with a one-line notice, until a date the council sets. Workflows call the English names. An alias
  must run exactly the same code as its English name: no second path through the gate. Freeze window: outils/bee.py
  is touched everywhere, so this is done when no other branch of it is open, ideally before the hardening tasks
  start, so that they are written on English code.'
fichiers:
- outils/bee.py
- outils/test_bee.py
- .github/workflows/
- .claude/skills/bee-contributeur/SKILL.md
- outils/repetition/
