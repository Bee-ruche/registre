- no French left in what bee prints, apart from the task, note and argument texts it quotes; checked by a script
  in the tests
- each French name runs the same function as its English name, with the same arguments (test over the whole table)
- the full test suite passes; the replay of ruche-0053 passes too if it exists by then
- independent adversarial review attached (the gate's code and the workflows change)
