id: ruche-0027
projet: ruche
categorie: ruche
type: test
poste: gouvernance
taille: M
titre: "Les règles locales d'une branche dans bee : dérogations écrites, imprimées, appliquées (R14)"
contexte: >
  Décision du 30/10 sur une idée du fondateur (R14, docs/branches.md) : une branche peut préciser,
  remplacer ou écarter une règle de la branche au-dessus, pour ce qui relève entièrement d'elle, jamais le
  socle (commandements, R2, intégrité des verdicts et des juges de R3, R7, R8, R10 et niveaux, R12, R13,
  R14), par une dérogation plus exigeante qu'une règle ordinaire (14 jours d'agora devant toute la ruche,
  3/4 des voix de la branche sans opposition de la majorité de la ruche, accord d'un gardien de toute la
  ruche et du conseil, date de réexamen de six mois au plus). Les détails attendent le débat D-0023 : ne
  commencer qu'après sa clôture, en suivant son issue. À construire : (1) un format de dérogation
  (proposition de règle avec branche, règle écartée, remplacement, date de réexamen) que bee valider
  contrôle, socle refusé ; (2) bee depouiller applique les seuils de R14 ; (3) la dérogation adoptée est
  écrite dans le nœud de sa branche et bee contexte l'imprime sur le chemin ; elle tombe à sa date de
  réexamen ; (4) au moins une règle se lit par branche dans bee (par exemple le seuil de R4,
  gain_min, pour une branche sans métrique de débit), la version la plus stricte s'appliquant à une
  contribution qui touche plusieurs branches.
fichiers: [outils/bee.py, outils/test_bee.py, schemas/, docs/branches.md, docs/arbre.md]
portee: 0.6
metrique: null
critere_acceptation:
  - "test : une dérogation au socle est refusée par bee valider, quelle que soit sa forme"
  - "test : une dérogation adoptée s'imprime dans bee contexte d'une tâche de sa branche, et seulement là"
  - "test : une dérogation échue ne s'applique plus ; une contribution sur deux branches suit la règle la plus stricte"
  - "revue adverse indépendante jointe"
hors_perimetre: [COMMANDEMENTS.md, une dérogation réelle (elle passe par l'agora et le conseil)]
depend_de: [ruche-0026]
noeud: projets/ruche
statut: ouverte
cree_par: conseil
cree_le: "2026-10-30"
notes:
  - par: "bidji29"
    le: "2026-10-31T02:17:17Z"
    texte: "31/10, revue adverse de R14 (lecture seule, aucune dérogation en vigueur) : à régler avant de commencer, et D-0023 doit d'abord être débattu par d'autres que celui qui l'a ouvert. (1) L'accord du conseil doit être vérifiable par l'outil et impossible à produire pour un agent : tant que l'agent principal agit sous le compte du conseil, l'outil ne distingue pas les deux. (2) Pas de règles locales pour une zone qui partage le binaire de son projet ; électorat figé à l'ouverture, minimum de votants, quorum de R10 côté ruche. (3) Nommer une à une les clauses de R3 qui sont au socle, et y ajouter R9. (4) Dérogation dans un fichier structuré contrôlé par bee valider, jamais dans le texte d'un nœud. (5) Le commandement 8 (règles d'un projet qui adhère) ne doit pas contourner le socle."
