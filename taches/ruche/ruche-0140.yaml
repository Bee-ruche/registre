titre: 'Removal of a person''s data, round 2: a name found whatever surrounds it, comments kept in place'
contexte: Follow-up of the review of ruche-0116 (PR 181; details in the architect's brief). Two things to hold. A
  removal (bee retirer-donnees) finds every passage that names the person in a free text or a YAML comment, whatever
  character stands next to it, and the gate counts it the same way. A flagged comment is deleted or marked where it
  stands - comparing a file's comments before and after takes their place into account, so a removal PR moves no
  comment.
