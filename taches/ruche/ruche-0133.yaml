titre: 'Pushes to main checked like PRs: data-only pushes take the fast path, code pushes the suite'
contexte: 'Write path at scale, step 1, task E25b (docs/architecture.md, section 4, step 1; ruche-0097, decided by the
  council on 2 Nov 2026). Requirement R-push, part 2. Once robots push under the App, pushes start `push` workflows.
  `validation.yml` and `site.yml` run `ci_scope` on the range a push moved: a data-only range runs `bee valider` and
  the live-registry tests; a code range, an unreadable range or a new branch dispatches `suite.yml` on the pushed commit;
  the site is rebuilt at once for a code push (data-only pushes follow E2''s interval).'
