metrique: null
critere_acceptation:
- 'unit tests: a data-only push range gives the fast path; a code range, a new branch or an unreadable range gives the
  full suite'
- on a fork of the registry, a data-only push runs the fast path and a code push dispatches suite.yml, run ids and timings
  in the PR
- after merge, the same measure on main is added as a note on this task within 3 days; a shortfall becomes its own task
- independent adversarial review attached; the full test suite passes
