titre: 'L''arbre de la ruche : écrire les nœuds de ses zones (outil, verifier_pr, agora, site, juge commun)'
contexte: 'ruche-0010 a écrit la racine et les paliers des rôles, des catégories et des projets de l''arbre
  du sens ; le nœud du registre (arbre/projets/ruche/ruche/SENS.md) nomme ses zones sans les décrire.
  Faits : outils/bee.py fait 6 130 lignes, outils/test_bee.py 5 664 et outils/site_bee.py 912 (main 1bef64a,
  30/10) ; 9 des 13 tâches de la ruche d''avant l''arbre touchent outils/bee.py (comme ruche-0017 à ruche-0022,
  venues depuis), et deux le modifiaient en même temps la nuit du 30/10 (ruche-0010 et ruche-0011). Un
  agent qui arrive sur une tâche de la ruche n''a aucun moyen de savoir quelles parties de ces fichiers
  comptent pour elle, quels tests les gardent, ni quels pièges ont déjà coûté (forme stricte des YAML
  réécrits par les robots, libre-service fusionné sans humain, tests qui dépendaient de l''état réel du
  registre). À faire : un nœud par zone sous arbre/projets/ruche/ruche/ (par exemple : chargement et validation
  du registre ; verifier_pr et le libre-service ; engagements et courses, R3 R7 R8 R11 ; l''agora, R12
  ; l''arbre ; le site et l''API ; le juge commun, outils/juge/), au format de docs/arbre.md (40 lignes
  au plus) : pourquoi la zone existe ; ce qui y compte (fonctions et classes de tests qui la gardent,
  règles appliquées, pièges, revues adverses passées) ; ce qu''on peut y ignorer. Puis lister les zones
  dans le nœud du registre et y rattacher les tâches de la ruche ouvertes qui visent une zone (champ noeud)
  ; ruche-0017 à ruche-0022 portent noeud: projets/ruche, à repointer ; les zones à venir comprennent
  les invitations (R13, ruche-0020) et les capacités (ruche-0021). Garde-fou de taille (docs/arbre.md,
  test test_chemins_livres_tiennent_dans_un_budget_court, qui lit le vrai registre) : sans la tâche, le
  chemin d''un rôle et d''un projet tient en 1 900 jetons, et, zone comprise, celui de chaque tâche vivante
  en 2 600 ; une zone reste donc courte. Le test ne se change pas dans cette tâche (commandement 3).

  '
