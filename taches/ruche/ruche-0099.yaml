critere_acceptation:
- on a registry of 10,000 tasks generated by the load test (ruche-0080), a one-gesture check takes at most 0.5 s within
  a pass; numbers with commands and hardware in the PR (commandment 2)
- an incremental state out of step with the files is refused, never trusted
- every check of the full validation still runs on every push to main and once at the end of each pass; tested
- independent adversarial review attached; the full test suite passes
hors_perimetre:
- the history checks (E24)
- the write path's other tasks
- COMMANDMENTS.md
