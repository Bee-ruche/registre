taille: M
titre: 'bee reads only what it needs: an index and a validation of what changed'
contexte: 'Measured on 1 Nov 2026: every bee command loads and validates the whole registry (0.5 s to load and 1.2 s
  to validate with 146 tasks), and the time grows with every task, contribution and debate. With thousands of bees the
  registry will hold thousands of tasks: minutes per command for every bee, and for every check. Make bee read only what
  a command needs (an index of tasks and contributions, kept consistent with the files and checked by bee valider), and
  make bee verifier-pr validate the files a PR changes plus what they reference, while a push to main still validates
  everything.'
fichiers:
- outils/bee.py
- outils/test_bee.py
- docs/outillage.md
portee: 0.8
metrique: null
