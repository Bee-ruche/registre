taille: M
titre: bee loads the registry once per pass and checks a one-gesture PR in 0.5 s
contexte: 'Measured on 1 Nov 2026: every bee command loads and validates the whole registry (0.5 s to load and 1.2 s
  to validate with 146 tasks), and the time grows with every task, contribution and debate. Council''s rewording of 2
  Nov 2026, from ruche-0097''s design (docs/architecture.md, section 4, step 1): a fusion pass (E1, ruche-0120) loads
  the registry once with E8''s fast loader (ruche-0130), applies each PR''s change incrementally, and re-checks the result
  against a fresh load at the end of the pass; `bee verifier-pr` validates what a PR changes and what it references,
  while a push to main still validates everything. The history checks are E24 (ruche-0131).'
fichiers:
- outils/bee.py
- outils/test_bee.py
- .github/workflows/fusion-auto.yml
- docs/outillage.md
