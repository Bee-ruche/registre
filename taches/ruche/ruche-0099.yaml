critere_acceptation:
- on a registry of 10,000 tasks generated by the load test (ruche-0080), bee contexte, bee prendre and bee verifier-pr
  on a one-gesture PR take under a few seconds; numbers in the PR
- an index out of step with the files is refused by bee valider, never trusted
- every check of the full validation still runs on every push to main; tested
- independent adversarial review attached; the full test suite passes
