titre: 'Verdicts: a PR''s list of changed files is read whole, or the PR counts as touching its judges'
contexte: Follow-up of ruche-0086's review (details in the architect's brief). verdicts.yml reads a fork PR's changed
  files from GitHub's API to decide whether the PR touches its judges (bee enregistrer-verdict --fichiers). GitHub's
  list of a PR's files has a maximum length. Compare the list with the PR's own count of changed files, and treat a PR
  whose list may be incomplete as touching its judges.
