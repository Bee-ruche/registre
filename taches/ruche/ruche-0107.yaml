taille: M
titre: 'R4: a measurement counts for the commit it measured, and a measurer can measure a later commit'
contexte: 'Follow-up of ruche-0042''s review. A measurement of a contribution (mesures/<contribution>/<login>.yaml) counts
  for R4''s reproduction whatever commits it says it measured, and since ruche-0042 it is final: one file per person
  and contribution, never changed. So a measurement of an earlier commit counts for a later one, and an honest measurer
  can never measure the author''s next commit. Bind a measurement to the commit it measured: one file per person and
  measured commit, and R4 counts only a measurement whose candidate commit is the judged one (the verdict''s sha) and
  whose base is the verdict''s base. Measurements already on main stay valid.'
