titre: 'R4: who may reproduce a gain (a minimum standing for the measurer), proposed to the council'
contexte: Follow-up of ruche-0042's review. R4 counts a measurement by any other person who states a configuration; a
  second account at least 90 days old can register and reproduce any gain, and the configuration it states is never checked.
  Propose to the council a minimum standing for a measurer whose measurement counts for R4 (a level from docs/reputation.md,
  or a guardian's or a confirmed member's countersignature), with its cost for a hive that has few members, then build
  what the council decides.
