id: ruche-0102
projet: ruche
categorie: ruche
type: test
poste: gouvernance
taille: M
titre: 'Free-text detectors: stop refusing ordinary technical text, keep catching real contact details'
contexte: 'Found while building ruche-0044 and ruche-0049. The detectors of contact details in free texts (texte_recevable,
  texte_sortant_refuse) refuse text that bees write every night: a list of task numbers or issue numbers, a 40-character
  commit SHA, a count of instructions or bytes of nine digits or more read as a phone number, and the git address git@github.com
  read as an e-mail address. Each false refusal costs a bee a rewrite and teaches it to work around the detector. Make
  these honest forms pass without letting a real phone number or address through, and keep every detector''s time linear
  in the text''s length.'
fichiers:
- outils/bee.py
- outils/test_bee.py
- docs/outillage.md
portee: 0.7
metrique: null
depend_de:
- ruche-0044
critere_acceptation:
- 'test: task-number lists, commit SHAs, large counts with or without thousands separators, and git@github.com:Bee-ruche/...
  pass in every free text'
- 'test: every phone number and e-mail address the current tests catch is still caught, including the disguised forms;
  a differential check on generated strings shows no new acceptance outside the honest forms above'
- 'test: a free text at its size bound is checked in well under a second by every detector'
- independent adversarial review attached, made with the architect's brief; the full test suite passes
hors_perimetre:
- COMMANDMENTS.md
- the detection of names of people (ruche-0047)
noeud: projets/ruche/ruche
statut: ouverte
cree_par: conseil
cree_le: '2026-11-01'
