titre: An invitation refused, silent or withdrawn closes its own debate through a guardian or the council
contexte: Follow-up of ruche-0050 (an invitation's debate is its own). When an invitation ends without being accepted
  (refused, silent, withdrawn on request), its debate can stay open, with no one bound to close it. Such a debate is
  closed by a guardian or the council, with the issue "sans suite"; until then it takes no new argument, bee debats
  and bee essaim show it as waiting for that closing, and bee valider warns while it stays open.
