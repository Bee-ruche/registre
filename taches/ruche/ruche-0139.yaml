titre: An invitation refused, silent or withdrawn closes its own debate through a guardian or the council
contexte: Follow-up of ruche-0050 (an invitation's debate is its own). When an invitation ends without being accepted
  (refused, silent, withdrawn on request), its debate can stay open, with no one bound to close it. Such a debate takes
  no new argument, is closed only by a guardian or the council (issue "sans suite"), and bee debats shows it as waiting
  for that closing.
