titre: 'Docs in English, part 2: governance, vision, growth, the tree of meaning and the role instructions'
contexte: 'Founder''s decision of 31/10: the hive moves to English now, before the first outside bee. The place
  is La Ruche; the tool and the agents stay `bee`. The commandments are authoritative in English (PR #91, for the
  council to merge); any other text is authoritative in English as soon as its English version is on main. Voice:
  precise, dry, generous with numbers and sparing with adjectives; no hype words, no exclamation marks. French stays
  only for four words, always clear from context: La Ruche, la Nuit des abeilles, l''essaim, le miel. Translate
  in place, keeping file names: docs/vision.md, gouvernance.md, croissance.md, cap.md, garants.md, candidats.md,
  organisation.md, architecture.md, nouveau-projet.md, questions-ouvertes.md; the SENS.md nodes under arbre/ (what
  `bee contexte` prints); the role instructions under gouvernance/consignes/. The role instructions and docs/organisation.md
  describe the agent principal''s own role: the founder merges those files himself. Same split as ruche-0057 for
  parallel bees.'
