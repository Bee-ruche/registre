titre: One fusion pass merges every validated data PR, in order, each bound to its head
contexte: 'Write path at scale, step 1, task E1 (docs/architecture.md, section 4, step 1; ruche-0097, decided by the
  council on 2 Nov 2026). Builds on PR #141''s fix of fusion-auto. One fusion run lists the open data PRs (one GraphQL
  query per 100, no bound on their number), takes those whose validation succeeded on their current head, in the order
  of that validation (a head changed after its validation goes back in the line), checks each with the gate as its author''s
  on the `main` the previous ones left, and merges each through one REST call bound to its head. Passes keep replace
  semantics. Build the check and the merge as separate steps from the start: the check without a token, the merge bound
  to the checked head (E5a requires it). Its merges stay under the workflows'' own token until E5c.'
