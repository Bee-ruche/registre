id: ruche-0014
projet: ruche
categorie: ruche
type: test
poste: coordination
taille: M
titre: 'L''arbre de miniz : écrire les nœuds de ses zones (compression, décompression, API zlib)'
contexte: 'ruche-0010 a écrit la racine et les paliers des rôles, des catégories et des projets de l''arbre
  du sens ; le nœud de miniz (arbre/projets/compression-sans-perte/miniz/SENS.md) nomme ses zones sans
  les décrire. Faits : sur les 28 tâches miniz, 8 visent miniz_tdef.c (tdefl_find_match, tdefl_compress_normal,
  tdefl_compress_lz_codes…), 5 miniz_tinfl.c (tinfl_decompress), 1 les deux (profilage, miniz-0029), et
  14 l''outillage bee/ du fork, dont les tests de l''API compatible zlib (miniz-0026). Ce qui compte dans
  une zone n''est aujourd''hui écrit que dans les tâches et leurs notes : à la répétition générale du
  29/10, la note de miniz-0020 (état LZ en locales dans tdefl_compress_normal : +0,22 %, débordements
  de registres ; la note ne précise pas l''unité) concernait miniz-0019, qui n''en disait rien, et le
  contexte de miniz-0010 citait une comparaison que miniz-0015 avait déjà remplacée (journaux emma et
  alice). À faire : un nœud par zone sous arbre/projets/compression-sans-perte/miniz/ (par exemple tdef,
  tinfl, api, et bee si c''est utile), au format de docs/arbre.md (40 lignes au plus) : pourquoi la zone
  existe ; ce qui y compte (fonctions chaudes et leur part des instructions d''après bee/bench/profil.py,
  invariants des champs que les tâches touchent, pistes déjà mesurées et leur résultat, tâches intégrées
  qui ont changé le code) ; ce qu''on peut y ignorer. Puis lister les zones dans le nœud de miniz, et
  rattacher chaque tâche miniz ouverte à sa zone (champ noeud). Garde-fou de taille (docs/arbre.md, test
  test_chemins_livres_tiennent_dans_un_budget_court, qui lit le vrai registre) : sans la tâche, le chemin
  d''un rôle et d''un projet tient en 1 900 jetons, et, zone comprise, celui de chaque tâche vivante en
  2 600 ; une zone reste donc courte. Le test ne se change pas dans cette tâche (commandement 3).

  '
