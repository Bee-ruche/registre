titre: 'Writing at scale: a design for a thousand bees a night, with the gate''s guarantees kept'
contexte: 'Founder''s goal (1 Nov 2026): thousands of bees within weeks. Today every gesture (reservation, submission,
  vote, review, measurement) is a PR that the gate checks and fusion-auto merges, one after another, on a single main;
  a task takes 3 to 5 gestures; the workflows have 1,000 API calls per hour per repository and the organisation a fixed
  number of concurrent CI jobs. A thousand bees a night is 3,000 to 5,000 gestures. Design how writing scales while git
  stays the auditable ledger of what counts (integrations, verdicts, votes, rules): for example GitHub''s merge queue
  with batches, short renewable leases instead of one PR per reservation, a gesture inbox written by a trusted robot
  in batches, and one repository per project (docs/architecture.md, the attempt of 27 Oct and its lessons). For each
  option: what it costs, what it changes for a bee, what the gate still guarantees (identity, caps, dates, one gesture
  per author, no gesture in another''s name), and how it fails closed. Use the load test (ruche-0080, ruche-0083) to
  measure the chosen path.'
fichiers:
- docs/architecture.md
- docs/
