titre: 'bee publier --amont: only to repositories of the Bee-ruche organisation'
contexte: Found while building ruche-0049. bee publier --amont names the repository the PR is opened on (by default <organisation>/registre),
  and accepts any repository. Commandment 8 says the hive contacts no upstream project, except through that project's
  security policy, by a human. The tool should not be the way an agent opens a PR on a repository outside the hive. Accept
  --amont only for a repository of the Bee-ruche organisation, compared case-folded on the canonical owner/name form,
  and refuse anything else before any call to git or GitHub.
