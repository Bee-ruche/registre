titre: 'Terms: an appointed privilege carries an end date, and bee stops counting it once passed'
contexte: 'R15 (docs/devolution.md, section 1): every appointed privilege (guarantor, guardian, security guardian) lasts
  six months from the appointment, staggered; it is renewed by vote with a human council member''s agreement, or, while
  R10''s quorum is out of reach (fewer than 20 members of non-zero weight active in the last 30 days), by a human council
  member with a reason published in docs/decisions.md; a renewal decided in the 30 days before the end runs from the
  previous end date, a later one from its own date; re-appointing someone whose term ended is a renewal. A guardian is
  in office (R13, completed by R15) when named, with a guarantor not revoked and within term, and within their own term.
  Today gouvernance/gardiens.yaml and gouvernance/garants.yaml carry no date that `bee` checks. Add an appointment date
  and an end date to each entry, the term in bee.yaml, and one function that answers whether a person is in office at
  a given instant, used everywhere a guardian or a guarantor counts; ruche-0082 adds the trial to that same function.
  Fail closed: a missing or unreadable date means not in office. Acts made in office keep their effect after the term
  (R15). ruche-0026 touches the same places: whichever is integrated second rebases on the other. If the work outgrows
  L, stop and propose a split (commandment 4).'
