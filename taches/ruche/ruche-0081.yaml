critere_acceptation:
- an inventory, by search, of every place where `bee` counts a guardian or a guarantor is in the pull request; each goes
  through the one in-office function, with a test using an expired term and one using a guarantor whose term has ended
- '`bee valider` refuses an entry without its dates, an end later than the term after the appointment, a new entry for
  a person whose earlier term ended unless it names its renewal decision, and a renewal by the council alone on a date
  when R10''s quorum was within reach'
- '`bee` prints the quorum count (members of non-zero weight active in the last 30 days) and whether R10''s quorum is
  within reach'
- '`bee valider` refuses `amorcage: false` while the council has fewer than three members'
- 'migration: each existing entry receives its recorded appointment date and the matching end date, listed in the pull
  request; none is silently dropped'
- independent adversarial review attached (this decides who counts for R3's gate); the full test suite passes
