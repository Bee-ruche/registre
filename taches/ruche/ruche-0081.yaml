titre: 'Terms: an appointed privilege carries an end date, and bee stops counting it once passed'
contexte: 'R15 (docs/devolution.md, section 1): every appointed privilege (guarantor, guardian, security guardian) lasts
  six months from the appointment, staggered; it is renewed by vote (an R10 proposal on R15 that names the person and
  the renewed term) with a human council member''s agreement, or by a human council member with a reason published in
  docs/decisions.md while R10''s quorum is out of reach (no R10 vote gathered 20 voters of non-zero weight in the last
  90 days) or when the renewal vote ends without the quorum; a renewal is decided no earlier than 30 days before the
  end and then runs from the previous end date, a later one from its own date; re-appointing someone whose term ended
  is a renewal. A guardian is in office (R13, completed by R15) when named, with a guarantor not revoked and within term,
  and within their own term. Today gouvernance/gardiens.yaml and gouvernance/garants.yaml carry no date that `bee` checks.
  Add an appointment date and an end date to each entry, the term in bee.yaml, and one function that answers whether
  a person is in office at a given instant, used everywhere a guardian or a guarantor counts; ruche-0082 adds the trial
  to that same function. Fail closed: a missing or unreadable date means not in office. Acts made in office keep their
  effect after the term (R15). ruche-0026 touches the same places: whichever is integrated second rebases on the other.
  If the work outgrows L, stop and propose a split (commandment 4).


  Council''s note (2 Nov 2026, from ruche-0051''s design): `gardiens_en_fonction` checks only that a guardian has a guarantor;
  docs/croissance.md says it also checks R15''s term and trial period, which no code does yet. Include it here.


  Council''s note (8 Nov 2026, commandment 14): every power granted to a person or an agent needs a term and a way to
  withdraw it by 31 December 2026, or it ends. Extend the same treatment to each declared agent account
  (gouvernance/comptes-agents.yaml: an appointment date, an end date, renewal by a human council member) and to the
  Confirmé level (how long it lasts without new verified work, and how it is withdrawn). If this outgrows L, split it.'
