critere_acceptation:
- an inventory, by search, of every place where `bee` counts a guardian or a guarantor is in the pull request; each goes
  through the one in-office function, with a test using an expired appointment
- '`bee valider` refuses an appointment without its dates, one whose end is later than the maximum term after the appointment,
  and a renewal that names no decision'
- 'with `amorcage: false`, every appointment made during the bootstrap is out of office, unless renewed after that instant'
- the site shows each privilege's end date
- independent adversarial review attached (this decides who counts for R3's gate); the full test suite passes
