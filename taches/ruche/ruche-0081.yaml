critere_acceptation:
- an inventory, by search, of every place where `bee` counts a guardian or a guarantor is in the pull request; each goes
  through the one in-office function, with a test using an expired term and one using a guarantor whose term has ended
- '`bee valider` refuses an entry without its dates, an end later than the term after the appointment, a renewal decided
  more than 30 days before the end, and a new entry for a person whose earlier term ended unless its decision resolves
  to an adopted proposal (R10) or to a dated docs/decisions.md row inside the window; a council-alone renewal is refused
  on a date when R10''s quorum was within reach, unless a renewal proposal on R15 naming that person ended without the
  quorum'
- '`bee` prints whether R10''s quorum is within reach: the latest R10 vote, within 90 days, that gathered 20 voters of
  non-zero weight, or none'
- '`bee valider` refuses `amorcage: false` while the council has fewer than three members'
- 'migration: each existing entry receives its recorded appointment date and the matching end date, listed in the pull
  request; none is silently dropped'
- independent adversarial review attached (this decides who counts for R3's gate); the full test suite passes
