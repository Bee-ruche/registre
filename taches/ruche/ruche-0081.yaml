titre: 'Mandates: an appointed privilege carries an end date, and bee stops counting it once passed'
contexte: 'R15 (docs/devolution.md): a privilege granted by appointment (guardian, guarantor) ends six months after the
  appointment, or when phase 3 opens (`amorcage: false`), whichever comes first; it is renewed by a new decision (an
  adopted proposal, or the council while R10''s quorum is out of reach). Today gouvernance/gardiens.yaml and gouvernance/garants.yaml
  carry no date that `bee` checks: a guardian is in office as long as it is named with an unrevoked guarantor (docs/croissance.md).
  Add an appointment date and an end date to each appointment, the maximum term in bee.yaml, and one function that answers
  whether a person is in office at a given instant, used everywhere a guardian or a guarantor counts. Fail closed: a
  missing or unreadable date means not in office. Acts made while in office keep their effect after the term ends; a
  block from a guardian whose term has ended can be lifted on appeal, like any block (R15). The council has no mandate
  under R15.'
