titre: 'Common judge: the registry requires a minimum version of the common judge'
contexte: 'Follow-up of ruche-0035''s review. ruche-0035 makes the common judge''s analysis complete and labels its verdicts
  juge-v2, but the registry accepts any `juge-vN` label as complete (outils/bee.py, the check behind `relecture_gardien_requise:
  si_juge_incomplet`). A fork still pinned to an older judge keeps producing verdicts the registry treats as complete.
  docs/juge-commun.md already says bee.yaml can require a minimum version; no such key exists. Add it (for example `juge_commun_min`),
  and make a verdict from an older common judge count as incomplete, so that R3''s review gate requires a guardian. To
  do before the first outside participant; set the value to 2 once the council has created the juge-v2 tag and ruche-0024
  pins the forks to it.'
fichiers:
- outils/bee.py
- outils/test_bee.py
- bee.yaml
- docs/juge-commun.md
portee: 0.7
metrique: null
depend_de:
- ruche-0035
critere_acceptation:
- a verdict whose common judge is older than the minimum in bee.yaml is incomplete for R3's review gate; tested with
  juge-v1 against a minimum of 2
- a missing or malformed minimum fails closed (every verdict incomplete), never open
- docs/juge-commun.md says what the key does and who raises it
- independent adversarial review attached; the full test suite passes
hors_perimetre:
- creating the juge-v2 tag (the council)
- pinning the forks (ruche-0024)
