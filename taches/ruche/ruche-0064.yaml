titre: 'Docs in English (6/7): growth and guarantors'
contexte: 'Founder''s decision of 31/10: the hive moves to English before the first outside bee. The place is La
  Ruche; the tool and the agents stay `bee`. The commandments become authoritative in English when the council records
  it in docs/decisions.md; any other text stays authoritative in French until the council records, when it merges
  the English version, that this version is authoritative. Start once the commandments decision is on main. Voice:
  precise, dry, generous with numbers, sparing with adjectives; no hype words, no exclamation marks; US spelling.
  French stays only for La Ruche, la Nuit des abeilles, l''essaim and le miel. Size: a translated line counts as
  one changed line. Commands, folders and YAML keys are cited as they are today; ruche-0069 and ruche-0070 rename
  them. Members may propose the PR; it is never merged automatically: the council merges. docs/croissance.md carries
  R13''s limits and is quoted by the R13 tests: they follow the English text. Translate in place, keeping file names:
  docs/croissance.md, docs/garants.md (about 334 lines).'
fichiers:
- docs/croissance.md
- docs/garants.md
- outils/test_bee.py
portee: 0.5
metrique: null
critere_acceptation:
- 'fidelity checked sentence by sentence by a guardian or the council (not the author), report posted on the PR:
  no condition, threshold or obligation changed'
- tests that quote these files follow the English text
- no hype words, no exclamation marks; links between files still resolve; `bee valider` passes
- on merge, the council records in docs/decisions.md that these files are now authoritative in English
hors_perimetre:
- 'docs/decisions.md (a journal: past rows stay as written)'
- file renames (ruche-0070)
- any change of meaning
noeud: projets/ruche/ruche
statut: ouverte
