critere_acceptation:
- every open task has English title, context, criteria and scope; no condition, figure, path or dependency lost
  (diff of numbers and paths before and after, by script)
- spot check of ten tasks by an agent of another model, attached
- '`bee valider` passes; no task changes status'
hors_perimetre:
- closed tasks, notes, debates, contributions
- changing what a task asks
