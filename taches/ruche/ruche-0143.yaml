titre: 'English names, step 1c: P1b (c), gate path rules (P4), outputs (P6) and bee check-migration'
contexte: 'docs/english-migration.md, sections 3, 9, 12 and 13. Step 1c, split on 9 November 2026 (the switch script, the dry
  run on a copy of main and change 10 go to ruche-0153). P1b (c): on the migrated frozen fixture, validate and every scanner
  (council-file checks, removal on request, loaders, globs) find the same non-zero file counts as before. P4: every path rule
  of the gate (section 3.1, rows R-a to R-u, and the key sets of section 3.3) classifies map(path) as it classified path, on
  a corpus generated from the old tool''s constants plus every tracked top-level path; retired paths are refused and never
  data; map is a bijection on the corpus. P6: read-only commands (list, balance, swarm, ranking, levels, debates with --json,
  show, context, the site''s api) print the same output modulo the map on the frozen fixture. `bee check-migration --base
  --head`, which runs P1, P1b, P2, P3, P4 and P6 from the base''s own code and prints their summary, and asserts explicitly,
  beyond head == translate(base): debates and their arguments equal modulo the map; the same council, guardians, guarantors
  and agent accounts; reserved logins unchanged; per-family file counts equal and non-empty. A test that every bee.<attribute>
  a workflow''s inline Python names exists. A workflow on main, started by hand (workflow_dispatch) with a PR number and its
  head SHA, runs main''s check-migration on that exact head, read-only, and writes the summary with the SHA it checked, so
  the founder verifies the switch first-hand with reviewed code.'
