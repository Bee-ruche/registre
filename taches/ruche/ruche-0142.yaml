contexte: 'docs/english-migration.md, section 13. One commit renames everything at once: folders and files (outils/ to tools/,
  the docs'' names, REGLES.md to RULES.md, UTILISATEURS.md to USERS.md, MAINTENEURS.md to MAINTAINERS.md; COMMANDEMENTS.md
  and AGENTS.en.md removed, AGENTS.md becoming the English text), commands and options (no aliases; an old name prints the
  new one and runs nothing, for three months), workflows, jobs, robot texts and environment variables, every data folder,
  key and enumerated value, the tree and its node ids, the schemas, the frozen fixture and the tests, the site''s paths
  and JSON keys, and the Python identifiers. Also: deja_nommes reads the old and the new paths; fork documents are read
  in either vocabulary, one per document, until date D, and a fork verdict''s metric is checked against the task''s; the
  retired-names guard and the refusal table filled. Generated from current main by ruche-0141''s script during the freeze;
  the hand-made part stays under 400 lines. Before the freeze: every open reservation, parallel registration and race drained,
  at least 24 h after the last release or closure without integration; the scheduled agent sessions'' prompts and the skill''s
  installed copies updated (section 12, change 12).'
