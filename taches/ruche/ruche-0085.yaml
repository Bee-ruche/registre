taille: M
titre: 'Rules version, part 2: refuse permissive acts under a grant that no longer holds'
contexte: 'Adapted from DeepSeek''s dsh-superagent prototype (https://github.com/deepseek-ai/dsh-superagent-prototype,
  MIT): docs/002-authorization.md ("Policy version", "Revalidation before resume") and docs/001-domain.md (a rules change
  is delivered rather than cancelling running work, which would leave it half-finished). The source notifies live holders
  and revalidates on resume; La Ruche is stricter, because its contributors are not one trusted team. Part 2, on ruche-0084''s
  version: before an act made under a grant from an older rules version, `bee` checks whether the grant still holds under
  the current rules, with the same function the gate uses at grant time for a reservation, and ruche-0081''s in-office
  function for a privilege (one implementation each, no copy). The check is a computation at the act: it writes nothing,
  and never touches `reservation.depuis` (R7), a term''s end (ruche-0081) or a trial''s start (ruche-0082).'
fichiers:
- outils/bee.py
- outils/test_bee.py
- docs/taches.md
- docs/devolution.md
portee: 0.6
metrique: null
