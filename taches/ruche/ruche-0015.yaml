titre: 'L''arbre de libyaml : écrire les nœuds de ses zones (lecture, scanner, parser, chargeur, émetteur)'
contexte: 'ruche-0010 a écrit la racine et les paliers des rôles, des catégories et des projets de l''arbre
  du sens ; le nœud de libyaml (arbre/projets/parsing-serialisation/libyaml/SENS.md) nomme ses zones sans
  les décrire. Faits : sur les 9 tâches libyaml, 7 construisent l''outillage du fork (oracle, aller-retour,
  fuzzing, juge isolé) et 2 visent le code, toutes deux bloquées par l''outillage : libyaml-0010 (src/reader.c,
  yaml_parser_update_buffer, décodage UTF-8) et libyaml-0011 (src/scanner.c, yaml_parser_scan_plain_scalar).
  Le bee/README.md du fork (l. 60) note que l''analyse est limitée par le processeur : une baisse d''instructions
  s''y voit au chronomètre (le nœud de miniz dit l''inverse pour sa décompression, qui bute sur la mémoire).
  À faire : un nœud par zone sous arbre/projets/parsing-serialisation/libyaml/ (lecture et décodage, scanner,
  parser, chargeur, émetteur), au format de docs/arbre.md (40 lignes au plus) : pourquoi la zone existe
  ; ce qui y compte (fonctions chaudes et leur part des instructions d''après un profil callgrind du banc,
  cité avec sa commande (le fork n''a pas de profileur comme bee/bench/profil.py de minizBee ; libyaml-0010
  et libyaml-0011 citent 16,6 % et 24,4 %), ce que l''oracle vérifie dans cette zone, états et invariants
  que les optimisations touchent, pièges connus) ; ce qu''on peut y ignorer. Puis lister les zones dans
  le nœud de libyaml et y rattacher les tâches libyaml ouvertes (champ noeud) ; src/writer.c et src/dumper.c
  vont avec l''émetteur. Garde-fou de taille (docs/arbre.md, test test_chemins_livres_tiennent_dans_un_budget_court,
  qui lit le vrai registre) : sans la tâche, le chemin d''un rôle et d''un projet tient en 1 900 jetons,
  et, zone comprise, celui de chaque tâche vivante en 2 600 ; une zone reste donc courte. Le test ne se
  change pas dans cette tâche (commandement 3).

  '
