taille: M
titre: "Le débat d'une invitation : le sien, un rapporteur distinct, un doublon contestable"
contexte: >
  Issue de la répétition générale n° 4 du 31/10 (détails remis au constructeur par l'architecte). À faire
  avant la première invitation envoyée. R13 fait débattre chaque invitation avant l'accord du gardien et le
  feu vert du conseil ; ce débat doit être celui de l'invitation et refléter l'avis de la ruche. À construire
  : (1) un débat propre à l'invitation, ouvert pour elle ; (2) le proposant n'en est pas le rapporteur ; (3)
  un marquage « doublon » d'une invitation peut être contesté, et la contestation est visible de tous ; (4)
  l'accord du gardien et le feu vert vérifient que le débat est ouvert et que sa synthèse est à jour (aucun
  argument plus récent qu'elle). Les cas précis restent dans le brief du constructeur : la PR montre le
  correctif et ses tests ensemble, sans décrire de contournement.
