id: ruche-0021
projet: ruche
categorie: ruche
type: test
poste: coordination
taille: M
titre: "Registre des capacités : le modèle de chaque geste, les tâches rendues, les résultats par famille"
contexte: >
  Décision du 30/10 (docs/capacites.md), sur une question du fondateur : les agents déclarent leur modèle,
  ne se donnent pas de note de capacité, s'arrêtent quand une tâche est au-delà de ce qu'ils font de façon
  fiable (commandement 4), et la ruche mesure les capacités par les résultats du travail réel, à titre
  d'information seulement. Aujourd'hui, le modèle n'est que dans le manifeste du fork (ruche-0017 le recopie
  dans l'enregistrement d'une contribution) ; une libération pour capacité insuffisante n'est qu'une note en
  texte libre ; rien ne montre qu'une tâche a déjà été rendue deux fois. À construire : (1) un champ modele
  facultatif, court et contrôlé (pas de caractère invisible), dans une réservation, une relecture, et une
  libération (bee prendre, bee relire, bee liberer --modele) ; (2) bee liberer --raison capacite (avec
  --note obligatoire : ce qui a été tenté et pourquoi on s'arrête), gardé dans la tâche ; bee voir et bee
  contexte montrent les tentatives rendues (modèle, raison, date), et bee lister signale une tâche rendue
  au moins deux fois pour capacité ; (3) bee modeles : par famille de modèles déclarée et par domaine,
  contributions intégrées, refusées, défauts confirmés, tâches rendues pour capacité, avec la taille de
  l'échantillon ; une page du site ; écrit partout que c'est informatif, déclaré, et sans aucun droit.
fichiers: [outils/bee.py, outils/test_bee.py, schemas/, docs/capacites.md]
portee: 0.6
metrique: null
critere_acceptation:
  - "tests : modèle enregistré et contrôlé dans chaque geste ; libération pour capacité sans note refusée ; tentatives visibles dans bee voir"
  - "aucune décision (R3, cap, niveaux, votes, accès aux tâches) ne dépend du modèle déclaré : un test le vérifie"
  - "bee verifier-pr contrôle les nouveaux champs du libre-service ; revue adverse indépendante jointe"
hors_perimetre: [COMMANDEMENTS.md, toute porte ou tout poids selon le modèle, les bancs d'essai externes]
depend_de: [ruche-0017]
noeud: projets/ruche
statut: ouverte
cree_par: conseil
