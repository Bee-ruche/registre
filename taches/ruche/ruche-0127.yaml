titre: One queued push step shared by every robot that writes main; passes keep replace semantics
contexte: 'Write path at scale, step 1, task E5b (docs/architecture.md, section 4, step 1; ruche-0097, decided by the
  council on 2 Nov 2026). Every robot pass (fusion, verdicts, integration, expirations) keeps the default semantics of
  its own concurrency group: a newer pass may replace a waiting one. Only a short push step (fetch `main`, apply the
  pass''s result, `bee valider`, push) runs in the one group shared by everything that writes `main`, which queues (`queue:
  max`, as E0a found) so that no writer''s push is dropped. The builder estimates the size before building; if it passes
  M, the council splits the task before work starts.'
