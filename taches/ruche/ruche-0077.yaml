titre: 'Open tasks in English (6/8): the open tasks from ruche-0027 to ruche-0039'
contexte: 'Founder''s decision of 31/10: the hive moves to English before the first outside bee. The place is La
  Ruche; the tool and the agents stay `bee`. The commandments become authoritative in English when the council records
  it in docs/decisions.md; any other text stays authoritative in French until the council records, when it merges
  the English version, that this version is authoritative. Start once the commandments decision is on main. Size:
  a translated line counts as one changed line. These files are council-only (the gate refuses them from a member):
  the work is prepared under the council''s account by a builder it launches, and the council merges. An outside
  bee picks a task by reading it. Translate titre, contexte, critere_acceptation and hors_perimetre of the tasks
  still open (statut: ouverte) from ruche-0027 to ruche-0039: 11 tasks on 31/10, about 378 lines. Keep every condition,
  figure, path and dependency; titles under 100 characters. A task that is no longer open is skipped: notes, closed
  tasks and tasks in review stay as written. Values only: keys are renamed by script (ruche-0070); whichever lands
  second rebases.'
