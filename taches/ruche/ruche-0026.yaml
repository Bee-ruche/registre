critere_acceptation:
  - "test : la relecture d'un gardien de la branche A ne compte pas (ni pour, ni pour bloquer) sur une contribution de la branche B ; un gardien de toute la ruche compte partout"
  - "test : une contribution qui touche deux branches exige un privilégié de chacune ou de toute la ruche"
  - "test : un changement du nœud d'une tâche par un membre ou un gardien de branche est refusé par verifier-pr"
  - "test : sans champ portee, rien ne change (tous les tests existants passent)"
  - "revue adverse indépendante jointe (R3 et l'intégration en dépendent)"
