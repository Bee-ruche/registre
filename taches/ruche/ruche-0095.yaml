titre: 'Tool: every list of paths read from git is NUL-separated, never compared in quoted form'
contexte: Follow-up of ruche-0089's review (details in the architect's brief). git prints a path that contains certain
  characters in a quoted, escaped form unless it is asked for NUL-separated output (-z). bee reads several lists of changed
  or listed paths from git (the gate's list of changes, verifier-fork's line count and its checks of judged paths, tree
  listings) and compares them with folder prefixes and glob patterns. Read every such list with -z (or an equivalent
  that never quotes), so that each path is compared as it is in the repository. A path that bee cannot read as text is
  refused, never skipped.
fichiers:
- outils/bee.py
- outils/test_bee.py
portee: 0.7
metrique: null
depend_de: []
critere_acceptation:
- every git call in outils/bee.py that lists paths uses NUL-separated output; a test lists them, so that a new call without
  it fails the suite
- 'test: in each check that compares paths (self-service folders, judged paths, the task''s files, R1 exclusions, manifests),
  a path with non-ASCII or special characters is treated exactly like its plain-ASCII equivalent'
- independent adversarial review attached, made with the architect's brief; the full test suite passes
