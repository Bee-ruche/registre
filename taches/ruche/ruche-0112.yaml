poste: gouvernance
taille: M
titre: Outgoing texts judged on what GitHub renders, not only on their raw text
contexte: 'Follow-up of ruche-0049''s review (details in the architect''s brief). A title or body that leaves the hive
  (bee publier, and every outgoing free text) is checked by reading its raw text for mentions, links and personal data.
  Five review rounds of ruche-0049 each found a way for a raw-text reading and GitHub''s rendering to disagree. Judge
  the text the way GitHub shows it: render it with a pinned CommonMark+GFM renderer (cmark-gfm, the one GitHub uses,
  pinned in outils/requirements.txt), then check every link target and every text node outside code against the same
  rules (no mention that notifies a person, no link outside the hive''s allowlist, no personal data). The raw-text check
  stays as a first barrier; a text is refused if either refuses it. Measure the false refusals on the texts already on
  main and in the tests.'
fichiers:
- outils/bee.py
- outils/test_bee.py
- outils/requirements.txt
- docs/securite.md
portee: 0.7
metrique: null
depend_de:
- ruche-0049
critere_acceptation:
- 'test: every bypass found in ruche-0049''s review rounds (the brief lists them) is refused through the rendered check
  alone, with the raw-text check switched off in the test'
- the renderer is pinned to an exact version; a missing or different version fails closed
- no new false refusal on the texts already on main; the measure is in the PR
- independent adversarial review attached, made with the architect's brief; the full test suite passes
