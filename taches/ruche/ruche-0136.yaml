critere_acceptation:
- 'test: an application file created, changed or deleted by any account other than the one it names is refused'
- 'test: a field outside the schema, a text over its bound, or data about another person in the text is refused'
- 'test: a refused applicant''s new application is refused before the delay and accepted after it'
- 'test: an applicant''s linked or agent account counts as the same person (one open application per person)'
- independent adversarial review attached; the full test suite passes
