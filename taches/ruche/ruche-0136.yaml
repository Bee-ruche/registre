  and the verdict side never records it as a refusal'
- 'test: juge.json says, for each seed, drawn or given; a report with a given seed is never taken as a judgment'
- 'meta-test: every folder the judge mounts has a depth of its own, whatever order Docker draws among equal depths'
- independent adversarial review attached, made with the architect's brief; the judge's tests pass with Docker
