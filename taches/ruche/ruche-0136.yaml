titre: 'Common judge after juge-v3: machine failures, where seeds came from, a mount depth per folder'
contexte: Follow-up of the reviews of ruche-0117 (details in the architect's brief). Three things the common judge
  should state or hold on its own. A failure of the machine that runs the judge (the container engine or its runtime)
  is an error of the environment, never a refusal of the judged code. The report (juge.json) says whether each seed was
  drawn by the judge or given on its command line for a local reproduction. Every folder the judge mounts into a
  container sits at a depth that no other mount of that container shares, Docker's own files included, so that the
  order of the mounts never depends on how Docker sorts equal depths. Ships under the next version of the common judge,
  which the council tags.
