titre: 'Applications, part 1: a person applies in their own file, and only they can write or withdraw it'
contexte: 'Council''s decision of 2 Nov 2026 (docs/decisions.md; debate D-0024 may revise it): the hive grows by applications,
  never by invitations written by a third party. A person applies in their own file, shares what they choose to share,
  and the relevant authority decides: a guardian for a participant, the council for a guardian, a guarantor or a project.
  Nobody writes a file about someone else. Waves (ruche-0100) are batches of accepted applications. Part 1: `candidatures/<login>.yaml`,
  a self-service file that only the account it names creates, changes or deletes (its github_id read by CI, ruche-0022);
  `bee postuler`. It holds the role applied for (participant, gardien, garant, projet), optionally a project or branch,
  and a bounded text the applicant chooses to write about themselves; ruche-0047''s checks apply to that text except
  for the applicant''s own public handles they choose to give. The applicant withdraws by deleting the file, and ruche-0048''s
  removal applies on request. A refused applicant applies again after a delay read from bee.yaml. No decision gesture
  yet (part 2).'
