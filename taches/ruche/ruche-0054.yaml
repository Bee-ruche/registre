taille: M
titre: "L'ombre : une règle proposée tourne à côté de celle en vigueur, sur l'activité réelle"
contexte: >
  Décision du fondateur du 31/10 (« un seul état, deux versions de la loi ») : avant d'être adoptée, une règle
  proposée (R10) qui change l'outil tourne « dans l'ombre » sur l'activité réelle pendant une durée fixée ;
  on publie ce qu'elle aurait décidé autrement que la règle en vigueur. Les preuves viennent du vrai flux, pas
  de personnages simulés. Limite connue : les participants s'adaptent aux règles, et l'ombre ne voit que des
  comportements façonnés par l'ancienne ; les répétitions générales restent pour les stratégies. À
  construire : une proposition peut nommer une branche de l'outil candidat ; un workflow l'exécute à côté de
  l'outil de main sur chaque PR du registre, sans jamais décider, et consigne les différences dans un
  rapport lié à la proposition ; le dépouillement (R10) montre ce rapport. À ne commencer qu'après le
  durcissement de la porte (ruche-0039, ruche-0040) : l'outil candidat est du code non adopté, il tourne
  sans jeton d'écriture et son résultat n'est jamais lu comme une décision.
fichiers: [outils/bee.py, outils/test_bee.py, .github/workflows/, docs/gouvernance.md]
portee: 0.7
metrique: null
critere_acceptation:
