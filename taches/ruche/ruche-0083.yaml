id: ruche-0083
projet: ruche
categorie: ruche
type: test
poste: gouvernance
taille: M
titre: 'Load test, part 2: measure where bee and the rules break with a thousand members'
contexte: 'On ruche-0080''s registries, measure what the CI and the members run, on one machine: `bee valider`, `bee
  verifier-pr` on a typical pull request at the end of the week, `bee niveaux`, `bee cap`, the site build. Count, per
  simulated day, the decisions that wait on a privileged person under the rules as they stand (R3''s guardian review
  while the judge is incomplete, validating proposed tasks, invitation agreements, debate closings), and confirm or correct
  docs/devolution.md''s rough count (about 140 guardian reviews a day for 1,000 active members). A slowdown that a crafted
  pull request could trigger on purpose is a weakness of our tools: it goes through the private channel of docs/securite.md,
  never into the pull request or a note.'
fichiers:
- outils/repetition/load_test.py
- docs/outillage.md
- docs/devolution.md
portee: 0.6
metrique: null
depend_de:
- ruche-0080
critere_acceptation:
- timings at 100, 300 and 1,000 members are in the pull request, the median of three runs each, with the commands and
  the hardware (commandment 2)
- every command whose time at 1,000 members is more than 15 times its time at 100 is named, with a profile of where the
  time goes
- the per-pull-request check (`bee valider` and `bee verifier-pr`) is measured against a 10-minute target at 1,000 members;
  a miss is proposed as its own task
- the per-day count of decisions waiting on a privileged person is computed from ruche-0080's model, and docs/devolution.md
  is corrected if the count differs
hors_perimetre:
- 'fixing what breaks: each fix is proposed as its own task'
- the real registry
- any AI agent
