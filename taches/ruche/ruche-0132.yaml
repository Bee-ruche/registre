titre: The full test suite in its own workflow, and the fast path's one-call read of it
contexte: 'Write path at scale, step 1, task E25a (docs/architecture.md, section 4, step 1; ruche-0097, decided by the
  council on 2 Nov 2026). Requirement R-push, part 1. The full suite moves to its own workflow (`suite.yml`), called
  by a code PR''s validation and dispatchable on a commit. The PR fast path''s "main is green" becomes one filtered call
  reading `suite.yml`''s latest runs on `main`: the newest must be for `main`''s last commit that changed anything but
  data (found locally with git), and the newest completed one must have succeeded.'
