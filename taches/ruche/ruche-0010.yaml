  - "bee contexte miniz-0012 tient en moins de 3 000 jetons et suffit pour commencer la tâche (vérifié par un agent qui ne lit rien d'autre, rapport joint)"
  - "aucune information de AGENTS.md n'est perdue : chacune est dans un nœud, et la racine renvoie vers le bon"
