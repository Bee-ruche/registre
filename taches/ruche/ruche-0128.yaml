titre: 'Robots on the GitHub App: a short-lived token minted only in the step that writes'
contexte: Write path at scale, step 1, task E5c (docs/architecture.md, section 4, step 1; ruche-0097, decided by the
  council on 2 Nov 2026). Reserve it only once the founder has created the real App with the least permissions (contents,
  pull requests, actions), installed it, and stored its key as an environment secret restricted to `main` (decision C1).
  Each robot mints the App's token only in the step that writes or calls the API, with the least permissions it needs.
  After merge, on the council's word, the PR-only rule is turned on for `main` with the App alone in the bypass list.
