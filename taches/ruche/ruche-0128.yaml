  on: each robot''s write lands, run ids in the PR'
- 'after merge, one night with the PR-only rule on: every robot''s write lands, and data merges start no full suite and
  no per-merge site build (R-push, counted from the Actions API); recorded as a note on this task within 3 days, a shortfall
  becoming its own task'
- independent adversarial review attached; the full test suite passes
