titre: 'R8 during the bootstrap: up to 8 engagements on the hive''s own tooling tasks, until 1 Dec 2026'
contexte: 'Founder''s decision of 1 Nov 2026, to prepare for thousands of bees within weeks: during the bootstrap, all
  the hive''s own work goes through the founder''s agents, and R8 (3 engagements per user) lets them run three tasks
  at a time. Add a temporary exception, set in bee.yaml: a member of the council may hold up to 8 engagements on tasks
  of the ruche category created by the council, until 2026-12-01 (UTC); every other task keeps the usual count and cap,
  counting all engagements. The agent principal may raise the number when needed, by a council PR with its reason recorded
  in docs/decisions.md; the end date is moved only by the human council. A missing, malformed or past setting means the
  usual cap for everything (fails closed). REGLES.md says it in R8''s row. The founder merges: it changes the agent principal''s
  own pace.'
