critere_acceptation:
- P1, P1b, P2, P3, P4 and P6 pass; main's `bee check-migration` summary is pasted in the PR
- the full test suite passes on the exact head; the number of tests and assertions does not drop
- the founder starts main's check-migration workflow on the PR's exact head himself, and merges that same commit from his
  own account with a bypass of the required check limited to him (plan, section 13); the gate's refusal of the switch in
  ordinary mode is expected and recorded, and lists only the expected reasons (deleted or moved data files, changed keys),
  never a retired name found in the new tree
- the robots stay disabled from the start of the freeze until after the merge; the F1 fork PRs are merged and the open fork
  PRs rebased before the freeze starts; `validate` becomes the required check right after the merge
- after merge, one run of each robot (auto-merge, verdicts, auto-integration, expirations, site) and one CI run of each
  fork are watched and reported; a docs/decisions.md row records the switch, the accepted one-time effects (section 12,
  change 1), date D, and that AGENTS.md, RULES.md and COMMANDMENTS.md are authoritative in English
- an independent adversarial review by an agent of another model than the builder's is attached, with every finding fixed
  or answered; the full test suite passes on the exact head
