titre: The contributor skill and the site in English
contexte: 'Founder''s decision of 31/10: the hive moves to English before the first outside bee. The place is La
  Ruche; the tool and the agents stay `bee`. The commandments become authoritative in English when the council records
  it in docs/decisions.md; any other text stays authoritative in French until the council records, when it merges
  the English version, that this version is authoritative. Start once the commandments decision is on main. Voice:
  precise, dry, generous with numbers, sparing with adjectives; no hype words, no exclamation marks; US spelling.
  French stays only for La Ruche, la Nuit des abeilles, l''essaim and le miel. Size: a translated line counts as
  one changed line. Commands, folders and YAML keys are cited as they are today, and so are the markers the tool
  emits (such as « À REMPLIR »): ruche-0069 and ruche-0070 change them. Members may propose the PR; it is never
  merged automatically: the council merges. The bee-contributeur skill (.claude/skills/bee-contributeur/SKILL.md,
  49 lines) walks an agent through a contribution; outils/site_bee.py builds the public pages. Both in English.
  The skill keeps its folder name until ruche-0069 settles the command names.'
