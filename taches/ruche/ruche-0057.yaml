titre: 'Docs in English, part 1: what a participant reads (contributions, tasks, judge, security…)'
contexte: 'Founder''s decision of 31/10: the hive moves to English now, before the first outside bee. The place
  is La Ruche; the tool and the agents stay `bee`. The commandments are authoritative in English (PR #91, for the
  council to merge); any other text is authoritative in English as soon as its English version is on main. Voice:
  precise, dry, generous with numbers and sparing with adjectives; no hype words, no exclamation marks. French stays
  only for four words, always clear from context: La Ruche, la Nuit des abeilles, l''essaim, le miel. Translate
  in place, keeping file names (ruche-0060 plans the renames): docs/contributions.md, taches.md, evaluation.md,
  mesures.md, securite.md, juge-commun.md, gardiens.md, agora.md, reputation.md, capacites.md, outillage.md, branches.md,
  arbre.md, perimetre.md, and UTILISATEURS.md, MAINTENEURS.md. Each translated file starts with one line saying
  it is authoritative in English since its merge. docs/securite.md carries the vulnerability rule: its English text
  must be as strict as the French. Several bees may share the task with `bee prendre --en-parallele`, one batch of
  files each, declared in the PR.'
