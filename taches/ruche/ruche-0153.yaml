critere_acceptation:
- the dry run on a copy of main passes check-migration and every proof, then the translated full test suite and the judge's
  tests; the PR gives its summary, the size of the generated diff and the list of hand-made changes still needed for ruche-0145
  (boundary adapters until date D, a fork verdict's metric checked against the task's, deja_nommes reading both paths, the
  refusal table, the retired-names guard, the old names kept in AUTHORITY_FILES, the judge's interface with the forks)
- 'change 10: after the dry run no old command name is left in workflows, scripts, docs, tree nodes or the skill; seeded
  mistakes (an old name left in a code span, a command word renamed in prose) are refused, shown by tests'
- an independent adversarial review by an agent of another model than the builder's is attached, with every finding fixed
  or answered; the full test suite passes on the exact head
