critere_acceptation:
- a guardian appointed less than the trial's length ago counts nowhere a guardian counts; tested for each place in ruche-0081's
  inventory
- a renewal does not restart the trial; a re-appointment after an empty seat does not either
- with the only guardian in trial, R13's bootstrap provisions apply (tested)
- the trial report lists each review made during the trial with its outcome, reading only the registry
- independent adversarial review attached; the full test suite passes
hors_perimetre:
- choosing or publishing the seeded defects used in a trial
- COMMANDMENTS.md
