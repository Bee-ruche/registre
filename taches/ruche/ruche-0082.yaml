critere_acceptation:
- a guardian appointed less than the trial's length ago counts nowhere a guardian counts; tested for each place listed
  in ruche-0081's inventory
- a renewal does not restart the trial
- the trial report lists each review made during the trial with its outcome, and reads only the registry
- independent adversarial review attached; the full test suite passes
hors_perimetre:
