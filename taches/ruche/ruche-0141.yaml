critere_acceptation:
- 'the map lint runs per family: no two French names share an English name inside one family; the inverse is a function
  per family'
- 'P2: inverse(apply(f)) is byte-identical for every data file of main; the multiset of every leaf (numbers, dates, shas,
  logins, free texts) is equal once keys and values are mapped; every tracked file of the base is translated by a family
  rule or on an explicit hand-change list'
- P2 fails on seeded mistakes (a key left out, a free text changed, a file added or dropped), shown by tests
- every proof reads the map from the base, never from the PR
- an independent adversarial review by an agent of another model than the builder's is attached, with every finding fixed
  or answered; the full test suite passes on the exact head
