projet: ruche
categorie: ruche
type: test
poste: gouvernance
taille: L
titre: 'English names, layer L1a: the translator and its proofs, dormant'
contexte: 'The founder''s decision of 8 Nov 2026: every name moves to English (docs/english-migration.md, the map in docs/english-names.md
  and outils/migration/names.yaml). This layer builds the tools every later layer uses, and changes no name yet. In outils/migration/:
  rename.py (apply, check, inverse: data translated at the text level, keys at line starts, enumerated values in known positions,
  path values in known keys, order, quoting and comments kept; code literals renamed by syntax tree, YAML inside test strings
  included), same_ast.py (P1), check_cli.py (P3), test_rules.py (P4: every path rule of the gate classifies map(path) as
  it classified path), test_outputs.py (P6: read-only commands print the same output modulo the map on the frozen fixture),
  a --names mode of the marker inventory that fails when a name literal of bee.py is neither mapped nor declared language-neutral,
  and the residue proof P1b (plan, section 12, change 2). The map becomes outils/migration/names.yaml, scoped per schema
  and per file family, completed with the keys of the tool''s JSON outputs and of the site''s api/registre.json (change
  7). Each mechanism is exercised on a toy map in the full suite. The renamed-command refusal and the retired-names guard
  land with empty tables.'
fichiers:
- outils/migration/
- outils/inventaire_marqueurs.py
- outils/bee.py
- outils/test_bee.py
portee: 0.7
metrique: null
critere_acceptation:
- the map file is read from the base, never from the PR, by every proof
- 'P2 round trip: inverse(apply(f)) is byte-identical for every data file of main, and the multiset of every leaf (numbers,
  dates, shas, logins, free texts) is equal once keys and values are mapped'
- each proof fails on a seeded mistake (a key left out, a literal changed outside the map, a path rule that classifies one
  renamed path differently), shown by a test
- the --names inventory covers every name literal of bee.py; the count is in the PR
- 'P1b: every retired token left in the new tree is on an explicit keep-list; every string used as an attribute name (getattr,
  setattr, vars) resolves to a real attribute or parser destination; on the migrated fixture, validate and every scanner
  and glob find the same file counts as before (a test seeds a missed glob and fails)'
- 'the map lint runs per family: no two French names share an English name inside one family, and the inverse is a function
  per family'
- 'tests: every bee.<attribute> a workflow''s inline Python names exists in the module; no old command name is left in workflows,
  scripts, docs, tree nodes or the skill once a layer has renamed it'
- P4's corpus includes every tracked top-level path, none of which may newly match the tooling paths
- an independent adversarial review by an agent of another model than the builder's is attached, with every finding fixed
  or answered; the full test suite passes on the exact head
hors_perimetre:
- COMMANDMENTS.md
noeud: projets/ruche/ruche
statut: ouverte
cree_par: conseil
