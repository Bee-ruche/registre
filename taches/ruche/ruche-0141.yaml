titre: 'English names, step 1a: the scoped map and the data translator, dormant'
contexte: 'The founder''s decisions of 8 Nov 2026: every name moves to English, in one switch (docs/english-migration.md,
  section 13, which prevails; the draft map in docs/english-names.md). Step 1a of three (1b: ruche-0142, 1c: ruche-0143);
  it changes no name yet. outils/migration/names.yaml: the map, scoped per schema and per file family, with the keys of
  the tool''s JSON outputs and of the site''s api/registre.json, the retired names and date D. outils/migration/rename.py,
  for data: apply, check and inverse, by family (canonical writers for debates, invitations, incidents and removals; text
  level for hand-wrapped files; a Markdown-aware rule for tree nodes, whose node ids change), keeping order, quoting and
  comments; and the proof P2.'
