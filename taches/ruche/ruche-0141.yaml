id: ruche-0141
projet: ruche
categorie: ruche
type: test
poste: gouvernance
taille: L
titre: 'English names, step 1: the translator, its proofs and bee check-migration, dormant'
contexte: 'The founder''s decisions of 8 Nov 2026: every name moves to English, in one switch (docs/english-migration.md,
  section 13, which prevails; the map in docs/english-names.md and outils/migration/names.yaml). This step builds the tools
  the switch uses, and changes no name yet. In outils/migration/: names.yaml, the map scoped per schema and per file family,
  completed with the keys of the tool''s JSON outputs and of the site''s api/registre.json, and an identifier map for the
  Python names; rename.py (apply, check, inverse: data translated by family, canonical writers for debates, invitations,
  incidents and removals, text level for hand-wrapped files, a Markdown-aware rule for tree nodes; code literals and identifiers
  renamed by syntax tree, YAML inside test strings included); the proofs P1 (same syntax tree modulo the map), P1b (no retired
  name left, every attribute-name string resolved, every scanner and glob finding the same files), P2 (data round trip),
  P3 (same parser tree), P4 (every path rule of the gate classifies map(path) as it classified path), P6 (read-only commands
  print the same output modulo the map); `bee check-migration --base --head`, which prints the proofs'' summary for the
  switch; a --names mode of the marker inventory. The renamed-command refusal and the retired-names guard land with empty
  tables.'
fichiers:
- outils/migration/
- outils/inventaire_marqueurs.py
- outils/bee.py
- outils/test_bee.py
portee: 0.7
metrique: null
critere_acceptation:
- the map is read from the base, never from the PR, by every proof
- 'P2: inverse(apply(f)) is byte-identical for every data file of main; the multiset of every leaf (numbers, dates, shas,
  logins, free texts) is equal once keys and values are mapped; every tracked file of the base is translated by a family
  rule or on an explicit hand-change list'
- each proof fails on a seeded mistake (a key left out, a literal changed outside the map, a path rule that classifies one
  renamed path differently, a missed glob, an attribute-name string left in French), shown by a test
- 'the map lint runs per family: no two French names share an English name inside one family; the --names inventory covers
  every name literal of bee.py'
- a dry run of the whole switch on a copy of main passes every proof and the full test suite; its summary and the size of
  the generated diff are in the PR
- an independent adversarial review by an agent of another model than the builder's is attached, with every finding fixed
  or answered; the full test suite passes on the exact head
hors_perimetre:
- COMMANDMENTS.md
noeud: projets/ruche/ruche
statut: ouverte
cree_par: conseil
cree_le: '2026-11-08'
