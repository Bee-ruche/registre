titre: The council's procedure to repair a vote or a measurement file the gate refuses to change
contexte: 'Follow-up of ruche-0042''s review. Votes and measurements are append-only for everyone, the council included.
  A file may still need repair: a reason that holds a secret or personal data, a file orphaned when its subject disappears,
  data of a person outside the hive that commandment 10 withdraws on request. Write the human procedure (who decides,
  what is recorded in docs/decisions.md, how the merge is done outside the gate, how the history is kept), without adding
  any bypass to the gate.'
