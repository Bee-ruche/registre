titre: 'Applications, part 2: the relevant authority decides, and third-party invitations end'
contexte: 'Council''s decision of 2 Nov 2026 (docs/decisions.md; debate D-0024 may revise it): the hive grows by applications,
  never by invitations written by a third party. A person applies in their own file, shares what they choose to share,
  and the relevant authority decides: a guardian for a participant, the council for a guardian, a guarantor or a project.
  Nobody writes a file about someone else. Waves (ruche-0100) are batches of accepted applications. Part 2: the decision
  gesture (`bee decider-candidature`): a guardian accepts or refuses a participant''s application, the council a guardian''s,
  a guarantor''s or a project''s, with a code from a closed list and no free text about the person; a guardian never
  decides on their own person, their guarantor''s or a linked account''s application. R13''s brake and bootstrap apply
  to acceptances (a participant''s application waits while no guardian is in office or the brake is on). The answer is
  given on the applicant''s own PR, never by a message outside the hive. `bee inviter` no longer proposes an invitation
  (the code stays readable for history). Rewrite R13 and docs/croissance.md for applications, keeping the brake, caps
  on outgoing messages, the do-not-contact list and removal; propose the new wording of COMMANDMENTS.md''s table row
  13 in the PR body (the founder changes that file).'
