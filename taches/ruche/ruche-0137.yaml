titre: 'Linked-account reports, round 2: past a cap they wait for the council; valider as strict as the gate'
contexte: Follow-up of the review of ruche-0118 (PR 177), whose two should-fix items were accepted as risks at the
  merge (details in the architect's brief). Three things to hold. A report is never lost to a cap on the person it
  names (signalements_nommant_max in bee.yaml) - past that cap, it is kept for the council instead of being refused.
  bee valider judges the files of signalements/ as strictly as the gate (bee verifier-pr) does, so a file the gate
  would refuse never passes validation once on main. A council member never decides a report they filed, through
  any of their accounts (agent accounts, linked accounts) - such a report waits for another council member or a
  guardian.
