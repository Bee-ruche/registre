poste: gouvernance
taille: L
titre: 'English data names: plan the renaming of folders, keys and values, then split it into tasks'
contexte: 'Founder''s decision of 31/10: the hive moves to English before the first outside bee. The place is La
  Ruche; the tool and the agents stay `bee`. The commandments become authoritative in English when the council records
  it in docs/decisions.md; any other text stays authoritative in French until the council records, when it merges
  the English version, that this version is authoritative. Start once the commandments decision is on main. Folders
  (taches, debats, membres, gouvernance, propositions, arbre, projets, modeles, outils), YAML keys and values (statut:
  ouverte, titre, contexte, portee, critere_acceptation, depend_de, cree_par…), values the tool writes into records
  (verdict « ci: verte », invitation states « retiré : refus »…), node header keys, the contribution manifests in
  the forks (teste, non_teste, doutes), the descriptive values in projets/*.yaml, categories.yaml and gouvernance/*.yaml,
  and some file names in docs/ are French. Renaming them touches the gate''s path rules, the workflows, the site,
  the judge, the forks'' CI and the contributions in review. To deliver: docs/english-names.md with the full table
  (generated by a script), the migration method (one script, one atomic commit, a dual-read window for manifests
  and records written before it, with an end date), the risks for the gate, and execution tasks proposed to the
  council.'
fichiers:
- docs/english-names.md
portee: 0.6
metrique: null
critere_acceptation:
- the table covers every folder, file name, key and enumerated value in the registry and both forks; the script
  that generated it is attached
- for each path rule of verifier-pr, the table gives its new form, and the plan says how a test proves none was
  lost; nothing falls to the default by accident
- 'dual-read: a manifest or record carrying both an old and a new key is refused; the self-service surface does
  not widen'
- independent adversarial review of the plan attached
- execution tasks proposed, each with criteria and dependencies
hors_perimetre:
- doing the migration itself
- command names (ruche-0069)
noeud: projets/ruche/ruche
statut: ouverte
cree_par: conseil
cree_le: '2026-10-31'
