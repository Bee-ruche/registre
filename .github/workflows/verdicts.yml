# Récupère les verdicts des CI des forks et les reporte dans le registre.
#
# Sécurité : seul l'outil bee de la branche principale s'exécute ici. verdict.json et
# le manifeste viennent des forks et sont traités comme des données. Une contribution dont la PR
# n'a pas été ouverte par son auteur ne reçoit aucun verdict (pas de crédit pour le travail d'un autre).
name: Verdicts des forks

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  # Activité du registre : chaque passage de la fusion automatique (réservation, soumission, relecture,
  # vote…) déclenche aussi une collecte. En pratique, GitHub espace les cron de plusieurs heures.
  # Seul le code de main s'exécute ; l'événement ne sert que de signal.
  workflow_run:
    workflows: ["Fusion automatique"]
    types: [completed]

permissions:
  contents: write
  actions: write

# Groupe à part : dans un groupe partagé, GitHub ne garde qu'une exécution en attente et annule la précédente ;
# l'intégration, déclenchée par les mêmes événements, annulait donc la collecte des verdicts. Les écritures
# concurrentes sur main sont gérées par le rebasage et les essais de l'étape de publication (idempotente).
concurrency:
  group: verdicts
  cancel-in-progress: false

jobs:
  verdicts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Récupérer les verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 outils/bee.py en-attente \
            | python3 -c 'import json, sys; [print(c["id"], c["pr"], c.get("sha_verdict") or "-", c.get("ci_verdict") or "-", c.get("auteur") or "-", sep="\t") for c in json.load(sys.stdin)]' \
            > a_traiter.tsv
          while IFS=$'\t' read -r id pr sha_connu ci_connue auteur; do
            depot=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            # Contribution de la ruche (PR sur le registre lui-même) : pas de CI de fork ni de verdict à collecter ; elle
            # est relue et fusionnée par le conseil. Ne jamais arrêter la collecte des autres pour elle.
            [ "$depot" = "$GITHUB_REPOSITORY" ] && continue
            infos=$(gh pr view "$pr" --json headRefOid,author --jq '"\(.headRefOid) \(.author.login)"') || continue
            read -r sha auteur_pr <<< "$infos"
            # Le champ pr d'une contribution est déclaré par son auteur : la PR doit être la sienne (le pseudo d'un membre
            # est son login GitHub). Sinon, aucun verdict : on ne juge pas le travail d'un autre sous son nom.
            if [ "${auteur_pr,,}" != "${auteur,,}" ]; then
              echo "::notice::$id : la PR $pr a été ouverte par $auteur_pr, pas par $auteur ; aucun verdict n'est enregistré."; continue
            fi
            # Un verdict vert sur ce commit est définitif ; un rouge peut venir d'une panne passagère
            # (runner indisponible) : on relit la dernière exécution terminée, qui a pu être relancée.
            [ "$sha" = "$sha_connu" ] && [ "$ci_connue" = "verte" ] && continue
            execution=$(gh run list -R "$depot" --commit "$sha" --workflow bee-ci.yml --status completed --limit 1 \
              --json databaseId,url --jq '.[0] | "\(.databaseId) \(.url)"') || continue
            [ -z "$execution" ] && continue
            numero=${execution%% *}; adresse=${execution#* }
            rm -rf "$RUNNER_TEMP/verdict" && mkdir -p "$RUNNER_TEMP/verdict"
            gh run download "$numero" -R "$depot" -n verdict -D "$RUNNER_TEMP/verdict" || continue
            # Contrôle de confiance : les fichiers modifiés par la PR, lus auprès de l'API GitHub. Une PR qui
            # touche son workflow ou ses juges a pu fabriquer son verdict ; R3 la refuse (optimisation) ou
            # exige une relecture du conseil ou d'un Confirmé (tâche d'outillage).
            gh api "repos/$depot/pulls/${pr##*/}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/verdict/fichiers.txt" || continue
            options=(--fichiers "$RUNNER_TEMP/verdict/fichiers.txt")
            # Le manifeste de CETTE tâche : manifestes/<tâche>.yaml (bee manifeste), sinon CONTRIBUTION.yaml à la racine
            # (ancien emplacement). Un CONTRIBUTION.yaml resté sur master d'une contribution précédente a déjà servi à
            # calculer un écart contre le mauvais manifeste (miniz-0018-c1, tour 2) : bee enregistrer-verdict ignore un
            # manifeste dont la tâche n'est pas celle de la contribution.
            tache=$(printf '%s' "$id" | sed -nE 's/^([a-z0-9]+(-[a-z0-9]+)*-[0-9]{4})-c[0-9]+$/\1/p')  # ID_CONTRIBUTION de bee
            for emplacement in ${tache:+"manifestes/$tache.yaml"} CONTRIBUTION.yaml; do
              # Fichier absent : gh échoue (son corps d'erreur ne doit jamais passer pour un manifeste).
              if contenu=$(gh api "repos/$depot/contents/$emplacement?ref=$sha" --jq .content 2>/dev/null) \
                 && printf '%s' "$contenu" | base64 -d > "$RUNNER_TEMP/verdict/manifeste.yaml" 2>/dev/null \
                 && [ -s "$RUNNER_TEMP/verdict/manifeste.yaml" ]; then
                options+=(--manifeste "$RUNNER_TEMP/verdict/manifeste.yaml"); break
              fi
            done
            # Même contenu (revue adverse de ruche-0012) : l'arbre git du commit jugé, lu auprès de l'API. Un commit amendé (même
            # arbre, autre sha) n'efface pas un refus. Échec non bloquant : sans arbre, bee compare les sha.
            if arbre=$(gh api "repos/$depot/git/commits/$sha" --jq .tree.sha 2>/dev/null) \
               && printf '%s' "$arbre" | grep -Eqx '[0-9a-f]{7,40}'; then
              options+=(--arbre "$arbre")
            fi
            python3 outils/bee.py enregistrer-verdict "$id" --verdict "$RUNNER_TEMP/verdict/verdict.json" \
              --sha "$sha" --execution "$adresse" "${options[@]}" || true
          done < a_traiter.tsv
          rm -f a_traiter.tsv
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Verdicts des forks"
            # main a pu avancer pendant ce passage (fusions libre-service) : se rebaser, revalider, réessayer.
            for essai in 1 2 3; do
              if git pull -q --rebase origin main && python3 outils/bee.py valider && git push origin HEAD:main; then
                gh workflow run site.yml --ref main || true
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((essai * 10))
            done
            echo "::error::publication impossible après 3 essais ; le prochain passage refera le travail (idempotent)."
            exit 1
          fi
