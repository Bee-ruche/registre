# Fetches the verdicts of the forks' CIs and records them in the registry.
#
# Security: only the bee tool of the main branch runs here. verdict.json and
# the manifest come from the forks and are treated as data. A contribution whose PR
# was not opened by its author receives no verdict (no credit for someone else's work).
name: Fork verdicts

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  # Registry activity: each pass of the auto-merge (reservation, submission, review,
  # vote…) also starts a collection. In practice, GitHub spaces the crons several hours apart.
  # Only main's code runs; the event serves only as a signal.
  workflow_run:
    workflows: ["Auto-merge"]
    types: [completed]

permissions:
  contents: write
  actions: write

# A group of its own: in a shared group, GitHub keeps only one pending run and cancels the previous one;
# the integration, started by the same events, thus cancelled the verdict collection. Concurrent
# writes to main are handled by the rebase and the retries of the publishing step (idempotent).
concurrency:
  group: verdicts
  cancel-in-progress: false

jobs:
  verdicts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r tools/requirements.txt
      - name: API budget, start (ruche-0121; puts first on PATH a gh that logs each call)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 tools/bee.py api-budget start --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN
      - name: Fetch the verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log_text() { sed -e 's/##\[/# #[/g' -e 's/^/  | /'; }  # ruche-0025: what bee prints, never at the start of a log line
          # ruche-0122: every PR is read in bulk (bee pending --pr-states, one GraphQL query per 50 PRs), as gh pr view reads one; a
          # PR whose answer is unreadable, or whose author is not a user, is left out of the pass; the person its author acts for is
          # bee acts-for's (ruche-0089), pr_account the author's account number.
          python3 tools/bee.py pending --pr-states \
            | python3 -c 'import json, sys; [print(c["id"], c["pr"], c.get("verdict_sha") or "-", c.get("verdict_ci") or "-", c.get("author") or "-", c.get("awaiting_sha") or "-", c["pr_head"], c["pr_author"], c["pr_author_id"], c["pr_person"], sep="\t") for c in json.load(sys.stdin) if c.get("pr_head")]' \
            > to_process.tsv
          while IFS=$'\t' read -r id pr known_sha known_ci author awaiting_sha sha pr_author pr_account person; do
            repo=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            # A hive contribution (a PR on the registry itself): no fork CI nor verdict to collect; it
            # is reviewed and merged by the council. Never stop the collection of the others for it.
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            # A contribution's pr field is declared by its author: the PR must be theirs (a member's pseudonym
            # is their GitHub login). Otherwise, no verdict: someone else's work is not judged under the author's name.
            # ruche-0089: a PR opened by the author's declared agent account counts as theirs (person: bee acts-for, on main).
            if [ "${person,,}" != "${author,,}" ]; then
              echo "::notice::$id: PR $pr was opened by $pr_author, not by $author; no verdict is recorded."; continue
            fi
            # A green verdict on this commit is final; a red one may come from a passing outage
            # (runner unavailable): the last completed run, which may have been re-run, is read again.
            [ "$sha" = "$known_sha" ] && [ "$known_ci" = "green" ] && continue
            # ruche-0025 (adversarial reviews of minizBee #16): only the CI of THIS PR, by the pull_request event, to the
            # fork's default branch, its base never changed, with no other PR of the same head (repository and branch) before it:
            # otherwise no verdict, and the contribution says so (awaiting_verdict); not judged again before another head (1,000 requests
            # per hour). bee judges the API's answers.
            [ "$sha" = "$awaiting_sha" ] && continue
            n=${pr##*/}; api="$RUNNER_TEMP/api"; rm -rf "$api" && mkdir -p "$api"
            [[ "$sha" =~ ^[0-9a-f]{7,40}$ && "$n" =~ ^[0-9]+$ ]] && gh api "repos/$repo/pulls/$n" > "$api/pr.json" \
              && gh api "repos/$repo" > "$api/repo.json" \
              && gh api "repos/$repo/pulls?state=all&per_page=100" --paginate > "$api/pulls.json" \
              && gh api "repos/$repo/issues/$n/events?per_page=100" --paginate > "$api/events.json" \
              && gh api "repos/$repo/issues/$n/timeline?per_page=100" --paginate > "$api/timeline.json" \
              && gh api "repos/$repo/actions/workflows/bee-ci.yml/runs?head_sha=$sha&event=pull_request&status=completed&per_page=100" \
                   --paginate > "$api/runs.json" || continue
            if ! run=$(python3 tools/bee.py pick-run "$id" --sha "$sha" --api "$api"); then
              [ -n "$run" ] && printf '%s\n' "$run" | log_text; continue
            fi
            read -r number_of address defect <<< "$run"
            rm -rf "$RUNNER_TEMP/verdict" && mkdir -p "$RUNNER_TEMP/verdict"
            gh run download "$number_of" -R "$repo" -n verdict -D "$RUNNER_TEMP/verdict" || continue
            # The base verdict.json declares (fork data) is never believed: the API says whether it is an ancestor of the default
            # branch (compare: identical or ahead); bee record-verdict refuses otherwise.
            : > "$RUNNER_TEMP/verdict/bases.txt"
            for base in $(python3 tools/bee.py declared-bases "$RUNNER_TEMP/verdict/verdict.json"); do
              status=$(gh api "repos/$repo/compare/$base...$defect" --jq .status) \
                && printf '%s %s\n' "$base" "$status" >> "$RUNNER_TEMP/verdict/bases.txt" || true
            done
            # Trust check: the files modified by the PR, read from GitHub's API. A PR that
            # touches its workflow or its judges may have forged its verdict; R3 refuses it (optimization) or
            # requires a review by the council or a Confirmed member (tooling task).
            gh api "repos/$repo/pulls/${pr##*/}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/verdict/files.txt" || continue
            options=(--files "$RUNNER_TEMP/verdict/files.txt" --bases "$RUNNER_TEMP/verdict/bases.txt")
            # The manifest of THIS task: manifests/<task>.yaml (bee manifest), else CONTRIBUTION.yaml at the root
            # (former place). A CONTRIBUTION.yaml left on master by a previous contribution was once used to
            # compute a gap against the wrong manifest (miniz-0018-c1, round 2): bee record-verdict ignores a
            # manifest whose task is not the contribution's.
            task=$(printf '%s' "$id" | sed -nE 's/^([a-z0-9]+(-[a-z0-9]+)*-[0-9]{4})-c[0-9]+$/\1/p')  # bee's ID_CONTRIBUTION
            # ruche-0145: manifests/<task>.yaml (bee manifest, from the switch on) first; the forks' former places until date D,
            # after which bee record-verdict ignores a French manifest (DATE_D in bee).
            for location in ${task:+"manifests/$task.yaml"} ${task:+"manifestes/$task.yaml"} CONTRIBUTION.yaml; do
              # File absent: gh fails (its error body must never pass for a manifest).
              if content=$(gh api "repos/$repo/contents/$location?ref=$sha" --jq .content 2>/dev/null) \
                 && printf '%s' "$content" | base64 -d > "$RUNNER_TEMP/verdict/manifest.yaml" 2>/dev/null \
                 && [ -s "$RUNNER_TEMP/verdict/manifest.yaml" ]; then
                options+=(--manifest "$RUNNER_TEMP/verdict/manifest.yaml"); break
              fi
            done
            # Same content (adversarial review of ruche-0012): the git tree of the judged commit, read from the API. An amended commit (same
            # tree, another sha) does not erase a refusal. ruche-0028 (adversarial review, M1): without a readable tree (one line, 7 to 40
            # hexadecimal characters), no verdict; it is judged again at the next pass.
            if ! { tree=$(gh api "repos/$repo/git/commits/$sha" --jq .tree.sha 2>/dev/null) && [[ "$tree" =~ ^[0-9a-f]{7,40}$ ]]; }; then
              echo "::notice::$id: git tree of commit $sha unreadable from the API; no verdict, judged again at the next pass."; continue
            fi
            options+=(--tree "$tree")
            python3 tools/bee.py record-verdict "$id" --verdict "$RUNNER_TEMP/verdict/verdict.json" \
              --sha "$sha" --run "$address" "${options[@]}" 2>&1 | log_text || true
          done < to_process.tsv
          rm -f to_process.tsv
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Fork verdicts"
            # main may have moved during this pass (self-service merges): rebase, validate again, retry.
            for attempt in 1 2 3; do
              if git pull -q --rebase origin main && python3 tools/bee.py validate && git push origin HEAD:main; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/dispatches" -f ref=main || true  # ruche-0121: one call
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            echo "::error::could not publish after 3 attempts; the next pass will redo the work (idempotent)."
            exit 1
          fi
      - name: API budget, end (ruche-0121)
        if: always()
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 tools/bee.py api-budget end --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN
  pause:
    # ruche-0122: holds the group a few minutes after each pass but a manual one: merges start at most one pass every few minutes,
    # and the newest pending run replaces an older one, so the last trigger is always served.
    if: always() && github.event_name != 'workflow_dispatch'
    needs: verdicts
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: sleep 180
