# Tests of the hive protocol (docs/protocol.md): tools/hive/test_hive.py, test_schedule.py, test_page.py and test_artifact.py, on local git
# repositories and archives the tests make, without network. They run on a change to the tool and on a change to what the tool
# reads of the registry (hive/: the projects' files and their tasks), which one of the tests loads whole.
# Read-only: no secret, no write, nothing of a pull request runs with more than a read token.
name: Hive protocol tests

on:
  pull_request:
    paths: ["tools/hive/**", "hive/**", ".github/workflows/hive-tests.yml"]
  push:
    branches: [main]
    paths: ["tools/hive/**", "hive/**", ".github/workflows/hive-tests.yml"]

permissions:
  contents: read

concurrency:
  group: hive-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Hive protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tests (standard library only)
        run: python3 tools/hive/test_hive.py
      - name: What holds over many runs (schedules drawn at random)
        run: python3 tools/hive/test_schedule.py
      - name: The project page (what the public reads)
        run: python3 tools/hive/test_page.py
      - name: What a job takes from an earlier job's archive
        run: python3 tools/hive/test_artifact.py
