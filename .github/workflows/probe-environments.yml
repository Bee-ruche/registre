# TEMPORARY, removed by the next commit. It shows by behaviour that the two environments that hold the hive's keys
# refuse a branch other than main: each job names one environment and reads no secret. What is expected: GitHub
# refuses to start both jobs on this branch. A job that starts means its environment accepts this branch.
name: Probe - the hive's environments refuse a branch
on:
  push:
    branches: ["claude/inspiring-dijkstra-7b7hjk"]
    paths: [".github/workflows/probe-environments.yml"]
permissions: {}
jobs:
  state:
    runs-on: ubuntu-24.04
    environment: hive-state
    timeout-minutes: 2
    steps:
      - run: echo "STARTED - the environment hive-state accepts this branch, and it should not"
  apply:
    runs-on: ubuntu-24.04
    environment: hive-apply
    timeout-minutes: 2
    steps:
      - run: echo "STARTED - the environment hive-apply accepts this branch, and it should not"
