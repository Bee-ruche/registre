# Generates and publishes the registry's site on GitHub Pages.
# Pages must be enabled in the repository's settings (source: GitHub Actions).
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      immediate:
        description: "Build at once, cancelling the build in progress, and no pause after (a code push; ruche-0133)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# ruche-0121: a code change builds at once, cancelling the run in progress; a dispatch (a robot, after data) waits its turn,
# and dispatches meanwhile collapse into one pending run, the newest. After a data build, the job « pause » holds the group:
# data rebuilds the site at most once every few minutes, and the last change is always built. ruche-0133 (R-push): a push
# builds nothing itself, outside the group (job « reach »): its range scoped like validation.yml's, it dispatches this
# workflow, with « immediate » unless the push is data only (a robot's push under the App then follows the interval).
concurrency:
  group: ${{ github.event_name == 'push' && format('site-push-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: ${{ github.event_name != 'push' && inputs.immediate == true }}

jobs:
  reach:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scope of the push (data only, or the full suite)
        id: reach_push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # ruche-0133: main's tool and dependencies before the push (never the pushed ones) read the range; no « before »,
          # an error or any output but « data|full <commit> »: full, on the pushed commit. Same script in site.yml, validation.yml.
          mkdir -p "$RUNNER_TEMP/tool-before"
          output_text=$([[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git show "$BEFORE:tools/bee.py" > "$RUNNER_TEMP/tool-before/bee.py" &&
                   git show "$BEFORE:tools/requirements.txt" > "$RUNNER_TEMP/tool-before/requirements.txt" &&
                   pip install -q -r "$RUNNER_TEMP/tool-before/requirements.txt" >&2 &&
                   python3 "$RUNNER_TEMP/tool-before/bee.py" --registry . push-scope --before "$BEFORE" --after "$AFTER") || output_text=
          commit=${output_text#* }
          if [[ "$output_text" =~ ^(data|full)\ [0-9a-f]{40}$ ]]; then reach=${output_text%% *}; else reach=full commit=$AFTER; fi
          echo "reach=$reach" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Scope: $reach $commit"
      - name: API budget, start (ruche-0121; by main's tool before the push, so nothing pushed runs with this token)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 "$RUNNER_TEMP/tool-before/bee.py" api-budget start --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN || true
      - name: Dispatch the build (one call)
        env:
          REACH: ${{ steps.reach_push.outputs.reach }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REACH" = data ]; then immediate=false; else immediate=true; fi
          timeout 60 gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/dispatches" -f ref=main -f "inputs[immediate]=$immediate"
      - name: API budget, end (ruche-0121)
        if: always()
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 "$RUNNER_TEMP/tool-before/bee.py" api-budget end --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN || true
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the balance dates the gestures by the commit that merged them
      - name: Commit-graph (ruche-0130)
        run: git commit-graph write --reachable --changed-paths
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r tools/requirements.txt
      - name: Generate
        run: python3 tools/bee.py site --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    # Prerequisite: Settings > Pages > Source: GitHub Actions.
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: API budget, start (ruche-0121)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api rate_limit > "$RUNNER_TEMP/rate_limit.json" || true  # a measure never stops the deployment
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: API budget, end (ruche-0121; bee api-budget's measure, in jq, for this job has no checkout)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: >-
          gh api rate_limit | jq -r --slurpfile a "$RUNNER_TEMP/rate_limit.json" '$a[0].resources as $a | .resources as $b |
          ($a.core.reset == $b.core.reset) as $m | "::notice title=API budget::workflow=Site token=GITHUB_TOKEN rest=\($b.core.used
          - if $m then $a.core.used else 0 end) window=\(if $m then "same" else "renewed" end)"' || true
  pause:
    if: github.event_name != 'push' && inputs.immediate != true
    needs: deploy
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: sleep 180
