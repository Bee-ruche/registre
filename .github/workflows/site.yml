# Génère et publie le site du registre sur GitHub Pages.
# Pages doit être activé dans les réglages du dépôt (source : GitHub Actions).
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ruche-0121: a push (a council merge: code) builds at once, cancelling the run in progress; a dispatch (a robot, after data)
# waits its turn, and dispatches meanwhile collapse into one pending run, the newest. After a dispatched build, the job
# « pause » holds the group: data rebuilds the site at most once every few minutes, and the last change is always built.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : le cap date les gestes par le commit qui les a fusionnés
      - name: Commit-graph (ruche-0130)
        run: git commit-graph write --reachable --changed-paths
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Générer
        run: python3 outils/bee.py site --sortie _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deployer:
    # Prérequis : Settings > Pages > Source : GitHub Actions.
    needs: construire
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: API budget, start (ruche-0121)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api rate_limit > "$RUNNER_TEMP/rate_limit.json" || true  # a measure never stops the deployment
      - id: deploiement
        uses: actions/deploy-pages@v4
      - name: API budget, end (ruche-0121; bee api-budget's measure, in jq, for this job has no checkout)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: >-
          gh api rate_limit | jq -r --slurpfile a "$RUNNER_TEMP/rate_limit.json" '$a[0].resources as $a | .resources as $b |
          ($a.core.reset == $b.core.reset) as $m | "::notice title=API budget::workflow=Site token=GITHUB_TOKEN rest=\($b.core.used
          - if $m then $a.core.used else 0 end) window=\(if $m then "same" else "renewed" end)"' || true
  pause:
    if: github.event_name != 'push'
    needs: deployer
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: sleep 180
