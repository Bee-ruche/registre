# Fusionne sans humain les pull requests en libre-service (réservation, libération,
# soumission, relecture, vote, inscription, proposition) une fois validées.
#
# Sécurité : ce job a un jeton en écriture, donc il n'exécute JAMAIS le code de la PR.
# Il utilise l'outil bee de la branche principale et lit les fichiers de la PR comme
# des données, sur une fusion simulée avec main (pour voir l'état réel après fusion).
name: Fusion automatique

on:
  workflow_run:
    workflows: ["Validation du registre"]
    types: [completed]
  workflow_dispatch: {inputs: {exclure: {default: ""}}}  # ruche-0120: a pass that could not merge every accepted PR asks for another

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: fusion-auto
  cancel-in-progress: false

jobs:
  verifier:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: read, pull-requests: read, actions: read}  # ruche-0120: the job that reads the PRs never writes
    env: {EXCLURE: "${{ inputs.exclure }}"}  # ruche-0120: the PRs the passes before this one could not merge
    outputs: {acceptees: "${{ steps.verif.outputs.acceptees }}"}  # main's checked commit, then « number:head » of each accepted PR
    steps:
      - name: Code de confiance (branche principale)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false  # ruche-0120: the check runs without a token
      - name: Commit-graph (ruche-0130)
        run: git commit-graph write --reachable --changed-paths
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: API budget, start (ruche-0121; puts first on PATH a gh that logs each call)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 outils/bee.py api-budget start --dossier "$RUNNER_TEMP/api-budget" --jeton GITHUB_TOKEN
      - name: Lister les PR ouvertes et leurs validations (ruche-0120)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/passe"; mkdir -p "$d"
          # One GraphQL query per 100 open PRs to main, all pages: number, head, author and its account number (no other call); no draft.
          gh api graphql --paginate -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='query($owner: String!, $name: String!, $endCursor: String) {
            repository(owner: $owner, name: $name) { pullRequests(states: OPEN, baseRefName: "main", first: 100, after: $endCursor) {
              pageInfo { hasNextPage endCursor } nodes { number isDraft headRefOid author { login ... on User { databaseId } } } } } }' \
            --jq '.data.repository.pullRequests.nodes[] | select(.isDraft | not) | [.number, .headRefOid, (.author.login // ""), (.author.databaseId // "")] | @tsv' > "$d/prs.tsv"
          # Successful validations of the last 24 hours (older: refused, ruche-0091), 100 a page: the order and time of each PR.
          depuis=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validation.yml/runs?event=pull_request&status=success&per_page=100&created=%3E%3D$depuis" \
            --paginate --jq '.workflow_runs[] | [.id, .head_sha, .created_at] | @tsv' > "$d/validations.tsv"
          python3 outils/bee.py passe-fusion preparer --dossier "$d" --prs "$d/prs.tsv" --validations "$d/validations.tsv" --exclure "$EXCLURE"  # heads fetched without a token
      - name: Vérifier chaque PR sans jeton, sur le main que laissent les précédentes (ruche-0120)
        id: verif
        run: python3 outils/bee.py passe-fusion verifier --dossier "$RUNNER_TEMP/passe"
      - name: API budget, end (ruche-0121)
        if: always()
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 outils/bee.py api-budget end --dossier "$RUNNER_TEMP/api-budget" --jeton GITHUB_TOKEN
  fusionner:  # reads nothing from the PRs: only the numbers and heads the check accepted, and the main it checked
    needs: verifier
    if: contains(needs.verifier.outputs.acceptees, ':')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: API budget, start (ruche-0121; puts first on PATH a gh that logs each call)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 outils/bee.py api-budget start --dossier "$RUNNER_TEMP/api-budget" --jeton GITHUB_TOKEN
      - name: Fusionner, chaque PR liée à sa tête vérifiée et au main vérifié (ruche-0120)
        env: {GH_TOKEN: "${{ github.token }}", ACCEPTEES: "${{ needs.verifier.outputs.acceptees }}", EXCLURE: "${{ inputs.exclure }}"}
        run: |
          python3 outils/bee.py passe-fusion fusionner --dossier "$RUNNER_TEMP/passe" --depot "$GITHUB_REPOSITORY" --acceptees "$ACCEPTEES" --exclure "$EXCLURE"
          [ ! -s "$RUNNER_TEMP/passe/fusionnees" ] || gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/dispatches" -f ref=main || true  # ruche-0121: one call
      - name: API budget, end (ruche-0121)
        if: always()
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 outils/bee.py api-budget end --dossier "$RUNNER_TEMP/api-budget" --jeton GITHUB_TOKEN
