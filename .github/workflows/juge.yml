# Juge commun Bee, workflow réutilisable (docs/juge-commun.md).
#
# Un fork l'appelle depuis sa CI, en épinglant le commit d'une étiquette du registre :
#   juge:
#     uses: Bee-ruche/registre/.github/workflows/juge.yml@<commit de juge-v2> # juge-v2
#     with: { base_sha: <base de la PR>, tete_sha: <tête de la PR>, options: "sortie_compressee=identique" }
# Il juge la tête contre la base avec le greffon de la BASE (bee/juge/projet.py), jamais celui de la PR,
# et publie un artefact « juge » : juge.json (rapport, section « juge » comprise) et code (0 juste,
# 1 refusé, 2 environnement). Le job ne devient jamais rouge à cause de B : c'est le verdict du fork
# qui lit le code et décide. Aucun secret, aucune écriture : permissions en lecture seule.
#
# The judge's code is read at this workflow's own commit (job.workflow_sha), which must be a commit of
# Bee-ruche/registre's main, never at a tag or a branch (test_juge.py); juge.json names it (juge.source).
name: Juge commun

on:
  workflow_call:
    inputs:
      base_sha:
        description: "commit de base (référence A ; son bee/juge/projet.py est le greffon)"
        required: true
        type: string
      tete_sha:
        description: "commit jugé (candidate B)"
        required: true
        type: string
      options:
        description: "options du greffon, CLE=VALEUR, une par ligne"
        required: false
        type: string
        default: ""
      historique:
        description: "commits whose git objects the plugin reads (full SHAs, blank-separated): ancestors of the base, fetched before the PR"
        type: string
        default: ""
      repetitions:
        required: false
        type: number
        default: 10
      sans_instructions:
        required: false
        type: boolean
        default: false
    outputs:
      code:
        description: "0 si toutes les sorties de B sont justes, 1 si le juge refuse B, 2 si l'environnement ne convient pas"
        value: ${{ jobs.juge.outputs.code }}
      empreinte: {description: "SHA-256 of juge.json (artifact « juge »)", value: "${{ jobs.juge.outputs.empreinte }}"}
      suspectes: {description: "number of suspicious constructs, those juge.json leaves out included", value: "${{ jobs.juge.outputs.suspectes }}"}
      sorties_comparees: {description: "outputs of B compared", value: "${{ jobs.juge.outputs.sorties_comparees }}"}
      greffon: {description: "SHA-256 of the plugin", value: "${{ jobs.juge.outputs.greffon }}"}
      graine: {description: "seed of the judge", value: "${{ jobs.juge.outputs.graine }}"}
      base: {description: "commit A judged", value: "${{ jobs.juge.outputs.base }}"}
      tete: {description: "commit B judged", value: "${{ jobs.juge.outputs.tete }}"}

permissions:
  contents: read

jobs:
  juge:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      code: ${{ steps.juge.outputs.code }}
      empreinte: ${{ steps.juge.outputs.empreinte }}
      suspectes: ${{ steps.juge.outputs.suspectes }}
      sorties_comparees: ${{ steps.juge.outputs.sorties_comparees }}
      greffon: ${{ steps.juge.outputs.greffon }}
      graine: ${{ steps.juge.outputs.graine }}
      base: ${{ steps.juge.outputs.base }}
      tete: ${{ steps.juge.outputs.tete }}
    steps:
      - name: Entrées de l'appelant, avant tout usage (un appel qui ne laisse pas un jugement complet s'arrête ici)
        env:
          BASE: ${{ inputs.base_sha }}
          TETE: ${{ inputs.tete_sha }}
          BASE_EVENEMENT: ${{ github.event.pull_request.base.sha }}
          TETE_EVENEMENT: ${{ github.event.pull_request.head.sha }}
          REPETITIONS: ${{ inputs.repetitions }}
          SANS_INSTRUCTIONS: ${{ inputs.sans_instructions }}
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$TETE" =~ ^[0-9a-f]{40}$ && "$BASE" == "$BASE_EVENEMENT" && "$TETE" == "$TETE_EVENEMENT" ]] || { echo "base_sha, tete_sha: the event's pull request's (40 hexadecimal digits)" >&2; exit 1; }
          [[ "$REPETITIONS" =~ ^[1-9][0-9]{0,2}$ ]] && (( REPETITIONS >= 10 && REPETITIONS <= 50 )) || { echo "repetitions: 10 to 50" >&2; exit 1; }
          [[ "$SANS_INSTRUCTIONS" == false ]] || { echo "sans_instructions: a verdict needs the instruction count" >&2; exit 1; }
      - name: Commit de ce workflow, sur la branche principale du registre (le code du juge y est lu)
        id: preparation
        env:
          DEPOT: ${{ job.workflow_repository }}
          COMMIT: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${DEPOT,,}" == bee-ruche/registre && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "this workflow is not Bee-ruche/registre's at a full commit" >&2; exit 1; }
          etat="$(timeout 60 gh api "repos/Bee-ruche/registre/compare/main...$COMMIT" --jq .status)" || etat="API error or timeout"
          [[ "$etat" == identical || "$etat" == behind ]] || { echo "workflow commit $COMMIT is not on the registry's main ($etat)" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Juge commun (registre, au commit de ce workflow)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Bee-ruche/registre
          ref: ${{ steps.preparation.outputs.commit }}
          path: juge-commun
          persist-credentials: false
      - name: Base de la PR (greffon, harnais, corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base_sha }}
          path: base
          persist-credentials: false
      - name: Historique déclaré (ancêtres de la base ; seul appel de juge.py avec le jeton, avant le greffon et la PR)
        env:
          HISTORIQUE: ${{ inputs.historique }}
          GH_TOKEN: ${{ github.token }}
        run: python3 juge-commun/outils/juge/juge.py --outillage base --historique-seulement --historique "$HISTORIQUE"
      - name: Image du juge (avec réseau, avant tout fichier de la PR)
        run: python3 juge-commun/outils/juge/juge.py --outillage base --image-seulement
      - name: Tête de la PR (données ; rien n'en est exécuté hors conteneur)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tete_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Dossier de travail du juge, borné (tmpfs ; tout ce que les conteneurs écrivent y reste)
        run: |
          mkdir -p "$RUNNER_TEMP/juge" && sudo mount -t tmpfs -o "size=4g,nr_inodes=262144,mode=0755,nosuid,nodev,uid=$(id -u),gid=$(id -g)" tmpfs "$RUNNER_TEMP/juge"
      - name: Juger
        id: juge
        env:
          OPTIONS: ${{ inputs.options }}
          REPETITIONS: ${{ inputs.repetitions }}
          BASE: ${{ inputs.base_sha }}
          TETE: ${{ inputs.tete_sha }}
          SOURCE: Bee-ruche/registre@${{ steps.preparation.outputs.commit }}
        run: |
          mkdir -p resultats
          options=()
          while IFS= read -r ligne; do
            [ -n "$ligne" ] && options+=(--option "$ligne")
          done <<< "$OPTIONS"
          set +e
          python3 juge-commun/outils/juge/juge.py --outillage base --source-a base --source-b pr \
            --repetitions "$REPETITIONS" --source-juge "$SOURCE" --base "$BASE" --tete "$TETE" --travail "$RUNNER_TEMP/juge" \
            "${options[@]}" --json resultats/juge.json > /dev/null 2> resultats/journal.txt
          code=$?
          set -e
          # The judged PR can fill the journal: none of its lines may become a workflow command (token drawn after it).
          jeton="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::stop-commands::$jeton"
          tail -n 40 resultats/journal.txt | sed 's/##\[/# #[/g'
          printf '\n::%s::\n' "$jeton"
          # The code goes out only with the figures, once rapport.py has checked the report: code 2 if it fails (ruche-0117).
          python3 juge-commun/outils/juge/rapport.py resultats/juge.json --code "$code" > resultats/sorties
          sed -n 's/^code=//p' resultats/sorties > resultats/code
          cat resultats/sorties >> "$GITHUB_OUTPUT"
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: juge
          path: resultats/
          if-no-files-found: warn
