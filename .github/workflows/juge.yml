# Juge commun Bee, workflow réutilisable (docs/juge-commun.md).
#
# Un fork l'appelle depuis sa CI, en épinglant le commit d'une étiquette du registre :
#   juge:
#     uses: Bee-ruche/registre/.github/workflows/juge.yml@<commit de juge-v3> # juge-v3
#     with: { base_sha: <base de la PR>, tete_sha: <tête de la PR>, options: "sortie_compressee=identique" }
# ruche-0148 (J2): from judge-v4 on, each input has its English name (head_sha, history, no_instructions) and, until judge-v5, its
# French one (tete_sha, historique, sans_instructions): a call gives one of the two. From judge-v4 on too, the artifact is « judge »
# (judge.json, its keys and values in English, and code), and the outputs have their English names and, until judge-v5, the French.
# Il juge la tête contre la base avec le greffon de la BASE (bee/juge/projet.py), jamais celui de la PR,
# et publie un artefact « juge » : juge.json (rapport, section « juge » comprise) et code (0 juste,
# 1 refusé, 2 environnement, une panne de la machine du juge comprise : jamais un refus de B, ruche-0136).
# Le job ne devient jamais rouge à cause de B : c'est le verdict du fork qui lit le code et décide. Aucun secret, aucune écriture : permissions en lecture seule.
#
# The judge's code is read at this workflow's own commit (job.workflow_sha), which must be a commit of
# Bee-ruche/registre's main, never at a tag or a branch (test_judge.py); juge.json names it (juge.source).
name: Juge commun

on:
  workflow_call:
    inputs:
      base_sha:
        description: "commit de base (référence A ; son bee/juge/projet.py est le greffon)"
        required: true
        type: string
      head_sha:
        description: "judged commit (candidate B); or tete_sha, not both"
        required: false
        type: string
        default: ""
      tete_sha:
        description: "commit jugé (candidate B)"
        required: false
        type: string
        default: ""
      options:
        description: "options du greffon, CLE=VALEUR, une par ligne"
        required: false
        type: string
        default: ""
      history:
        description: "commits whose git objects the plugin reads (full SHAs, blank-separated): ancestors of the base, fetched before the PR; or historique, not both"
        type: string
        default: ""
      historique:
        description: "commits whose git objects the plugin reads (full SHAs, blank-separated): ancestors of the base, fetched before the PR"
        type: string
        default: ""
      repetitions:
        required: false
        type: number
        default: 10
      no_instructions:
        required: false
        type: boolean
        default: false
      sans_instructions:
        required: false
        type: boolean
        default: false
    outputs:
      code:
        description: "0 si toutes les sorties de B sont justes, 1 si le juge refuse B, 2 si l'environnement ne convient pas (panne de la machine du juge comprise)"
        value: ${{ jobs.juge.outputs.code }}
      fingerprint: {description: "SHA-256 of judge.json (artifact « judge »)", value: "${{ jobs.juge.outputs.fingerprint }}"}
      suspects: {description: "number of suspicious constructs, those judge.json leaves out included", value: "${{ jobs.juge.outputs.suspects }}"}
      outputs_compared: {description: "outputs of B compared", value: "${{ jobs.juge.outputs.outputs_compared }}"}
      plugin: {description: "SHA-256 of the plugin", value: "${{ jobs.juge.outputs.plugin }}"}
      seed: {description: "seed of the judge", value: "${{ jobs.juge.outputs.seed }}"}
      base: {description: "commit A judged", value: "${{ jobs.juge.outputs.base }}"}
      head: {description: "commit B judged", value: "${{ jobs.juge.outputs.head }}"}
      # ruche-0148 (J2b): the same outputs under their French names, until judge-v5
      empreinte: {description: "fingerprint", value: "${{ jobs.juge.outputs.fingerprint }}"}
      suspectes: {description: "suspects", value: "${{ jobs.juge.outputs.suspects }}"}
      sorties_comparees: {description: "outputs_compared", value: "${{ jobs.juge.outputs.outputs_compared }}"}
      greffon: {description: "plugin", value: "${{ jobs.juge.outputs.plugin }}"}
      graine: {description: "seed", value: "${{ jobs.juge.outputs.seed }}"}
      tete: {description: "head", value: "${{ jobs.juge.outputs.head }}"}

permissions:
  contents: read

jobs:
  juge:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      code: ${{ steps.juge.outputs.code }}
      fingerprint: ${{ steps.juge.outputs.fingerprint }}
      suspects: ${{ steps.juge.outputs.suspects }}
      outputs_compared: ${{ steps.juge.outputs.outputs_compared }}
      plugin: ${{ steps.juge.outputs.plugin }}
      seed: ${{ steps.juge.outputs.seed }}
      base: ${{ steps.juge.outputs.base }}
      head: ${{ steps.juge.outputs.head }}
    steps:
      - name: Entrées de l'appelant, avant tout usage (un appel qui ne laisse pas un jugement complet s'arrête ici)
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TETE: ${{ inputs.tete_sha }}
          BASE_EVENEMENT: ${{ github.event.pull_request.base.sha }}
          TETE_EVENEMENT: ${{ github.event.pull_request.head.sha }}
          HISTORY: ${{ inputs.history }}
          HISTORIQUE: ${{ inputs.historique }}
          REPETITIONS: ${{ inputs.repetitions }}
          NO_INSTRUCTIONS: ${{ inputs.no_instructions }}
          SANS_INSTRUCTIONS: ${{ inputs.sans_instructions }}
        run: |
          [[ -z "$HEAD_SHA" || -z "$TETE" ]] && [[ -z "$HISTORY" || -z "$HISTORIQUE" ]] || { echo "head_sha or tete_sha, history or historique: one name of each, not both" >&2; exit 1; }
          TETE="${HEAD_SHA:-$TETE}"
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$TETE" =~ ^[0-9a-f]{40}$ && "$BASE" == "$BASE_EVENEMENT" && "$TETE" == "$TETE_EVENEMENT" ]] || { echo "base_sha, head_sha: the event's pull request's (40 hexadecimal digits)" >&2; exit 1; }
          [[ "$REPETITIONS" =~ ^[1-9][0-9]{0,2}$ ]] && (( REPETITIONS >= 10 && REPETITIONS <= 50 )) || { echo "repetitions: 10 to 50" >&2; exit 1; }
          [[ "$NO_INSTRUCTIONS" == false && "$SANS_INSTRUCTIONS" == false ]] || { echo "no_instructions: a verdict needs the instruction count" >&2; exit 1; }
      - name: Commit de ce workflow, sur la branche principale du registre (le code du juge y est lu)
        id: preparation
        env:
          DEPOT: ${{ job.workflow_repository }}
          COMMIT: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${DEPOT,,}" == bee-ruche/registre && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "this workflow is not Bee-ruche/registre's at a full commit" >&2; exit 1; }
          etat="$(timeout 60 gh api "repos/Bee-ruche/registre/compare/main...$COMMIT" --jq .status)" || etat="API error or timeout"
          [[ "$etat" == identical || "$etat" == behind ]] || { echo "workflow commit $COMMIT is not on the registry's main ($etat)" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Juge commun (registre, au commit de ce workflow)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Bee-ruche/registre
          ref: ${{ steps.preparation.outputs.commit }}
          path: juge-commun
          persist-credentials: false
      - name: Base de la PR (greffon, harnais, corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base_sha }}
          path: base
          persist-credentials: false
      - name: Historique déclaré (ancêtres de la base ; seul appel de judge.py avec le jeton, avant le greffon et la PR)
        env:
          HISTORIQUE: ${{ inputs.history || inputs.historique }}
          GH_TOKEN: ${{ github.token }}
        run: python3 juge-commun/tools/judge/judge.py --tooling base --history-only --history "$HISTORIQUE"
      - name: Image du juge (avec réseau, avant tout fichier de la PR)
        run: python3 juge-commun/tools/judge/judge.py --tooling base --image-only
      - name: Tête de la PR (données ; rien n'en est exécuté hors conteneur)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha || inputs.tete_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Dossier de travail du juge, borné (tmpfs ; tout ce que les conteneurs écrivent y reste)
        run: |
          mkdir -p "$RUNNER_TEMP/juge" && sudo mount -t tmpfs -o "size=4g,nr_inodes=262144,mode=0755,nosuid,nodev,uid=$(id -u),gid=$(id -g)" tmpfs "$RUNNER_TEMP/juge"
      - name: Juger
        id: juge
        env:
          OPTIONS: ${{ inputs.options }}
          REPETITIONS: ${{ inputs.repetitions }}
          BASE: ${{ inputs.base_sha }}
          TETE: ${{ inputs.head_sha || inputs.tete_sha }}
          SOURCE: Bee-ruche/registre@${{ steps.preparation.outputs.commit }}
        run: |
          mkdir -p results
          options=()
          while IFS= read -r ligne; do
            [ -n "$ligne" ] && options+=(--option "$ligne")
          done <<< "$OPTIONS"
          set +e
          python3 juge-commun/tools/judge/judge.py --tooling base --source-a base --source-b pr \
            --repetitions "$REPETITIONS" --judge-source "$SOURCE" --base "$BASE" --head "$TETE" --workdir "$RUNNER_TEMP/juge" \
            "${options[@]}" --json results/judge.json > /dev/null 2> results/log.txt
          code=$?
          set -e
          # The judged PR can fill the journal: none of its lines may become a workflow command (token drawn after it).
          jeton="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::stop-commands::$jeton"
          tail -n 40 results/log.txt | sed 's/##\[/# #[/g'
          printf '\n::%s::\n' "$jeton"
          # The code goes out only with the figures, once report.py has checked the report: code 2 if it fails (ruche-0117).
          python3 juge-commun/tools/judge/report.py results/judge.json --code "$code" > results/outputs
          sed -n 's/^code=//p' results/outputs > results/code
          cat results/outputs >> "$GITHUB_OUTPUT"
          # ruche-0136: the outcome said as what it is; an error of the environment (the judge's machine: Docker, its runtime, the
          # image; or its report) is never a refusal of the judged code, and judges nothing.
          case "$(cat results/code)" in
            0) echo "::notice title=Juge commun::code 0 : toutes les sorties de B sont justes" ;;
            1) echo "::warning title=Juge commun::code 1 : refus du code jugé (B)" ;;
            *) echo "::error title=Juge commun::code 2 : erreur d'environnement (machine du juge ou rapport), pas un refus de B : rien n'est jugé" ;;
          esac
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge
          path: results/
          if-no-files-found: warn
