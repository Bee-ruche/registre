# Libère chaque heure les réservations de plus de 72 h (règle R7).
name: Réservations expirées

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ecriture-main
  cancel-in-progress: false

jobs:
  liberer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Libérer
        run: python3 outils/bee.py liberer-expirees
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Libération des réservations expirées (R7)"
            # main a pu avancer pendant ce passage (fusions libre-service) : se rebaser, revalider, réessayer.
            for essai in 1 2 3; do
              if git pull -q --rebase origin main && python3 outils/bee.py valider && git push origin HEAD:main; then
                gh workflow run site.yml --ref main || true
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((essai * 10))
            done
            echo "::error::publication impossible après 3 essais ; le prochain passage refera le travail (idempotent)."
            exit 1
          fi
