# Releases every hour the reservations older than 72 h (rule R7).
name: Expired reservations

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: main-write
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r tools/requirements.txt
      - name: API budget, start (ruche-0121; puts first on PATH a gh that logs each call)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 tools/bee.py api-budget start --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN
      - name: Release
        run: python3 tools/bee.py release-expired
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Release of expired reservations (R7)"
            # main may have moved during this pass (self-service merges): rebase, validate again, retry.
            for attempt in 1 2 3; do
              if git pull -q --rebase origin main && python3 tools/bee.py validate && git push origin HEAD:main; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/dispatches" -f ref=main || true  # ruche-0121: one call
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            echo "::error::could not publish after 3 attempts; the next pass will redo the work (idempotent)."
            exit 1
          fi
      - name: API budget, end (ruche-0121)
        if: always()
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 tools/bee.py api-budget end --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN
