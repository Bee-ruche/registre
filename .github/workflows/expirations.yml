# Libère les réservations de plus de 72 h (règle R7), toutes les 6 heures.
name: Réservations expirées

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 h : le dépôt est privé, chaque exécution coûte des minutes
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ecriture-main
  cancel-in-progress: false

jobs:
  liberer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Libérer
        run: python3 outils/bee.py liberer-expirees
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 outils/bee.py valider
            git commit -am "Libération des réservations expirées (R7)"
            git push origin HEAD:main
            gh workflow run site.yml --ref main || true
          fi
