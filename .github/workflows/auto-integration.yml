# Integrates the contributions that satisfy rule R3, and closes those that were abandoned.
#
# For each contribution in review, the bee tool of the main branch decides alone
# (bee check-acceptance: green CI, R4/R5, reviews on the judged commit, unfavorable reviews,
# weighted vote, window, temporary human gate). If it passes:
#   - the PR is merged ONLY on the commit the CI judged (--match-head-commit);
#   - a PR already merged by hand (by the council, during the human gate) is recorded if and
#     only if it was merged on that same commit;
#   - then bee integrate turns the contribution and its task « integrated », and sets aside in the same commit the
#     rival contributions of the same task (R3: only the best-ranked one is integrated; bee pending
#     lists each race from the best-ranked to the worst-ranked, which is therefore tried first).
# A PR closed without merge closes the contribution (bee close) and reopens its task, unless the race
# goes on (other contributions in review, a holder or parallel registrants). Closures run AFTER
# the pass's integrations, and never when a rival is integrated or merged: a contribution that
# lost the race is set aside, not cancelled.
# ruche-0094: a registry contribution (its PR on this repository) is never merged here; once the council or its agent principal
# has merged it into main, it is recorded as the council would by hand, from GitHub's API and main's history (bee record-merge).
# The PRs of the contributions set aside are closed only AFTER the registry is published successfully (step « Close
# the PRs of the contributions set aside »), and only if they are open and were opened by the contribution's
# author. If a pass fails midway, the next one redoes everything: nothing is lost or done twice.
#
# Security: only main's bee tool runs; the forks' files are data, and the
# merge is done on the server side (the fork's code is never run here). A PR that was not opened
# by the contribution's author is neither merged nor recorded, nor closed if the contribution is set aside.
# ruche-0089: a PR opened by the author's declared agent account counts as theirs (bee acts-for, which reads
# governance/agent-accounts.yaml on main); nothing else. If bee fails, nobody is recognized (fail closed).
#
# Merge token: PR in this repository → default token; PR on a fork → secret
# BEE_INTEGRATION_TOKEN (fine-grained token, write access to the forks). Safe as long as R3's review gate
# is in force: a guardian reviewed exactly the merged commit. Without that token, an integrable
# contribution waits for a merge by hand; the next pass of this workflow then records the integration.
name: Auto-integration

on:
  schedule:
    - cron: "26,56 * * * *"
  workflow_dispatch:
  # Registry activity (reviews and votes merged, verdicts recorded): see verdicts.yml. GitHub
  # chains no more than three workflow_run: the verdict collection started by the auto-merge
  # does not start this workflow again, hence the two sources. Only main's code runs.
  workflow_run:
    workflows: ["Auto-merge", "Fork verdicts"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

# ruche-0122: passes replace (a newer pending run replaces an older one; the job « pause » spaces them a few minutes apart);
# the job that writes main keeps the group it shares with expirations.yml.
concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    concurrency:
      group: main-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # ruche-0028: R3's window starts at the submission's merge time, read in the history
                           # ruche-0094: main before a registry PR's merge commit, and the PR's base (bee record-merge)
      - name: Commit-graph (ruche-0130)
        run: git commit-graph write --reachable --changed-paths
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r tools/requirements.txt
      - name: API budget, start (ruche-0121; puts first on PATH a gh that logs each call)
        env: {GITHUB_TOKEN: "${{ github.token }}", BEE_INTEGRATION_TOKEN: "${{ secrets.BEE_INTEGRATION_TOKEN }}"}
        run: python3 tools/bee.py api-budget start --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN --token BEE_INTEGRATION_TOKEN
      - name: Integrate what satisfies R3, close what is abandoned
        env:
          GH_TOKEN: ${{ github.token }}
          BEE_INTEGRATION_TOKEN: ${{ secrets.BEE_INTEGRATION_TOKEN }}
        run: |
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          # ruche-0122: every PR read in bulk, as in verdicts.yml (an unreadable one, or one not a user's, is left out of the pass).
          python3 tools/bee.py pending --pr-states \
            | python3 -c 'import json, sys; [print(c["id"], c["pr"], c.get("verdict_sha") or "-", c.get("author") or "-", c["pr_state"], c["pr_head"], c["pr_merge"], c["pr_author"], c["pr_author_id"], c["pr_person"], sep="\t") for c in json.load(sys.stdin) if c.get("pr") and c.get("pr_state")]' \
            > "$tmp/to_integrate.tsv"
          : > "$tmp/to_close.txt"
          : > "$tmp/merged_ones.txt"
          while IFS=$'\t' read -r id pr sha author state head merge pr_author pr_account person; do
            repo=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            if [ "$state" = "CLOSED" ]; then
              # Closed after this pass's integrations (an integrated rival sets it aside instead of cancelling it).
              printf '%s\n' "$id" >> "$tmp/to_close.txt"; continue
            fi
            # The PR must be the contribution's author's (a member's pseudonym is their GitHub login): otherwise
            # nothing is merged or recorded: someone else's work is not integrated under the author's name (person: bee acts-for).
            if [ "${person,,}" != "${author,,}" ]; then
              echo "::notice::$id: PR $pr was opened by $pr_author, not by $author; neither merged nor recorded."; continue
            fi
            [ "$state" = "MERGED" ] && printf '%s\n' "$id" >> "$tmp/merged_ones.txt"
            # ruche-0094: a registry contribution (its PR is on this repository) is never merged here. Once the council (or its
            # agent principal) has merged its PR into main, bee record-merge records it from GitHub's REST answers alone (the PR,
            # and the Actions runs of its merged head) and main's history, as a hand-made record; anything else: a notice.
            if [ "${repo,,}" = "${GITHUB_REPOSITORY,,}" ]; then
              [ "$state" = "MERGED" ] || continue
              api="$tmp/api"; rm -rf "$api" && mkdir -p "$api"
              if ! { [[ "$head" =~ ^[0-9a-f]{40}$ ]] && gh api "repos/${repo}/pulls/${pr##*/}" > "$api/pr.json" \
                     && gh api "repos/${repo}/actions/runs?head_sha=${head}&event=pull_request&per_page=100" --paginate > "$api/runs.json"; } < /dev/null; then
                echo "::notice::$id: PR $pr merged, but GitHub's answers are unreadable; nothing recorded, the next pass retries."; continue
              fi
              if output_text=$(python3 tools/bee.py record-merge "$id" --api "$api" < /dev/null 2>&1); then printf '%s\n' "$output_text"
              elif [ -n "$output_text" ]; then echo "::notice::$(printf '%s' "$output_text" | tr '\n' ' ')"; fi  # silent a week after the merge
              continue
            fi
            python3 tools/bee.py check-acceptance "$id" || continue
            if [ "$sha" = "-" ]; then
              echo "::notice::$id: verdict without an associated commit; left in review."; continue
            fi
            if [ "$head" != "$sha" ]; then
              echo "::notice::$id: the PR is on $head, the verdict on $sha; waiting for the new commit's verdict."; continue
            fi
            if [ "$state" != "MERGED" ]; then
              if [ "$repo" = "$GITHUB_REPOSITORY" ]; then token="$GH_TOKEN"; else token="$BEE_INTEGRATION_TOKEN"; fi
              if [ -z "$token" ]; then
                echo "::notice::$id: integrable; PR $pr awaits its merge (no integration token)."; continue
              fi
              # An automatic merge never changes a CI workflow (a fork's judge): a PR that modifies one is
              # merged by the council, then recorded here. A rule written in the code, whatever the token's rights;
              # if the list of files cannot be read, nothing is merged (fail closed).
              number_of="${pr##*/}"
              if ! files=$(gh api "repos/${repo}/pulls/${number_of}/files" --paginate --jq '.[].filename' < /dev/null); then
                echo "::warning::$id: the PR's files are unreadable; left in review."; continue
              fi
              if printf '%s\n' "$files" | grep -q '^\.github/workflows/'; then
                echo "::notice::$id: integrable, but its PR modifies a CI workflow: never merged automatically. The council merges it; it will be recorded at the next pass."
                continue
              fi
              # ruche-0028: the PR's base read again just before merging, long after any delay of the API (same reading as
              # verdicts.yml); a changed base is never merged, nor is an unreadable answer (fail closed).
              api="$tmp/api"; rm -rf "$api" && mkdir -p "$api"
              if ! { gh api "repos/${repo}/issues/${number_of}/events?per_page=100" --paginate > "$api/events.json" \
                     && gh api "repos/${repo}/issues/${number_of}/timeline?per_page=100" --paginate > "$api/timeline.json" \
                     && PYTHONPATH=tools python3 -c 'import sys, bee; sys.exit(any(e.get("event") in bee.BASE_CHANGES for n in ("events", "timeline") for e in bee.api_answers(sys.argv[1], n)))' "$api"; } < /dev/null; then
                echo "::notice::$id: the PR's base changed, or its events are unreadable: never merged; open a new PR to the fork's default branch."
                continue
              fi
              if ! output_text=$(GH_TOKEN="$token" gh pr merge "$pr" --merge --match-head-commit "$sha" --delete-branch=false 2>&1); then
                echo "::warning::$id: merge refused (a conflict to rebase, a new commit or rights); left in review. GitHub's answer:"
                printf '%s\n' "$output_text" | sed 's/::/: :/g; s/^/  /'
                continue
              fi
              printf '%s\n' "$id" >> "$tmp/merged_ones.txt"
              merge=$(GH_TOKEN="$token" gh pr view "$pr" --json mergeCommit --jq '.mergeCommit.oid // "-"')
            fi
            # ruche-0028 (adversarial review, M3): recorded only if the PR targets the fork's default branch and the merge
            # commit is an ancestor of it; otherwise, or if this cannot be checked, nothing is recorded.
            number_of="${pr##*/}"
            if ! { [[ "$merge" =~ ^[0-9a-f]{40}$ ]] && gh api "repos/${repo}/pulls/${number_of}" > "$tmp/pr.json" && gh api "repos/${repo}" > "$tmp/repo.json" \
                   && target=$(python3 -c 'import json, sys; p, d = (json.load(open(f)) for f in sys.argv[1:]); print(d["default_branch"] if p["base"]["ref"] == d["default_branch"] else "")' "$tmp/pr.json" "$tmp/repo.json") \
                   && [[ "$target" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] && status=$(gh api "repos/${repo}/compare/${merge}...${target}" --jq .status) \
                   && [[ "$status" =~ ^(identical|ahead)$ ]]; } < /dev/null; then
              echo "::notice::$id: PR merged outside the fork's default branch, or merge commit unverifiable: integration not recorded."; continue
            fi
            python3 tools/bee.py integrate "$id" --merge-sha "$merge" || true
          done < "$tmp/to_integrate.tsv"
          while read -r id; do
            python3 tools/bee.py close "$id" --reason "PR closed without merge." --merged "$tmp/merged_ones.txt" || true
          done < "$tmp/to_close.txt"
          rm -f "$tmp/to_integrate.tsv" "$tmp/to_close.txt" "$tmp/merged_ones.txt"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Automatic integrations and closures (R3)"
            # main may have moved during this pass (self-service merges): rebase, validate again, retry.
            for attempt in 1 2 3; do
              if ! git pull -q --rebase origin main; then
                if git rebase --abort 2>/dev/null; then
                  # ruche-0094: main changed the same lines during this pass; the same commit would conflict at every try. Nothing is
                  # published (the next step then reads main only), and the next pass redoes the work from main (idempotent).
                  git reset -q --hard origin/main
                  echo "::notice::main changed the same lines during this pass: nothing published; the next pass redoes the work."
                  exit 0
                fi
              elif python3 tools/bee.py validate && git push origin HEAD:main; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/dispatches" -f ref=main || true  # ruche-0121: one call
                exit 0
              fi
              sleep $((attempt * 10))
            done
            echo "::error::could not publish after 3 attempts; the next pass will redo the work (idempotent)."
            exit 1
          fi
      - name: Close the PRs of the contributions set aside
        # Only after a successful publication (this step does not run if « Publish » failed): a PR is
        # closed only if its setting aside is on main. Idempotent: the contributions set aside in the last 7 days are
        # gone over again, and only the PRs still open, opened by the contribution's author, are closed (a contribution's
        # pr field is declared by its author: it must not get someone else's PR closed).
        env:
          GH_TOKEN: ${{ github.token }}
          BEE_INTEGRATION_TOKEN: ${{ secrets.BEE_INTEGRATION_TOKEN }}
        run: |
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          python3 tools/bee.py set-aside --days 7 > "$tmp/set-aside.tsv"
          while IFS=$'\t' read -r id pr author kept; do
            repo=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            if [ "$repo" = "$GITHUB_REPOSITORY" ]; then token="$GH_TOKEN"; else token="$BEE_INTEGRATION_TOKEN"; fi
            [ -n "$token" ] || { echo "::notice::$id set aside: its PR $pr is still to be closed (no integration token)."; continue; }
            info=$(GH_TOKEN="$token" gh pr view "$pr" --json state,author --jq '"\(.state) \(.author.login)"' < /dev/null) \
              || { echo "::notice::$id set aside: PR $pr unreadable, not closed."; continue; }
            read -r pr_state pr_author <<< "$info"
            [ "$pr_state" = "OPEN" ] || continue
            person=$(python3 tools/bee.py acts-for -- "$pr_author" < /dev/null) || person=""
            if [ "${person,,}" != "${author,,}" ]; then
              echo "::notice::$id set aside: PR $pr was opened by $pr_author, not by $author; not closed."; continue
            fi
            GH_TOKEN="$token" gh pr close "$pr" < /dev/null \
              --comment "Set aside in favor of $kept, kept by rule R3 (race between rival contributions of the same task). This is not a refusal: nothing counts against its author or its reviewers." \
              || echo "::warning::$id: closing PR $pr failed; the next pass will retry."
          done < "$tmp/set-aside.tsv"
          rm -f "$tmp/set-aside.tsv"
      - name: API budget, end (ruche-0121)
        if: always()
        env: {GITHUB_TOKEN: "${{ github.token }}", BEE_INTEGRATION_TOKEN: "${{ secrets.BEE_INTEGRATION_TOKEN }}"}
        run: python3 tools/bee.py api-budget end --dir "$RUNNER_TEMP/api-budget" --token GITHUB_TOKEN --token BEE_INTEGRATION_TOKEN
  pause:
    # ruche-0122: as in verdicts.yml, at most one pass every few minutes when merges trigger them; it holds « integration » only.
    if: always() && github.event_name != 'workflow_dispatch'
    needs: integrate
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: sleep 180
