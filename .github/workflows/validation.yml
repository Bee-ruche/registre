# Valide chaque pull request et chaque poussée sur main.
# Ce job exécute la version de l'outil contenue dans la PR, mais en lecture seule et
# sans secret : il ne peut rien écrire. La décision de fusion est prise ailleurs
# (fusion-auto.yml), par l'outil de la branche principale.
# Its token is read-only (contents: read; actions: read, for the scope step to read suite.yml's latest runs on main, and the PR
# rules this run's creation time). The full suite is suite.yml (ruche-0132), called below after this job unless a PR is data-only.
name: Validation du registre

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  valider:
    runs-on: ubuntu-24.04
    outputs:
      portee: ${{ steps.portee.outputs.portee }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Scope of the PR (data only, or the full suite)
        id: portee
        if: github.event_name == 'pull_request'
        env:
          BASE_EVENEMENT: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # La base de l'événement est celle de l'ouverture de la PR, jamais rafraîchie : comparée au commit de fusion
          # (la PR fusionnée avec main d'aujourd'hui), elle compterait comme changements de la PR tout ce que main a reçu
          # depuis. La vraie base est le premier parent du commit de fusion que GitHub a construit, c'est-à-dire main au
          # moment de l'exécution ; à défaut (pas de commit de fusion), la base de l'événement.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 ]; then BASE=$(git rev-parse HEAD^1); else BASE="$BASE_EVENEMENT"; fi
          [ -n "$BASE" ]
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # ruche-0090: the base's tool (never the PR's own) says whether the PR only adds or modifies self-service data
          # files; ruche-0132: and whether main is green, from one read of suite.yml's latest runs dispatched on main (the
          # newest for main's last code commit, the newest completed a success). Fails closed: any output but "data", or any
          # error (a base without ci-scope, a failed call, an unreadable answer), runs the full suite.
          mkdir -p "$RUNNER_TEMP/outil-base"
          timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/workflows/suite.yml/runs?branch=main&event=workflow_dispatch&per_page=20" \
            > "$RUNNER_TEMP/suite.json" || rm -f "$RUNNER_TEMP/suite.json"  # an error or a timeout: no answer, the full suite
          portee=$(git show "$BASE:outils/bee.py" > "$RUNNER_TEMP/outil-base/bee.py" &&
                   python3 "$RUNNER_TEMP/outil-base/bee.py" --registre . ci-scope --base "$BASE" --tete HEAD --suite-runs "$RUNNER_TEMP/suite.json") || portee=full
          [ "$portee" = data ] || portee=full
          echo "portee=$portee" >> "$GITHUB_OUTPUT"
          echo "Scope: $portee"
      - name: Tests that read the live registry (data-only PR)
        # A data-only PR changes no code: of the tool's tests, only these may read the live registry's data (the others read
        # the frozen fixture of ruche-0093). This list is TESTS_REGISTRE_REEL in outils/test_bee.py (TestCiScope checks it),
        # whose audit hook fails any other test that reads the live data.
        if: steps.portee.outputs.portee == 'data'
        run: >-
          python3 -m unittest outils.test_bee.TestRegistreReel outils.test_bee.TestRegistre.test_le_registre_livre_est_valide
          outils.test_bee.TestArbre.test_chemins_livres_tiennent_dans_un_budget_court
      - name: Validation complète du registre
        run: python3 outils/bee.py valider
      - name: Règles de la pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ steps.portee.outputs.base }}
        run: |
          # BASE: the PR's real base, computed by the "Scope of the PR" step (never empty: an empty base would compare HEAD
          # with itself and pass).
          [ -n "$BASE" ]
          compte=$(gh api "users/$AUTEUR" --jq '"\(.created_at[:10]) \(.id)"')
          # ruche-0091: the time of the PR is this run's creation, GitHub's record of the push; unreadable or malformed: refused.
          instant=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          python3 outils/bee.py verifier-pr --base "$BASE" --tete HEAD --auteur "$AUTEUR" --compte-cree-le "${compte% *}" --github-id "${compte#* }" --instant-pr "$instant"
  suite:
    # ruche-0132: the full suite, for a push to main and for a PR that is not data-only, after the job above (one job at a time
    # per PR: ruche-0092's parallel processes, not concurrent jobs); a failed job above skips it, and the run fails.
    needs: valider
    if: needs.valider.outputs.portee != 'data'
    uses: ./.github/workflows/suite.yml
