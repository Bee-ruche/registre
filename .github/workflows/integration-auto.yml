# Intègre sans humain les contributions qui satisfont la règle R3.
#
# Pour chaque contribution en relecture, l'outil bee de la branche principale décide seul
# (bee verifier-acceptation : CI verte + relectures + vote pondéré de la ruche + fenêtre écoulée).
# Si c'est bon, la PR du projet est fusionnée (fusion côté serveur : le code du fork n'est JAMAIS
# exécuté ici), puis bee integrer passe la contribution et sa tâche en « integree ». Aucun humain.
#
# Sécurité : seul l'outil bee de main s'exécute ; les fichiers des forks sont des données.
#
# Jeton de fusion :
#   - dépôt du projet = ce dépôt (architecture répartie, un dépôt par projet) → le jeton par défaut suffit ;
#   - dépôt distinct (fork séparé) → secret d'organisation BEE_INTEGRATION_TOKEN. Absent, la fusion
#     distante est sautée et la contribution reste en relecture. NE PAS le créer tant que le juge n'est
#     pas sûr (docs/architecture.md, étape 2 bis) : aujourd'hui le verdict peut être influencé par la PR
#     jugée et n'est pas lié au commit fusionné.
name: Intégration automatique

on:
  schedule:
    - cron: "26,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ecriture-main
  cancel-in-progress: false

jobs:
  integrer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Intégrer ce qui satisfait R3
        env:
          GH_TOKEN_DEFAUT: ${{ github.token }}
          BEE_INTEGRATION_TOKEN: ${{ secrets.BEE_INTEGRATION_TOKEN }}
        run: |
          python3 outils/bee.py en-attente \
            | python3 -c 'import json, sys; [print(c["id"], c["pr"], sep="\t") for c in json.load(sys.stdin) if c.get("pr")]' \
            > a_integrer.tsv
          while IFS=$'\t' read -r id pr; do
            # Décision mécanique de la ruche (R3), sans humain. Non intégrable → on passe.
            python3 outils/bee.py verifier-acceptation "$id" || continue
            depot=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            if [ "$depot" = "$GITHUB_REPOSITORY" ]; then
              jeton="$GH_TOKEN_DEFAUT"
            else
              jeton="$BEE_INTEGRATION_TOKEN"
            fi
            if [ -z "$jeton" ]; then
              echo "::notice::$id : fusion sur $depot impossible sans BEE_INTEGRATION_TOKEN ; laissée en relecture."
              continue
            fi
            etat=$(GH_TOKEN="$jeton" gh pr view "$pr" --json state --jq .state) || continue
            if [ "$etat" != "MERGED" ]; then
              GH_TOKEN="$jeton" gh pr merge "$pr" --merge --delete-branch=false \
                || { echo "::warning::$id : fusion impossible (conflit à rebaser, ou PR non mergeable) ; laissée en relecture."; continue; }
            fi
            sha=$(GH_TOKEN="$jeton" gh pr view "$pr" --json mergeCommit --jq '.mergeCommit.oid // ""')
            if [ -n "$sha" ]; then
              python3 outils/bee.py integrer "$id" --fusion-sha "$sha" || true
            else
              python3 outils/bee.py integrer "$id" || true
            fi
          done < a_integrer.tsv
          rm -f a_integrer.tsv
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 outils/bee.py valider
            git commit -am "Intégrations automatiques (R3, sans humain)"
            git push origin HEAD:main
            gh workflow run site.yml --ref main || true
          fi
