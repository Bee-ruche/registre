# Intègre les contributions qui satisfont la règle R3, et clôt celles qui ont été abandonnées.
#
# Pour chaque contribution en relecture, l'outil bee de la branche principale décide seul
# (bee verifier-acceptation : CI verte, R4/R5, relectures sur le commit jugé, avis défavorables,
# vote pondéré, fenêtre, porte humaine temporaire). Si c'est bon :
#   - la PR n'est fusionnée QUE sur le commit que la CI a jugé (--match-head-commit) ;
#   - une PR déjà fusionnée à la main (par le conseil, pendant la porte humaine) est consignée si et
#     seulement si elle l'a été sur ce même commit ;
#   - puis bee integrer passe la contribution et sa tâche en « integree », et écarte dans le même commit les
#     contributions concurrentes de la même tâche (R3 : seule la mieux classée s'intègre ; bee en-attente
#     liste chaque course de la mieux classée à la moins bien classée, qui est donc essayée d'abord).
# Une PR fermée sans fusion fait clore la contribution (bee cloturer) et rouvrir sa tâche, sauf si la course
# continue (autres contributions en relecture, titulaire ou inscrits en parallèle). Les clôtures passent APRÈS
# les intégrations du passage, et jamais quand une concurrente est intégrée ou fusionnée : une contribution qui
# a perdu la course est écartée, pas annulée.
# Les PR des contributions écartées ne sont fermées qu'APRÈS la publication réussie du registre (étape « Fermer
# les PR des contributions écartées »), et seulement si elles sont ouvertes et ouvertes par l'auteur de la
# contribution. Si un passage échoue au milieu, le suivant refait tout : rien n'est perdu ni fait deux fois.
#
# Sécurité : seul l'outil bee de main s'exécute ; les fichiers des forks sont des données, et la
# fusion se fait côté serveur (le code du fork n'est jamais exécuté ici).
#
# Jeton de fusion : PR dans ce dépôt → jeton par défaut ; PR sur un fork → secret
# BEE_INTEGRATION_TOKEN (jeton à accès fin, écriture sur les forks). Sûr tant que la porte de relecture
# de R3 est ouverte : un gardien a relu exactement le commit fusionné. Sans lui, une contribution
# intégrable attend une fusion à la main ; le passage suivant de ce workflow consigne alors l'intégration.
name: Intégration automatique

on:
  schedule:
    - cron: "26,56 * * * *"
  workflow_dispatch:
  # Activité du registre (relectures et votes fusionnés, verdicts reportés) : voir verdicts.yml. GitHub
  # n'enchaîne pas plus de trois workflow_run : la collecte des verdicts lancée par la fusion automatique
  # ne relance pas ce workflow, d'où les deux sources. Seul le code de main s'exécute.
  workflow_run:
    workflows: ["Fusion automatique", "Verdicts des forks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ecriture-main
  cancel-in-progress: false

jobs:
  integrer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r outils/requirements.txt
      - name: Intégrer ce qui satisfait R3, clore ce qui est abandonné
        env:
          GH_TOKEN: ${{ github.token }}
          BEE_INTEGRATION_TOKEN: ${{ secrets.BEE_INTEGRATION_TOKEN }}
        run: |
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          python3 outils/bee.py en-attente \
            | python3 -c 'import json, sys; [print(c["id"], c["pr"], c.get("sha_verdict") or "-", sep="\t") for c in json.load(sys.stdin) if c.get("pr")]' \
            > "$tmp/a_integrer.tsv"
          : > "$tmp/a_clore.txt"
          : > "$tmp/fusionnees.txt"
          while IFS=$'\t' read -r id pr sha; do
            depot=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            infos=$(gh pr view "$pr" --json state,headRefOid,mergeCommit \
              --jq '"\(.state) \(.headRefOid) \(.mergeCommit.oid // "-")"') || continue
            read -r etat tete fusion <<< "$infos"
            if [ "$etat" = "CLOSED" ]; then
              # Clôturée après les intégrations de ce passage (une concurrente intégrée l'écarte au lieu de l'annuler).
              printf '%s\n' "$id" >> "$tmp/a_clore.txt"; continue
            fi
            [ "$etat" = "MERGED" ] && printf '%s\n' "$id" >> "$tmp/fusionnees.txt"
            python3 outils/bee.py verifier-acceptation "$id" || continue
            if [ "$sha" = "-" ]; then
              echo "::notice::$id : verdict sans commit associé ; laissée en relecture."; continue
            fi
            if [ "$tete" != "$sha" ]; then
              echo "::notice::$id : la PR est sur $tete, le verdict sur $sha ; on attend le verdict du nouveau commit."; continue
            fi
            if [ "$etat" != "MERGED" ]; then
              if [ "$depot" = "$GITHUB_REPOSITORY" ]; then jeton="$GH_TOKEN"; else jeton="$BEE_INTEGRATION_TOKEN"; fi
              if [ -z "$jeton" ]; then
                echo "::notice::$id : intégrable ; la PR $pr attend sa fusion (pas de jeton d'intégration)."; continue
              fi
              GH_TOKEN="$jeton" gh pr merge "$pr" --merge --match-head-commit "$sha" --delete-branch=false \
                || { echo "::warning::$id : fusion refusée (conflit à rebaser, ou nouveau commit) ; laissée en relecture."; continue; }
              printf '%s\n' "$id" >> "$tmp/fusionnees.txt"
              fusion=$(GH_TOKEN="$jeton" gh pr view "$pr" --json mergeCommit --jq '.mergeCommit.oid // "-"')
            fi
            if [ "$fusion" != "-" ]; then
              python3 outils/bee.py integrer "$id" --fusion-sha "$fusion" || true
            else
              python3 outils/bee.py integrer "$id" || true
            fi
          done < "$tmp/a_integrer.tsv"
          while read -r id; do
            python3 outils/bee.py cloturer "$id" --motif "PR fermée sans fusion." --fusionnees "$tmp/fusionnees.txt" || true
          done < "$tmp/a_clore.txt"
          rm -f "$tmp/a_integrer.tsv" "$tmp/a_clore.txt" "$tmp/fusionnees.txt"
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Intégrations et clôtures automatiques (R3)"
            # main a pu avancer pendant ce passage (fusions libre-service) : se rebaser, revalider, réessayer.
            for essai in 1 2 3; do
              if git pull -q --rebase origin main && python3 outils/bee.py valider && git push origin HEAD:main; then
                gh workflow run site.yml --ref main || true
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((essai * 10))
            done
            echo "::error::publication impossible après 3 essais ; le prochain passage refera le travail (idempotent)."
            exit 1
          fi
      - name: Fermer les PR des contributions écartées
        # Seulement après une publication réussie (cette étape ne tourne pas si « Publier » a échoué) : une PR n'est
        # fermée que si l'écartement est sur main. Idempotent : on repasse sur les écartées des 7 derniers jours et
        # on ne ferme que les PR encore ouvertes, ouvertes par l'auteur de la contribution (le champ pr d'une
        # contribution est déclaré par son auteur : il ne doit pas faire fermer la PR de quelqu'un d'autre).
        env:
          GH_TOKEN: ${{ github.token }}
          BEE_INTEGRATION_TOKEN: ${{ secrets.BEE_INTEGRATION_TOKEN }}
        run: |
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          python3 outils/bee.py ecartees --jours 7 > "$tmp/ecartees.tsv"
          while IFS=$'\t' read -r id pr auteur retenue; do
            depot=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            if [ "$depot" = "$GITHUB_REPOSITORY" ]; then jeton="$GH_TOKEN"; else jeton="$BEE_INTEGRATION_TOKEN"; fi
            [ -n "$jeton" ] || { echo "::notice::$id écartée : sa PR $pr reste à fermer (pas de jeton d'intégration)."; continue; }
            infos=$(GH_TOKEN="$jeton" gh pr view "$pr" --json state,author --jq '"\(.state) \(.author.login)"' < /dev/null) \
              || { echo "::notice::$id écartée : PR $pr illisible, on ne la ferme pas."; continue; }
            read -r etat_pr auteur_pr <<< "$infos"
            [ "$etat_pr" = "OPEN" ] || continue
            if [ "${auteur_pr,,}" != "${auteur,,}" ]; then
              echo "::notice::$id écartée : la PR $pr a été ouverte par $auteur_pr, pas par $auteur ; on ne la ferme pas."; continue
            fi
            GH_TOKEN="$jeton" gh pr close "$pr" < /dev/null \
              --comment "Écartée au profit de $retenue, retenue par la règle R3 (course entre contributions concurrentes de la même tâche). Ce n'est pas un refus : rien ne compte contre son auteur ni ses relecteurs." \
              || echo "::warning::$id : fermeture de la PR $pr impossible ; le prochain passage réessaiera."
          done < "$tmp/ecartees.tsv"
          rm -f "$tmp/ecartees.tsv"
