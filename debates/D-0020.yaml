id: D-0020
question: 'Trouver des garants. La ruche n''a qu''un garant et qu''un gardien : un seul point de défaillance
  (docs/garants.md). Quelles personnes inviter d''abord à devenir garants (mainteneurs de logiciels libres,
  chercheurs, enseignants, autres), selon quels critères publics et vérifiables, avec quelles garanties
  d''indépendance entre garants, et quel serait le texte de la première invitation (R13 : publique, décidée,
  plafonnée, refus définitif) ? (docs/croissance.md)'
opened_by: bidji29
opened_at: '2026-10-30T12:09:28Z'
status: open
rapporteur: bidji29
synthesis: ''
arguments:
- id: A1
  by: bidji29
  at: '2026-11-01T00:31:24Z'
  position: fact
  text: 'R15 (merged 1 Nov 2026, docs/devolution.md sections 5 and 6) now sets the public criteria. Numbers
    for phase 2: 3 to 5 guarantors with distinct employers, 2 security guardians, a council of three before
    phase 3. Filter 1, pass/fail on public evidence, not a score: a durable public identity; evidence
    in the role''s field (merged work in projects the person does not own, software others depend on,
    credited security reports, reviews of others'' code; stars, followers and activity graphs prove little);
    independence (no employer shared with another privileged person, never a maintainer of a project the
    hive forks, commandment 8); public acceptance of the commandments and of the guarantor''s commitment;
    about an hour a week, declared. Filter 2: this R13 process. Filter 3: a four-week trial, reviews recorded
    and not counted, plus seeded defects. Still open here: who to invite first, and the text of the first
    invitation.'
  sources:
  - docs/devolution.md
