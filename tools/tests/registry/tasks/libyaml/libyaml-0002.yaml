id: libyaml-0002
project: libyaml
category: parsing-serialization
type: test
size: M
title: "Harnais de fuzzing différentiel de l'analyseur (ASan/UBSan)"
context: >
  libyaml analyse des entrées non fiables : le fuzzing est essentiel. Écrire bee/fuzz/fuzz_parse.c
  (compatible libFuzzer et avec le pilote de repli bee/fuzz/pilote_aleatoire.c déjà présent) qui
  analyse une entrée arbitraire avec libyaml et consomme tous les événements, sous ASan et UBSan.
  Différentiel : comparer base et candidat sur la même entrée (même flux d'événements, même statut
  d'erreur), par exemple en liant les deux dans un même exécutable (symboles de la base renommés).
  Un écart est NOUVEAU s'il n'apparaît pas aussi en rejouant l'entrée sur la base seule (c'est ce que
  fait l'option --reference du fuzzing de miniz, qui ne compare pas les sorties) : un écart NOUVEAU
  fait échouer, un écart préexistant est seulement signalé. En mode CI (dépôt public), ne jamais publier l'entrée
  fautive ni la trace : mode discret, empreinte seulement (voir docs/securite.md du registre).
  Ajouter un job « fuzzing » à bee-ci.yml, sur le modèle de celui de minizBee.
files: [bee/fuzz/fuzz_parse.c, bee/fuzz/lancer.sh, .github/workflows/bee-ci.yml]
reach: 1.0
metric: null
acceptance_criteria:
  - "CI verte (R2) ; le job fuzzing tourne 10 min sans écart nouveau sur la base"
  - "ASan et UBSan actifs ; une entrée connue qui casse une version mutée est bien signalée"
  - "mode discret en CI : aucune entrée fautive ni trace publiée (empreinte seulement)"
  - "repli gcc + pilote aléatoire quand libFuzzer est absent"
