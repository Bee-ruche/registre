title: "Juge isolé de libyaml, étape 1/6 : harnais de vérification et script de construction"
context: >
  Découpage de libyaml-0005 (juge isolé pour libyaml, environ 800 lignes hors tests en tout), étape 1 sur 6 ;
  utile seule : un harnais isolé qu'on peut lancer à la main, sur lequel reposent toutes les étapes suivantes.
  Le juge commun du registre (outils/juge/, docs/juge-commun.md, étiquette juge-v1) exécute le code C de la
  PR en conteneur sans réseau, en lecture seule, sans privilège ; le projet lui fournit un harnais
  (bee/juge/execution.c), un script de construction (bee/juge/construire.sh) et un greffon
  (bee/juge/projet.py, libyaml-0014). Modèles : le projet jouet du registre (outils/juge/jouet/bee/juge/ :
  execution.c 137 lignes, construire.sh 17) et minizBee (bee/juge/execution.c 510 lignes, construire.sh 32).
  Le sérialiseur bee_flux de bee/fuzz/fuzz_parse.c (libyaml-0002, intégrée) écrit déjà le flux d'événements
  strict, erreurs et positions comprises ; compilé avec -DBEE_FLUX_SEUL, il ne définit que bee_flux : à
  vérifier, puis à réutiliser plutôt qu'à copier. Le mode verifier écrit, pour chaque entrée, le flux
  sérialisé et le statut (ok ou err). Jusqu'à libyaml-0018, la CI n'appelle pas bee/juge/ : cette étape ne
  change aucun verdict. Elle touche les juges : relue par un gardien ou par le conseil.
files: [bee/juge/execution.c, bee/juge/construire.sh]
