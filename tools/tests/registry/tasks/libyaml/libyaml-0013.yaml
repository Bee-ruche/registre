acceptance_criteria:
  - "compilé dans la sandbox sur la base, deux exécutions de execution verifier sur le corpus écrivent des sorties identiques octet pour octet, et le statut de chaque fichier (ok ou err) est celui de bee/tests/empreintes-reference.txt"
  - "construire.sh laisse un obj/<nom>.o par fichier de src/*.c, sans homonyme"
  - "aucun tampon n'est dimensionné d'après le seul code jugé"
