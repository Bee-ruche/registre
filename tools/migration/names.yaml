hand:
- files: COMMANDEMENTS.md
  removed: true
  why: a translation, removed (plan, section 12, change 13; open question 2)
- files: AGENTS.en.md
  removed: true
  why: its text becomes AGENTS.md (plan, section 12, change 13)
- files: AGENTS.md
  becomes: AGENTS.en.md
  commands: true
  why: 'the front door in English: the base''s AGENTS.en.md, its commands renamed in its code (change 10)'
- files: '*.md'
  same: true
  why: root documents, moved by the path map; their text changes after the switch, by council PRs
- files: .gitignore
  same: true
  why: names no French folder
- files: docs/english-*.md
  same: true
  why: 'the migration plan and the name map: they name each command in both languages on purpose (change 10 would make
    them say the opposite), byte-identical'
- files: docs/decisions.md
  same: true
  why: 'the decision log: closed history, kept as written (plan, section 8), its old command names included'
- files: docs/**
  same: true
  commands: true
  why: moved by the path map, the commands renamed in their code (change 10); their prose after the switch, by council PRs
- files: gouvernance/consignes/*.md
  same: true
  why: role instructions, moved; their text by the founder, after the switch
- files: modeles/BEE.md
  same: true
  why: template prose, moved
- files: .claude/**
  same: true
  commands: true
  why: the skill, moved, the commands renamed in its code (change 10); its prose after the switch
- files: .github/workflows/juge*.yml
  same: true
  why: 'the common judge''s reusable workflow and its meta-tests, as written and where they are until judge-v4 (ruche-0148):
    the forks call juge.yml by its path at a pinned commit, with its inputs, outputs and artifact « juge » (ruche-0153)'
- files: .github/**
  same: true
  why: templates, moved (the workflows are code)
- files: outils/requirements.txt
  same: true
  why: names no French word
- files: outils/juge/**
  same: true
  why: 'the common judge, as written and where it is until judge-v4 (ruche-0148): the forks'' plugin (bee/juge/projet.py, its
    constants and methods), the harness, the build script and juge.json are its interface with them; a fork that moves its
    pin to the switch runs the same bytes (ruche-0153)'
- files: outils/repetition/*.md
  same: true
  why: the rehearsal kit's README template, moved
- files: outils/migration/names.yaml
  same: true
  why: 'this map, moved: every proof reads it from the base'
- files: outils/migration/identifiers.yaml
  same: true
  why: 'the identifier map of step 1b, moved: every proof reads it from the base'
- files: outils/migration/check_migration.py
  same: true
  why: 'step 1c''s proofs, moved: they name the old tool''s French names on purpose, and run only from the base'
- files: outils/migration/switch.py
