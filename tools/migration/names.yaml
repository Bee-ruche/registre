hand_tokens:
  issue: key -> outcome (debates, incidents, report decisions, judge report); the removal channel value « issue
    » stays
  signalement: command -> decide-report; gate nature and folder signalements -> report(s)
  contribution: key and positional stay contribution; schema contribution.schema.json -> manifest.schema.json (it
    validates the fork's manifest); the record schema enregistrement.schema.json -> contribution-record.schema.json
  enregistrement: schema name only -> contribution-record (no key or value)
  ecartee: contribution and invitation status -> set_aside; the invitation gesture key ecartee -> set_aside
  ecartees: command -> set-aside
  ecarter: invitation action -> dismiss; option --ecarter -> --dismiss
  ecartement_invitation: gate nature -> invitation_dismissal
  ecart_declare: key -> declared_gap
  ecart_declare_max: bee.yaml key -> max_declared_gap
  ecart: bee cap --json key -> gap
  creations/<dossier>_max_par_pr: 'bee.yaml keys built as f"{dossier}_max_par_pr": folder and suffix both change
    (by hand)'
  fichiers: 'switch checklist: the path values of open tasks'' fichiers and hors_perimetre are left to a council
    PR right after the switch (bee only warns on a file outside them): ruche-0058 and ruche-0146 to ruche-0150 already
    name the English paths, so translating them would make the inverse ambiguous; closed tasks keep theirs as written'
  --dry-run: 'publier''s second spelling of --a-blanc: dropped, --a-blanc becomes --dry-run (one name, one-to-one)'
  conseil: the council's pseudo -> council in data (login domain) and code; both stay in pseudos_reserves
