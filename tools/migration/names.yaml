# The French -> English name map of the registry, scoped per schema and per file family (ruche-0141, step 1a of the plan
# docs/english-migration.md, section 13). Generated once from the reviewed draft docs/english-names.md (its seed), the
# schemas, the data of main and the tool's JSON outputs; edited by hand since, and reviewed as data.
#
# Read by outils/migration/rename.py (apply, inverse, check, lint). Inside one family (the keys of one file family, the
# values of one domain, the paths, the commands, the options of one script), two French names never share an English name,
# so the inverse is a function per family (the lint). Every proof reads this file from the base commit, never from the PR.
#
#   date_d        the date until which fork documents are read in either vocabulary: 2027-01-01 at the earliest; the switch
#                 (ruche-0145) sets the final value (its merge plus six weeks).
#   retired       French names refused once the switch is merged (the switch fills the guard).
#   hand_tokens   tokens whose English name depends on their role: renamed by hand (plan, section 12, change 7).
#   paths         French path -> English path; an entry ending in / maps a folder prefix, the others one file.
#   env           environment variables bee, its tests and the workflows read (english-names.md, section 5.5; ruche-0142
#                 added BEE_PAUSE_FUSION, the auto-merge pause; ruche-0152, those of the workflows' steps).
#   workflows     the names the workflows and scripts hold (ruche-0152): workflow names (what workflow_run listens to),
#                 job ids (needs), step ids (steps.<id>.outputs), inputs and outputs, concurrency groups, step names, and
#                 the robots' texts (commit messages); each section one-to-one; a name already mapped elsewhere, as there.
#   tree          node ids are paths under tree/: each segment maps through `segments`; children lines are read in the
#                 sections named in `children`.
#   families      per file family: files (globs from the registry's root), writer (text: key and value tokens edited in
#                 place, order, quoting, comments and wrapping kept; canonical: re-rendered by the tool's own writer;
#                 markdown: tree nodes; json: an output, no file), keys (every key of the family, French -> English),
#                 values (path -> domain: `a/b`, `[]` for a list item, `*` for a key that is data, `**/k` for k at any
#                 depth), key_values (path -> domain, or null: the keys of that mapping are data, kept or mapped by the
#                 domain). Every scalar outside a domain is a leaf, kept byte for byte: free texts are never translated.
#   domains       closed: a value outside its domain is refused. open_domains: values not listed stay as written.
#                 The domains `path` and `node` are the path map and the tree segments.
#   code          the code files (Python, shell, workflows), listed one by one: steps 1b and 1b-2's proofs (P1, P1b, P3, the
#                 workflows' links) cover their content (rename_code.py, with identifiers.yaml); P2 checks only their place
#                 (the path map) and their mode.
#   hand          every other file no family translates, by glob, the first matching entry deciding: same (byte-identical,
#                 at its English path), becomes (byte-identical to that file of the base) or removed. With same or becomes,
#                 commands: true (change 10, ruche-0153) allows exactly one change: each `bee <command>` and its options
#                 inside the file's code spans and fenced code blocks, renamed by the command table (rename_code.py,
#                 CodeMap.commands); prose stays, and the result must translate back to the base's file byte for byte.
#                 A tree node family with commands: true, the same for its text. A schema of schemas/ is translated
#                 with its family (keys, domains and schema_strings: $id, patterns), byte for byte.
#   new           globs of files the switch may add.
