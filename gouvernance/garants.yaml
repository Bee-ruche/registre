# Garants (docs/garants.md) : les personnes humaines, identifiables publiquement, qui dirigent les gardiens
# et répondent publiquement de ce qu'ils font. Nommés et révoqués par le conseil.
#
# Chaque entrée : pseudo (compte GitHub), identite_publique (nom, ou identité publique durable),
# profil (lien public), engagement (version de l'engagement de docs/garants.md), signe_le (date),
# consignes (chemin des consignes publiées données aux gardiens), conflits (déclarés).
# Une entrée n'est jamais supprimée : une révocation s'ajoute (revoque_le, motif).
#
membres:
