    identite_publique: QueenBee
    profil: https://github.com/bidji29
    role: fondateur et conseil ; garant de l'agent principal, qui relit au nom du conseil
    engagement: docs/garants.md, version du 28/10/2026
    signe_le: "2026-10-28"
    consignes: gouvernance/consignes/agent-principal.md
    conflits: []
