    suivants.'
  - 'Différentiel de l''Adler-32 de tinfl contre adler32 de zlib (programme hors dépôt) : toutes les tailles
    de 0 à 8192 octets, 4 motifs (0xFF partout, 0x00, aléatoire, 0xFF/0x00 au hasard), flux zlib de niveau
    0 (blocs stockés) et 6 ; tinfl en une fois (statut DONE, sortie, m_check_adler32 = adler32), même
    flux avec l''Adler-32 final corrompu (TINFL_STATUS_ADLER32_MISMATCH, mêmes octets produits), Deflate
    brut avec TINFL_FLAG_COMPUTE_ADLER32 ; tailles k x 5552 +- 200 pour k = 1 à 5 (dont les multiples
    de 160 voisins) ; 300 tailles au hasard (250 000 au plus) ; mz_inflate en flux, tampons de sortie
    de 1, 7, 159, 160, 161, 319, 320, 4096, 5551, 5552, 5553 et 11104 octets (Adler-32 repris d''un appel
    à l''autre). 154 944 cas, 0 écart, en -O3 et sous ASan + UBSan.'
  - 'Même programme : 40 000 flux corrompus au hasard (1 à 3 octets changés, la moitié du temps dans l''Adler-32
    final ; 33 174 rendus TINFL_STATUS_ADLER32_MISMATCH en une fois), décodés en une fois et en flux ;
    statuts, octets produits et Adler-32 de tous les cas réduits en une empreinte, identique entre base
    a2f939a et branche, en -O3 comme sous ASan + UBSan.'
  - 'Mêmes entiers avant la réduction : le texte exact du calcul (miniz_tinfl.c l. 688 à 750) extrait
    par script dans une fonction qui relève s1 et s2 avant chaque modulo, comparé à la boucle octet par
    octet et à zlib : toutes les tailles de 0 à 6 x 5552 en octets 0xFF (débordement), de 0 à 2 x 5552
