    would still be refused by the registry until the switch. The help reading follows argparse''s usage
    format: if the registry ever keeps the old command as a full subcommand with all its options, both
    commands are retained and the job turns red (fail closed), to be fixed then. Behaviour changes: a
    task with metrique: null no longer takes the manifest''s metric; an unknown type now fails (relecture
    added to the closed list); a task found twice in the registry is refused; an optimisation task without
    a metric is refused. This changes bee/ on master, so the open task PRs must be rebased on master after
    the merge (no conflict, checked with git merge-tree): #20 (miniz-0036), #18 (miniz-0029), #15 (miniz-0017),
    #13 (miniz-0018), all based on a2f939a; they are already asked to rebase by the greffon job, and their
    own bee-ci.yml would break on tools/requirements.txt after the switch.'
