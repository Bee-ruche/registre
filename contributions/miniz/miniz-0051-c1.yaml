  teste:
  - 'In the sandbox (bee/sandbox/sans-docker.sh), on this head: bee/ci/test_verdict.py 74 tests OK (67
    before, 7 new); bee/bench/test_ab.py 10 OK; bee/bench/test_profil.py 4 OK; python3 bee/corpus/generer.py
    conforming (61 files, 12021783 bytes); bee/tests/lancer.sh OK (exit 0: 3843 differential checks, 0
    differences; API edge cases, 0 failures).'
  - 'A manifest is a regular file, end to end through manifeste.sh on a small git repository and a fake
    registry: a symbolic link to a valid manifest inside the repository, to one outside it, a dangling
    link, CONTRIBUTION.yaml as a link, CONTRIBUTION.yaml as a folder: each refused before any read (no
    task read, no tool call, nothing written to GITHUB_OUTPUT), the regular file beside them accepted.
    tache.py alone: a link to a valid manifest, a dangling link and a folder refused without a traceback
    or a task copy; the regular file accepted.'
  - 'The workflow''s keep step, extracted from bee-ci.yml and run: a regular manifest kept from manifests/,
    manifestes/ or CONTRIBUTION.yaml; a link (outside or inside the repository), a folder, an invalid
    name not kept.'
  - 'verdict.py: a task copy, manifest or juge-ancien.json planted in another artifact sorting first,
    or in a subfolder of the right artifact sorting before its root, ignored; with the task copy only
    there, « Manifeste et taille » red, never the planted metric. An ab.json or juge.json planted in other
    artifacts or in a subfolder of « juge » never read, in CI and in simulation; the honest juge.json
    read.'
  - 'State files: for each of the eight steps that have a state file, the legitimate one missing and «
    succes » planted in « juge », another artifact, another job''s folder, the right artifact''s root
    or a subfolder: the step stays without a result and the verdict red; the legitimate state as a symbolic
    link: the same; « amorcage » planted outside the jobs'' folders not read, read in one of them. The
    task copy, the old judge''s report and the common judge''s report as symbolic links, in place and
    to valid content: never read.'
  - 'Mutations: on master''s scripts the first five new tests fail (13 sub-checks); with tache.py hardened
    but manifeste.sh not, the manifeste.sh test still fails (5 sub-checks); on the previous verdict.py
    (19e9b05) the two state and link tests fail (every step''s sub-check).'
  non_teste:
  - 'GitHub Actions itself: the keep step runs here extracted from the workflow, outside GitHub. The verdict
    reads the task copy and the manifest at the root of etat-manifeste and juge-ancien.json at the root
    of etat-juge-ancien, which relies on upload-artifact putting the contents of donnees/ and conserver/
    at the artifact''s root, as it documents and as libyamlBee already relies on; were that layout to
    change, the verdict would turn red (copy absent), never green.'
  - 'The common judge, its meta-tests (bee/juge/test_juge.py) and the fuzzing: unchanged by this PR, not
    rerun here; ARM64: x86-64 only (nothing here depends on the architecture).'
  - 'The independent adversarial review by an agent of another model (second criterion): not part of the
    builder''s work.'
  doutes: 'Behaviour change for a local simulation only: one that relied on verdict.py finding an ab.json
    somewhere under --artefacts must now pass --ab (or put juge.json in --juge), and its state files go
    at the root of --etats or in the jobs'' state folders (no longer anywhere under --artefacts). The
    state folders are those bee-ci.yml uploads today: a job that changes where it puts its states must
    change DOSSIERS_ETATS with it, or its step stays without a result and the verdict red, never green.
    The fork''s CI judges a PR with the base''s bee/, so this PR''s own manifest check and verdict use
    master''s scripts; the new ones apply from the next PR on (the job « Tests de l''outillage de CI de
    la PR » runs this PR''s test_verdict.py).'
