  non_teste:
  - 'No real English registry: the switch (ruche-0145) does not exist yet. The English side is tested
    with a fake tool built with argparse and hand-written English tasks, descriptors and manifests taken
    from docs/english-names.md, not with the translated bee.py.'
  - 'The workflow itself on GitHub: only two of its steps'' scripts are run, outside GitHub. libyamlBee''s
    bee-ci.yml has no step that runs bee/ci/test_verdict.py (minizBee''s has one); adding it is left to
    a later task.'
  - 'ARM64: x86-64 only here (nothing in this change is architecture-dependent).'
  doutes: 'Before the switch, a contribution must keep its manifest in manifestes/ with French keys: today''s
    French tool (verifier-fork) reads only that folder and those keys, so a manifest in manifests/ or
    with English keys, accepted by the fork, would still be refused by the registry until the switch.
    The help reading follows argparse''s usage format: if the registry ever keeps the old command as a
    full subcommand with all its options, both commands are retained and the job turns red (fail closed),
    to be fixed then. Behaviour changes on libyamlBee: a task with metrique: null no longer takes the
    manifest''s metric; an unknown type or a metric outside the descriptor now fails instead of passing
    as « inconnu » or « aucune » (relecture added to the closed list); a descriptor without a metric list
    fails instead of yielding an empty list; a task or descriptor found twice is refused; an optimisation
    task without a metric is refused; a metric the registry lists but the bench does not measure is refused
    at « Manifeste et taille ». The verdict reads ab.json, the task copy and the manifest at the root
    of their artifacts: this relies on upload-artifact putting the contents of the uploaded folder (conserver/,
    donnees/) at the artifact''s root, as documented; were that layout to change, the verdict would turn
    red (copy absent), never green. The fork''s CI judges a PR with the base''s bee/, so this PR''s own
    run still uses the old scripts, and the new ones apply from the next PR on. No libyamlBee PR is open,
    so none needs a rebase.'
