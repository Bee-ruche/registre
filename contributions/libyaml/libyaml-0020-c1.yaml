  teste:
  - 'In the sandbox (bee/sandbox/sans-docker.sh), on this head: bee/ci/test_verdict.py, new, 33 tests
    OK. Readers on both layouts end to end through manifeste.sh, on a small git repository and a fake
    registry in each layout (tasks/taches, projects/projets, tools/outils, manifests/manifestes), with
    an argparse fake tool in each vocabulary whose help text also names the other vocabulary''s names;
    documents of each vocabulary in a registry of the other; a mixed task, descriptor or manifest refused.'
  - 'Failing the job without calling the tool or writing the task copy: an unreadable task, type or metric,
    an optimisation without a metric, an unreadable, mixed, missing or duplicated descriptor, a task missing
    or found twice, a metric the registry lists but the bench does not measure, a manifest that is not
    UTF-8 or not YAML (no traceback), a manifest that is a symbolic link (into the repository or outside
    it) or a folder. The metric list taken from the registry''s descriptor. The command and options asked
    from --help: a renamed-command stub without options set aside; two complete commands, an option under
    both names, a missing option or a failing help refused.'
  - 'verdict.py: the metric from the task copy in both vocabularies, red when the copy is absent in CI
    or unreadable, never the manifest''s metric; a task copy, manifest or ab.json in another job''s artifact
    or in a subfolder of the right one ignored, even when it sorts first; the R1 count. bee-ci.yml: the
    requirements and manifest-keeping steps extracted and run (a symbolic link is not kept).'
  - 'Twenty-two deliberate mutations each made the new tests fail: manifests/** counted in R1, the whole
    help scanned, a missing task copy tolerated in CI, mixed documents accepted, a default type, an optimisation
    without a metric, an empty default metric list, the task copy or ab.json from any artifact or a subfolder,
    a task found twice, manifests/ out of the diff filter, two requirements files, manifests/ not kept,
    the fork''s metric list instead of the registry''s, BEE_REGISTRE kept, a missing metric key read as
    null, a value of the other vocabulary, an unmeasured metric, a non-UTF-8 manifest uncaught, a symbolic-link
    manifest accepted or kept.'
  - 'Smoke run of bee/ci/manifeste.sh in the sandbox against a clone of the real registry main (French,
    42d7537): on master''s merge of libyaml-0003 (1e90ffd..a5097dc) and on this branch (01cac4b..head,
    author bidji29), after the review fixes, tache.py read the task and verifier_fork.py chose outils/bee.py
    --registre verifier-fork with --tache --base --tete --depot --auteur; the real verifier-fork passed
    both. Every task of taches/libyaml/ and every metric list of projets/ reads with the new readers (ruche.yaml,
    which has no metrics, is refused, as intended).'
  - bee/bench/test_ab.py and bee/tests/lancer.sh (determinism) pass in the sandbox on this head; neither
