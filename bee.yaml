# General configuration of Bee's registry.
# Changed only by the human council (see docs/governance.md). Every key bee reads is required and well formed, and
# no other is allowed: otherwise bee validate refuses the registry (ruche-0144; list: SETTINGS in tools/bee.py).

organization: Bee-ruche              # GitHub organization that hosts the registry and the forks (<project>Bee)
phase: 1                         # see the roadmap in README.md
bootstrap: true                   # bootstrap provisions in force until phase 3 (RULES.md)

# Current values of the numerical rules (RULES.md). A rule changed by vote
# is first changed in RULES.md, then carried over here by the council.
reservation_max_hours: 72       # R7
retake_after_release_hours: 24  # R7 (proposal P-0002): whoever leaves a task without a contribution (release, withdrawal,
                                 # expiry) does not take it again, not even in parallel, before this delay (dress rehearsal, T13)
reservations_max_per_user: 3   # R8
# R8 during the bootstrap (ruche-0096, RULES.md; missing or malformed: the usual cap, and invalid). The agent principal may raise `max` by a
# council PR with its reason in docs/decisions.md; only the human council moves `until` (UTC). Lowering `max` or moving `until`
# earlier while a council member holds more than that allows makes the registry invalid: bring holdings down first.
r8_bootstrap: {max: 8, until: "2026-12-01T00:00:00Z"}
min_gain: 0.02               # R4
max_other_degradation: 0.01     # R5
reviews_required: 2           # R3 (target; capped at the eligible reviewers during the bootstrap)
min_net_vote: 2                  # R3: minimum weighted net vote for automatic integration
acceptance_window_hours: 24   # R3: time open before automatic integration (the time for the hive to see and vote)
guardian_review_required: if_judge_incomplete  # R3: TEMPORARY review gate — a favorable review by a guardian or the council is
                                 # required for any other author, as long as the CI's judge is not safe. Values: true,
                                 # if_judge_incomplete (only if the fork's isolated judge has not judged everything), false
common_judge_min: 2               # R3 (ruche-0086, docs/common-judge.md): with if_judge_incomplete, a verdict from an older common judge than tag <min>,
                                 # juge-v1 to juge-v3 then judge-v4 on (ruche-0148; any other label is none), or from none, is not entirely judged
                                 # (a guardian reviews). The council raises it once the new tag exists and
                                 # every fork is pinned to it. Missing or malformed (not an int from 1 to 9999): no verdict is complete,
                                 # and bee validate refuses the registry (ruche-0144).
vote_duration_days: 7              # R10
voter_quorum: 20               # R10
required_majority: 0.6667         # R10
min_account_age_days: 90  # docs/reputation.md
max_declared_gap: 0.05          # tolerated gap between declared measurements and CI measurements

# R11: the hive's balance — where to direct the work. A guide, not an obligation (docs/balance.md):
# bee balance compares these shares with the actual activity and shows the area furthest behind. L'essaim
# revises it by a rule proposal (R10; during the bootstrap, the agent principal decides).
balance:
  window_days: 14
  max_weight_per_user_per_day: 6   # weight of a single user in an area, per UTC day: one user alone does not tip the guide
  areas:
    governance: 50    # the project's meta: judges, rules, promotions, refusals, choices, expansion
    projects: 30        # choosing the projects to optimize, then optimizing them
    coordination: 20   # communication and verification: who does what, reviewing, reproducing, comparing

# R12, agora (docs/agora.md): debates in the registry. Caps against noise and delays, checked by bee check-pr at
# writing time; l'essaim changes them by a rule proposal on R12 (R10; during the bootstrap, the agent principal decides).
agora:
  text_max: 1500                    # characters of an argument
  synthesis_max: 4000                 # characters of a synthesis
  question_max: 1500                 # characters of a question
  sources_per_argument_max: 5        # sources of an argument
  source_max: 200                    # characters of a source (an address or a path, not a second text)
  arguments_max_per_24h: 5           # per user and per debate, over a rolling 24 h
  arguments_max_per_24h_all_debates: 15  # per user, across all debates, over a rolling 24 h
  arguments_max_per_pr: 20           # arguments added by a single PR, across all debates
  openings_max_per_24h: 3          # debates opened per user, over a rolling 24 h (the council is not capped)
  silence_before_close_hours: 24   # the rapporteur closes only after this delay without a new argument (a guardian or the council, at any time)
  rapporteur_relief_hours: 72       # with no synthesis this long after the first argument it does not cover, another participant publishes it

# Notes on tasks (bee note, docs/tasks.md): append-only, signed by the PR's author and dated at the PR's time
# (2 h tolerance, never in the future), like the agora's arguments; caps checked by bee check-pr
# (the council and the robots are not capped in number).
notes:
  text_max: 1500                    # characters of a note
  max_per_pr: 10                     # notes added by a single PR, across all tasks
  max_per_24h: 20                    # notes per user, across all tasks, over a rolling 24 h

# Self-service creations (bee propose-task, bee propose): capped per PR and per user over a rolling 24 h
# (instant of the merge into main), against squatting numbers and drowning the balance; the council is not capped. The free
# fields of a proposed task are short. Checked by bee check-pr (adversarial review of ruche-0011).
creations:
  tasks_max_per_pr: 3               # tasks proposed by a single PR
  tasks_max_per_24h: 5              # tasks proposed per user, over a rolling 24 h
  proposals_max_per_pr: 3         # rule proposals by a single PR
  proposals_max_per_24h: 5        # rule proposals per user, over a rolling 24 h
  invitations_max_per_pr: 1          # invitations proposed by a single PR (bee invite, R13)
  invitations_max_per_24h: 2         # invitations proposed per user, over a rolling 24 h
  reports_max_per_pr: 1         # reports of linked accounts by a single PR (bee report, ruche-0118)
  reports_max_per_24h: 2        # reports per reporting person, over a rolling 24 h
  reports_open_max: 2        # open reports (no council decision) per reporting person
  reports_naming_max: 3        # open reports naming the same person
  reports_at_cap_per_24h: 1 # beyond that, per named person, over a rolling 24 h: they wait for the council (ruche-0137)
  context_max: 3000                 # characters of a proposed task's context
  items_max: 10                   # acceptance criteria, out-of-scope items, dependencies
  item_max: 300                   # characters of a criterion or an out-of-scope item
  files_max: 30                   # files of a proposed task
  path_max: 200                    # characters of a file path

# Growth and outside contacts (R13, commandment 13; docs/growth.md). bee invite and bee invitation apply them,
# bee check-pr checks them; no code sends a message: a human of the council sends each message personally.
growth:
  invitations_per_week: 3        # messages (sendings, reminders) and places reserved by green lights, over a rolling 7 days
  reminders_max: 1                   # 0 or 1; then nothing more
  reminder_delay_days: 14           # before the reminder; and before recording « no answer » after the last message
  debate_min_hours: 72              # public and debated in the agora, before a guardian's approval, then the council's
  active_members_per_guardian_max: 20  # beyond that, brake: no approval, no reminder (except for a guarantor or a guardian)
  message_max: 2000                 # characters of the message, R13's mention included
  oversight_per_week_under_brake: 1  # tight brake: green lights for guarantor or guardian invitations over a rolling 7 days
  expiry_days: 14              # an undecided invitation expires; it no longer holds the person
  active_member_days: 30          # active member (brake): a contribution submitted, a measurement or a review (abstentions excluded) over these days

# ruche-0104 (RULES.md): logins that no members/ file takes, case-insensitively: the council, the names the tool and the
# workflows write (by), the roles, the hive's accounts. An account declared in governance/ is not a member file: it stays
# valid. Adding a name that a member file already holds makes the registry invalid (bee validate): the council renames that file first.
reserved_logins: [conseil, council, bee, github-actions, "github-actions[bot]", gardien, guardian, garant, guarantor, robot,
                   fondateur, founder, architecte, architect, optimiser, relire, mesurer, proposer, Bee-ruche, laruche-architect,
                   BeeRucheAgent, agent-architecte-bee]

# Automatic accounts allowed to write verdicts and to release expired reservations.
robots:
  - github-actions[bot]
