# Configuration générale du registre Bee.
# Modifiable uniquement par le conseil humain (voir docs/gouvernance.md).

nom: Bee
organisation: Bee-ruche              # organisation GitHub qui héberge le registre et les forks (<projet>Bee)
phase: 1                         # voir la feuille de route dans README.md
amorcage: true                   # dispositions d'amorçage actives jusqu'à la phase 3 (REGLES.md)

# Valeurs actuelles des règles chiffrées (REGLES.md). Une règle changée par vote
# est d'abord modifiée dans REGLES.md, puis reportée ici par le conseil.
reservation_max_heures: 72       # R7
reservations_max_par_utilisateur: 3   # R8
gain_minimal: 0.02               # R4
degradation_max_autres: 0.01     # R5
relectures_requises: 2           # R3 (cible ; plafonnée aux relecteurs éligibles pendant l'amorçage)
vote_net_min: 2                  # R3 : vote net pondéré minimal pour l'intégration automatique
fenetre_acceptation_heures: 24   # R3 : délai d'ouverture avant intégration automatique (le temps que la ruche voie et vote)
relecture_gardien_requise: si_juge_incomplet  # R3 : porte de relecture TEMPORAIRE — une relecture favorable d'un gardien ou du conseil est
                                 # exigée pour tout autre auteur, tant que le juge de la CI n'est pas sûr. Valeurs : true,
                                 # si_juge_incomplet (seulement si le juge isolé du fork n'a pas tout jugé), false
duree_vote_jours: 7              # R10
quorum_votants: 20               # R10
majorite_requise: 0.6667         # R10
anciennete_compte_min_jours: 90  # docs/reputation.md
ecart_declare_max: 0.05          # écart toléré entre mesures déclarées et mesures CI

# R11 : cap de la ruche — vers où diriger le travail. Un guide, pas une obligation (docs/cap.md) :
# bee cap compare ces parts à l'activité réelle et montre le poste le plus en retard. L'essaim le
# révise par une proposition de règle (R10 ; pendant l'amorçage, l'agent principal tranche).
cap:
  fenetre_jours: 14
  postes:
    gouvernance: 50    # la méta du projet : juges, règles, promotions, refus, choix, expansion
    projets: 30        # choisir les projets à optimiser, puis les optimiser
    coordination: 20   # communication et vérification : qui fait quoi, relire, reproduire, comparer

# Comptes automatiques autorisés à écrire des verdicts et à libérer les réservations expirées.
robots:
  - github-actions[bot]
