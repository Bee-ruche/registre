# Configuration générale du registre Bee.
# Modifiable uniquement par le conseil humain (voir docs/gouvernance.md).

nom: Bee
organisation: Bee-ruche              # organisation GitHub qui héberge le registre et les forks (<projet>Bee)
phase: 1                         # voir la feuille de route dans README.md
amorcage: true                   # dispositions d'amorçage actives jusqu'à la phase 3 (REGLES.md)

# Valeurs actuelles des règles chiffrées (REGLES.md). Une règle changée par vote
# est d'abord modifiée dans REGLES.md, puis reportée ici par le conseil.
reservation_max_heures: 72       # R7
reprise_apres_liberation_heures: 24  # R7 (proposition P-0002) : qui quitte une tâche sans contribution (libération, retrait,
                                 # expiration) ne la reprend pas, ni en parallèle, avant ce délai (répétition générale, T13)
reservations_max_par_utilisateur: 3   # R8
gain_minimal: 0.02               # R4
degradation_max_autres: 0.01     # R5
relectures_requises: 2           # R3 (cible ; plafonnée aux relecteurs éligibles pendant l'amorçage)
vote_net_min: 2                  # R3 : vote net pondéré minimal pour l'intégration automatique
fenetre_acceptation_heures: 24   # R3 : délai d'ouverture avant intégration automatique (le temps que la ruche voie et vote)
relecture_gardien_requise: si_juge_incomplet  # R3 : porte de relecture TEMPORAIRE — une relecture favorable d'un gardien ou du conseil est
                                 # exigée pour tout autre auteur, tant que le juge de la CI n'est pas sûr. Valeurs : true,
                                 # si_juge_incomplet (seulement si le juge isolé du fork n'a pas tout jugé), false
duree_vote_jours: 7              # R10
quorum_votants: 20               # R10
majorite_requise: 0.6667         # R10
anciennete_compte_min_jours: 90  # docs/reputation.md
ecart_declare_max: 0.05          # écart toléré entre mesures déclarées et mesures CI

# R11 : cap de la ruche — vers où diriger le travail. Un guide, pas une obligation (docs/cap.md) :
# bee cap compare ces parts à l'activité réelle et montre le poste le plus en retard. L'essaim le
# révise par une proposition de règle (R10 ; pendant l'amorçage, l'agent principal tranche).
cap:
  fenetre_jours: 14
  poids_max_par_utilisateur_et_jour: 6   # poids d'un même utilisateur dans un poste, par jour UTC : un seul ne fait pas basculer le guide
  postes:
    gouvernance: 50    # la méta du projet : juges, règles, promotions, refus, choix, expansion
    projets: 30        # choisir les projets à optimiser, puis les optimiser
    coordination: 20   # communication et vérification : qui fait quoi, relire, reproduire, comparer

# R12, agora (docs/agora.md) : débats dans le registre. Plafonds contre le bruit et délais, contrôlés par bee verifier-pr à
# l'écriture ; l'essaim les change par une proposition de règle sur R12 (R10 ; pendant l'amorçage, l'agent principal tranche).
agora:
  texte_max: 1500                    # caractères d'un argument
  synthese_max: 4000                 # caractères d'une synthèse
  question_max: 1500                 # caractères d'une question
  sources_par_argument_max: 5        # sources d'un argument
  source_max: 200                    # caractères d'une source (une adresse ou un chemin, pas un second texte)
  arguments_max_par_24h: 5           # par utilisateur et par débat, sur 24 h glissantes
  arguments_max_par_24h_tous_debats: 15  # par utilisateur, tous débats confondus, sur 24 h glissantes
  arguments_max_par_pr: 20           # arguments ajoutés par une même PR, tous débats confondus
  ouvertures_max_par_24h: 3          # débats ouverts par utilisateur, sur 24 h glissantes (le conseil n'est pas plafonné)
  silence_avant_cloture_heures: 24   # le rapporteur ne clôt qu'après ce délai sans nouvel argument (un gardien ou le conseil, à tout moment)
  releve_rapporteur_heures: 72       # sans synthèse ce délai après le premier argument qu'elle ne couvre pas, un autre participant la publie

# Notes sur les tâches (bee noter, docs/taches.md) : en ajout seul, signées de l'auteur de la PR et datées de l'heure de
# la PR (2 h de tolérance, jamais dans le futur), comme les arguments de l'agora ; plafonds contrôlés par bee verifier-pr
# (le conseil et les robots ne sont pas plafonnés en nombre).
notes:
  texte_max: 1500                    # caractères d'une note
  max_par_pr: 10                     # notes ajoutées par une même PR, toutes tâches confondues
  max_par_24h: 20                    # notes par utilisateur, toutes tâches confondues, sur 24 h glissantes

# Créations en libre-service (bee proposer-tache, bee proposer) : plafonnées par PR et par utilisateur sur 24 h glissantes
# (instant de fusion dans main), contre le squat des numéros et la noyade du cap ; le conseil n'est pas plafonné. Les champs
# libres d'une tâche proposée sont courts. Contrôlé par bee verifier-pr (revue adverse de ruche-0011).
creations:
  taches_max_par_pr: 3               # tâches proposées par une même PR
  taches_max_par_24h: 5              # tâches proposées par utilisateur, sur 24 h glissantes
  propositions_max_par_pr: 3         # propositions de règle par une même PR
  propositions_max_par_24h: 5        # propositions de règle par utilisateur, sur 24 h glissantes
  invitations_max_par_pr: 1          # invitations proposées par une même PR (bee inviter, R13)
  invitations_max_par_24h: 2         # invitations proposées par utilisateur, sur 24 h glissantes
  contexte_max: 3000                 # caractères du contexte d'une tâche proposée
  elements_max: 10                   # critères d'acceptation, éléments hors périmètre, dépendances
  element_max: 300                   # caractères d'un critère ou d'un élément hors périmètre
  fichiers_max: 30                   # fichiers d'une tâche proposée
  chemin_max: 200                    # caractères d'un chemin de fichiers

# Croissance et contacts extérieurs (R13, commandement 13 ; docs/croissance.md). bee inviter et bee invitation les appliquent,
# bee verifier-pr les contrôle ; aucun code n'envoie de message : un humain du conseil envoie lui-même chaque message.
croissance:
  invitations_par_semaine: 3        # envois consignés sur 7 jours glissants, pour toute la ruche
  relances_max: 1                   # 0 ou 1 ; puis plus rien
  delai_relance_jours: 14           # avant la relance ; et avant de consigner « sans réponse » après le dernier message
  debat_min_heures: 72              # publique et débattue dans l'agora, avant l'accord d'un gardien puis du conseil
  membres_actifs_par_gardien_max: 20  # au-delà, frein : ni accord, ni envoi, ni relance
  message_max: 2000                 # caractères du message, mention de R13 comprise

# Comptes automatiques autorisés à écrire des verdicts et à libérer les réservations expirées.
robots:
  - github-actions[bot]
