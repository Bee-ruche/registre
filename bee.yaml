# Configuration générale du registre Bee.
# Modifiable uniquement par le conseil humain (voir docs/gouvernance.md). Chaque clé que bee lit est exigée, bien formée, et
# aucune autre n'est admise : bee valider refuse le registre sinon (ruche-0144 ; liste : REGLAGES dans outils/bee.py).

organization: Bee-ruche              # organisation GitHub qui héberge le registre et les forks (<projet>Bee)
phase: 1                         # voir la feuille de route dans README.md
bootstrap: true                   # dispositions d'amorçage actives jusqu'à la phase 3 (REGLES.md)

# Valeurs actuelles des règles chiffrées (REGLES.md). Une règle changée par vote
# est d'abord modifiée dans REGLES.md, puis reportée ici par le conseil.
reservation_max_hours: 72       # R7
retake_after_release_hours: 24  # R7 (proposition P-0002) : qui quitte une tâche sans contribution (libération, retrait,
                                 # expiration) ne la reprend pas, ni en parallèle, avant ce délai (répétition générale, T13)
reservations_max_per_user: 3   # R8
# R8 during the bootstrap (ruche-0096, REGLES.md; missing or malformed: the usual cap, and invalid). The agent principal may raise `max` by a
# council PR with its reason in docs/decisions.md; only the human council moves `jusqu_au` (UTC). Lowering `max` or moving `jusqu_au`
# earlier while a council member holds more than that allows makes the registry invalid: bring holdings down first.
r8_bootstrap: {max: 8, until: "2026-12-01T00:00:00Z"}
min_gain: 0.02               # R4
max_other_degradation: 0.01     # R5
reviews_required: 2           # R3 (cible ; plafonnée aux relecteurs éligibles pendant l'amorçage)
min_net_vote: 2                  # R3 : vote net pondéré minimal pour l'intégration automatique
acceptance_window_hours: 24   # R3 : délai d'ouverture avant intégration automatique (le temps que la ruche voie et vote)
guardian_review_required: if_judge_incomplete  # R3 : porte de relecture TEMPORAIRE — une relecture favorable d'un gardien ou du conseil est
                                 # exigée pour tout autre auteur, tant que le juge de la CI n'est pas sûr. Valeurs : true,
                                 # si_juge_incomplet (seulement si le juge isolé du fork n'a pas tout jugé), false
common_judge_min: 2               # R3 (ruche-0086, docs/juge-commun.md): with si_juge_incomplet, a verdict from an older common judge than tag <min>,
                                 # juge-v1 to juge-v3 then judge-v4 on (ruche-0148; any other label is none), or from none, is not entirely judged
                                 # (a guardian reviews). The council raises it once the new tag exists and
                                 # every fork is pinned to it. Missing or malformed (not an int from 1 to 9999): no verdict is complete,
                                 # and bee valider refuses the registry (ruche-0144).
vote_duration_days: 7              # R10
voter_quorum: 20               # R10
required_majority: 0.6667         # R10
min_account_age_days: 90  # docs/reputation.md
max_declared_gap: 0.05          # écart toléré entre mesures déclarées et mesures CI

# R11 : cap de la ruche — vers où diriger le travail. Un guide, pas une obligation (docs/cap.md) :
# bee cap compare ces parts à l'activité réelle et montre le poste le plus en retard. L'essaim le
# révise par une proposition de règle (R10 ; pendant l'amorçage, l'agent principal tranche).
balance:
  window_days: 14
  max_weight_per_user_per_day: 6   # poids d'un même utilisateur dans un poste, par jour UTC : un seul ne fait pas basculer le guide
  areas:
    governance: 50    # la méta du projet : juges, règles, promotions, refus, choix, expansion
    projects: 30        # choisir les projets à optimiser, puis les optimiser
    coordination: 20   # communication et vérification : qui fait quoi, relire, reproduire, comparer

# R12, agora (docs/agora.md) : débats dans le registre. Plafonds contre le bruit et délais, contrôlés par bee verifier-pr à
# l'écriture ; l'essaim les change par une proposition de règle sur R12 (R10 ; pendant l'amorçage, l'agent principal tranche).
agora:
  text_max: 1500                    # caractères d'un argument
  synthesis_max: 4000                 # caractères d'une synthèse
  question_max: 1500                 # caractères d'une question
  sources_per_argument_max: 5        # sources d'un argument
  source_max: 200                    # caractères d'une source (une adresse ou un chemin, pas un second texte)
  arguments_max_per_24h: 5           # par utilisateur et par débat, sur 24 h glissantes
  arguments_max_per_24h_all_debates: 15  # par utilisateur, tous débats confondus, sur 24 h glissantes
  arguments_max_per_pr: 20           # arguments ajoutés par une même PR, tous débats confondus
  openings_max_per_24h: 3          # débats ouverts par utilisateur, sur 24 h glissantes (le conseil n'est pas plafonné)
  silence_before_close_hours: 24   # le rapporteur ne clôt qu'après ce délai sans nouvel argument (un gardien ou le conseil, à tout moment)
  rapporteur_relief_hours: 72       # sans synthèse ce délai après le premier argument qu'elle ne couvre pas, un autre participant la publie

# Notes sur les tâches (bee noter, docs/taches.md) : en ajout seul, signées de l'auteur de la PR et datées de l'heure de
# la PR (2 h de tolérance, jamais dans le futur), comme les arguments de l'agora ; plafonds contrôlés par bee verifier-pr
# (le conseil et les robots ne sont pas plafonnés en nombre).
notes:
  text_max: 1500                    # caractères d'une note
  max_per_pr: 10                     # notes ajoutées par une même PR, toutes tâches confondues
  max_per_24h: 20                    # notes par utilisateur, toutes tâches confondues, sur 24 h glissantes

# Créations en libre-service (bee proposer-tache, bee proposer) : plafonnées par PR et par utilisateur sur 24 h glissantes
# (instant de fusion dans main), contre le squat des numéros et la noyade du cap ; le conseil n'est pas plafonné. Les champs
# libres d'une tâche proposée sont courts. Contrôlé par bee verifier-pr (revue adverse de ruche-0011).
creations:
  tasks_max_per_pr: 3               # tâches proposées par une même PR
  tasks_max_per_24h: 5              # tâches proposées par utilisateur, sur 24 h glissantes
  proposals_max_per_pr: 3         # propositions de règle par une même PR
  proposals_max_per_24h: 5        # propositions de règle par utilisateur, sur 24 h glissantes
  invitations_max_per_pr: 1          # invitations proposées par une même PR (bee inviter, R13)
  invitations_max_per_24h: 2         # invitations proposées par utilisateur, sur 24 h glissantes
  reports_max_per_pr: 1         # signalements de comptes liés par une même PR (bee signaler, ruche-0118)
  reports_max_per_24h: 2        # signalements par personne qui signale, sur 24 h glissantes
  reports_open_max: 2        # signalements ouverts (sans décision du conseil) par personne qui signale
  reports_naming_max: 3        # signalements ouverts nommant une même personne
  reports_at_cap_per_24h: 1 # au-delà, par personne nommée, sur 24 h glissantes : attendent le conseil (ruche-0137)
  context_max: 3000                 # caractères du contexte d'une tâche proposée
  items_max: 10                   # critères d'acceptation, éléments hors périmètre, dépendances
  item_max: 300                   # caractères d'un critère ou d'un élément hors périmètre
  files_max: 30                   # fichiers d'une tâche proposée
  path_max: 200                    # caractères d'un chemin de fichiers

# Croissance et contacts extérieurs (R13, commandement 13 ; docs/croissance.md). bee inviter et bee invitation les appliquent,
# bee verifier-pr les contrôle ; aucun code n'envoie de message : un humain du conseil envoie lui-même chaque message.
growth:
  invitations_per_week: 3        # messages (envois, relances) et places réservées par les feux verts, sur 7 jours glissants
  reminders_max: 1                   # 0 ou 1 ; puis plus rien
  reminder_delay_days: 14           # avant la relance ; et avant de consigner « sans réponse » après le dernier message
  debate_min_hours: 72              # publique et débattue dans l'agora, avant l'accord d'un gardien puis du conseil
  active_members_per_guardian_max: 20  # au-delà, frein : ni accord, ni relance (sauf pour un garant ou un gardien)
  message_max: 2000                 # caractères du message, mention de R13 comprise
  oversight_per_week_under_brake: 1  # frein serré : feux verts d'invitations de garant ou de gardien sur 7 jours glissants
  expiry_days: 14              # une invitation non décidée expire ; elle ne retient plus la personne
  active_member_days: 30          # membre actif (frein) : contribution soumise, mesure ou relecture (hors abstention) sur ces jours

# ruche-0104 (REGLES.md) : pseudos qu'aucune fiche membres/ ne prend, sans la casse : le conseil, les noms que l'outil et les
# workflows écrivent (par), les rôles, les comptes de la ruche. Un compte déclaré dans gouvernance/ n'est pas une fiche : il reste
# valable. Ajouter un nom qu'une fiche porte déjà rend le registre invalide (bee valider) : le conseil la renomme d'abord.
reserved_logins: [conseil, council, bee, github-actions, "github-actions[bot]", gardien, guardian, garant, guarantor, robot,
                   fondateur, founder, architecte, architect, optimiser, relire, mesurer, proposer, Bee-ruche, laruche-architect,
                   BeeRucheAgent, agent-architecte-bee]

# Comptes automatiques autorisés à écrire des verdicts et à libérer les réservations expirées.
robots:
  - github-actions[bot]
