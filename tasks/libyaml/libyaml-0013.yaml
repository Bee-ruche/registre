id: libyaml-0013
project: libyaml
category: parsing-serialization
type: test
size: M
title: "libyaml's isolated judge, step 1/6: verification harness and build script"
context: >
  Split of libyaml-0005 (an isolated judge for libyaml, about 800 lines outside tests in all), step 1 of 6;
  useful on its own: an isolated harness that can be run by hand, on which all the following steps rest.
  The registry's common judge (outils/juge/, docs/common-judge.md, tag juge-v1) runs the PR's C code in a
  container with no network, read-only, without privileges; the project gives it a harness
  (bee/juge/execution.c), a build script (bee/juge/construire.sh) and a plugin (bee/juge/projet.py,
  libyaml-0014). Models: the registry's toy project (outils/juge/jouet/bee/juge/: execution.c 137 lines,
  construire.sh 17) and minizBee (bee/juge/execution.c 510 lines, construire.sh 32). The bee_flux
  serializer of bee/fuzz/fuzz_parse.c (libyaml-0002, merged) already writes the strict event stream, errors
  and positions included; compiled with -DBEE_FLUX_SEUL, it defines only bee_flux: to be checked, then
  reused rather than copied. The verifier mode writes, for each input, the serialized stream and the status
  (ok or err). Until libyaml-0018, CI does not call bee/juge/: this step changes no verdict. It touches the
  judges: reviewed by a guardian or by the council.
files: [bee/juge/execution.c, bee/juge/construire.sh]
reach: 1.0
metric: null
acceptance_criteria:
  - "compiled in the sandbox on the base, two runs of execution verifier on the corpus write byte-for-byte identical outputs, and each file's status (ok or err) is the one in bee/tests/empreintes-reference.txt"
  - "construire.sh leaves one obj/<name>.o per file of src/*.c, with no name clash"
  - "no buffer is sized from the judged code alone"
out_of_scope:
