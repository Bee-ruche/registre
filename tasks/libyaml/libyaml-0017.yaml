id: libyaml-0017
project: libyaml
category: parsing-serialization
type: test
size: M
title: "libyaml's isolated judge, step 5/6: scenarios and measurements"
context: >
  Split of libyaml-0005 (an isolated judge for libyaml), step 5 of 6; useful on its own: an isolated bench, with
  the common judge's noise (about ±0.4%), that can be run by hand even before it is wired into CI. So far
  (libyaml-0013 to libyaml-0016) the plugin verifies without measuring (SCENARIOS empty). This step adds to
  the harness the modes analyse, chargement, emission and memoire, and to the plugin SCENARIOS,
  INSTRUCTIONS, METRIQUES and the methods repetition, instructions and scenario, with the metric ids of
  projects/libyaml.yaml (debit_analyse, debit_chargement, debit_emission, memoire_max_ko, and
  instructions_analyse, instructions_chargement, instructions_emission for R4). The common judge measures
  with wait4 in its own launcher, counts the instructions of the whole process and analyzes the objects
  (suspicious constructs). Models: the registry's toy plugin and minizBee's. Until libyaml-0018, CI does
  not call bee/juge/: this step changes no verdict. It touches the judges: reviewed by a guardian or by
  the council.
files: [bee/juge/execution.c, bee/juge/projet.py, bee/juge/test_juge.py]
reach: 0.8
metric: null
acceptance_criteria:
  - "the metrics carry the ids of projects/libyaml.yaml (debit_analyse, debit_chargement, debit_emission, memoire_max_ko, and instructions_* for R4)"
  - "on an honest PR, the instruction counts of A and B are identical and no suspicious construct is reported"
  - "meta-tests: fake timers, a Valgrind client request and a fake summary are flagged"
out_of_scope:
  - "libyaml's sources"
  - "the registry's outils/juge/"
  - "change to the tracked metrics"
  - "new dependency outside the image"
  - ".github/workflows/bee-ci.yml (wiring into CI is libyaml-0018)"
depends_on: [libyaml-0015, libyaml-0016]
node: projects/parsing-serialization/libyaml
status: open
