id: libyaml-0010
project: libyaml
category: parsing-serialization
type: optimization
size: M
title: "yaml_parser_update_buffer: an ASCII fast path in UTF-8 decoding"
context: >
  Callgrind profile of the base (parsing bench, first 128 KiB of each file): yaml_parser_update_buffer
  (src/reader.c) costs 16.6 % of the parsing instructions. It fills the buffer and decodes UTF-8
  byte by byte, with a validity check per character, even when the input is pure ASCII (the common
  case: keys, indentation, simple scalars). Lead: detect runs of bytes < 0x80 and copy/validate them
  in bulk, falling back to the general path at the first byte >= 0x80. The result must be STRICTLY
  identical: same event stream, same refusals on invalid input (malformed UTF-8 always rejected at
  the same place). bee/tests/lancer.sh and the fuzzing check it. Keep the general path as the
  fallback (R6, portability).
files: [src/reader.c]
reach: 1.0
metric: debit_analyse
acceptance_criteria:
  - "green CI (R2), x86-64 and ARM64; event stream unchanged (identical fingerprints)"
  - "gain >= 2 % on debit_analyse, beyond the noise (R4)"
  - "no other metric degraded by more than 1 % (R5)"
  - "invalid UTF-8 inputs are still rejected, at the same place (test cases in the manifest)"
out_of_scope: [output format, public API (yaml.h), new dependency, UTF-8 validation (same refusals)]
# No optimization of the parser before the fuzzing (libyaml-0002) and the isolated judge wired into CI (libyaml-0018), which R3 requires.
depends_on: [libyaml-0018, libyaml-0002]
status: open
created_by: council
created_on: "2026-10-27"
notes:
  - by: "bidji29"
    at: "2026-10-31T02:28:04Z"
    text: "Conseil, 31/10 : dépend désormais de libyaml-0018 (le juge isolé branché à la CI, dernière étape du découpage de libyaml-0005) au lieu de libyaml-0001 (oracle différentiel contre une référence indépendante) : R3 demande le juge isolé pour lever la porte de relecture, pas l'oracle différentiel. libyaml-0001 reste ouverte, en attendant que le conseil choisisse sa référence. La dépendance au fuzzing (libyaml-0002) ne change pas."
