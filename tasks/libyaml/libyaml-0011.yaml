id: libyaml-0011
project: libyaml
category: parsing-serialization
type: optimization
size: S
title: "yaml_parser_scan_plain_scalar: reduce the loop's per-character cost"
context: >
  Callgrind profile of the base: yaml_parser_scan_plain_scalar (src/scanner.c) costs 24.4% of the
  parsing instructions; it is the hottest function. It reads a plain scalar character by character,
  calling classification macros (IS_BLANK, IS_BREAK, CHECK, etc.) on every iteration and checking
  for the end of the buffer. Leads: hoist the repeated state reads out of the loop, group the
  end-of-line/blank tests, process non-special characters in small runs. No exploration has been
  done yet: only the share of the cost is demonstrated. The result must be strictly identical (event
  stream and refusals). Keep a generic path.
files: [src/scanner.c]
reach: 1.0
metric: parse_throughput
acceptance_criteria:
  - "green CI (R2), x86-64 and ARM64; event stream unchanged (identical fingerprints)"
  - "gain >= 2% on parse_throughput, beyond the noise (R4), or a failure documented with the measurements"
  - "no other metric degraded by more than 1% (R5)"
out_of_scope: [output format, public API, new dependency, behavior on invalid input]
# No optimization of the parser before the fuzzing (libyaml-0002) and the isolated judge wired into CI (libyaml-0018), which R3 requires.
depends_on: [libyaml-0018, libyaml-0002]
status: open
created_by: council
created_on: "2026-10-27"
notes:
  - by: "bidji29"
    at: "2026-10-31T02:28:04Z"
    text: "Conseil, 31/10 : dépend désormais de libyaml-0018 (le juge isolé branché à la CI, dernière étape du découpage de libyaml-0005) au lieu de libyaml-0001 (oracle différentiel contre une référence indépendante) : R3 demande le juge isolé pour lever la porte de relecture, pas l'oracle différentiel. libyaml-0001 reste ouverte, en attendant que le conseil choisisse sa référence. La dépendance au fuzzing (libyaml-0002) ne change pas."
