id: libyaml-0011
project: libyaml
category: parsing-serialization
type: optimization
size: S
title: "yaml_parser_scan_plain_scalar : réduire le coût par caractère de la boucle"
context: >
  Profil callgrind de la base : yaml_parser_scan_plain_scalar (src/scanner.c) coûte 24,4 % des
  instructions de l'analyse — c'est la fonction la plus chaude. Elle lit un scalaire « plain »
  caractère par caractère en appelant à chaque tour des macros de classification (IS_BLANK, IS_BREAK,
  CHECK, etc.) et en vérifiant la fin de tampon. Pistes : hisser les lectures d'état répétées hors de
  la boucle, regrouper les tests de fin de ligne/blanc, traiter les caractères non spéciaux par
  petites plages. Aucune exploration n'a encore été faite : seule la part du coût est démontrée. Le
  résultat doit être strictement identique (flux d'événements et refus). Garder un chemin générique.
files: [src/scanner.c]
reach: 1.0
metric: debit_analyse
acceptance_criteria:
  - "CI verte (R2), x86-64 et ARM64 ; flux d'événements inchangé (empreintes identiques)"
  - "gain >= 2 % sur debit_analyse, au-delà du bruit (R4), ou échec documenté avec les mesures"
  - "aucune autre métrique dégradée de plus de 1 % (R5)"
out_of_scope: [format de sortie, API publique, nouvelle dépendance, comportement sur entrée invalide]
# Pas d'optimisation du parseur avant le fuzzing (libyaml-0002) et le juge isolé branché à la CI (libyaml-0018), que demande R3.
depends_on: [libyaml-0018, libyaml-0002]
status: open
created_by: council
created_on: "2026-10-27"
notes:
  - by: "bidji29"
    at: "2026-10-31T02:28:04Z"
    text: "Conseil, 31/10 : dépend désormais de libyaml-0018 (le juge isolé branché à la CI, dernière étape du découpage de libyaml-0005) au lieu de libyaml-0001 (oracle différentiel contre une référence indépendante) : R3 demande le juge isolé pour lever la porte de relecture, pas l'oracle différentiel. libyaml-0001 reste ouverte, en attendant que le conseil choisisse sa référence. La dépendance au fuzzing (libyaml-0002) ne change pas."
