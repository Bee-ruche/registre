id: libyaml-0001
project: libyaml
category: parsing-serialization
type: test
size: L
title: "Differential oracle against an independent reference parser"
context: >
  The current oracle (bee/tests/oracle.c) checks DETERMINISM: a contribution's event stream is
  identical to the base's. It does not check that libyaml is right in absolute terms. A stronger
  oracle compares libyaml's event stream with that of an INDEPENDENT YAML parser (for example PyYAML
  through its C binding, or libfyaml), on a corpus of valid inputs: where they diverge on a
  well-formed input, it is a defect to report (the registry's security procedure if it is
  exploitable). Write bee/tests/differential_ref.* and add it to bee/tests/lancer.sh, tolerating
  documented differences of form (scalar styles, implicit tags) and comparing only the structure
  (key/value/sequence) and the errors. Follow docs/tooling.md: never self-service, current
  correctness preserved, meta-tests.
files: [bee/tests/lancer.sh]
reach: 1.0
metric: null
acceptance_criteria:
  - "green CI (R2) on the base and on this contribution, x86-64 and ARM64"
  - "the reference parser is justified in the manifest (compatible license, pinned provenance)"
  - "at least one known divergence is detected on a case built on purpose (demo in the manifest)"
  - "the tolerated differences of form are listed and justified; no corpus input regresses"
out_of_scope: [libyaml's sources, unjustified new dependency]
status: open
created_by: council
created_on: "2026-10-27"
notes:
  - by: "bidji29"
    at: "2026-10-31T02:28:04Z"
    text: "Conseil, 31/10 : la référence citée en exemple dans le contexte, PyYAML par sa liaison C, est libyaml lui-même (son chargeur rapide CLoader est construit sur libyaml) : comparer libyaml à elle ne prouve rien. Le choix de la référence (libfyaml, les sorties attendues de yaml-test-suite comme données, ou autre) attend une décision du conseil. libyaml-0010 et libyaml-0011 ne dépendent plus de cette tâche, mais de libyaml-0018 (le juge isolé branché à la CI)."
