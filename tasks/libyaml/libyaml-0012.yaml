id: libyaml-0012
project: libyaml
category: parsing-serialization
type: test
size: S
title: "Fuzzing: require real fuzzing and remove the fallback to the PR's harness"
context: >
  Adversarial review of libyaml-0002 on 30 Oct (libyamlBee PR #1, merged): two minor findings. (1)
  The fuzzing step succeeds on libFuzzer's exit code 0 alone: judged code that ended the process by
  itself would turn the step green without having fuzzed. Require, in bee/fuzz/lancer.sh (or in the
  step), a minimum number of executed units (stat::number_of_executed_units, whose value observed in
  600 s is about 740,000) and a duration close to the one requested. (2) The workflow falls back to
  the PR's harness when the base has none, with a mere notice: now that the base has one, make the
  step fail if base/bee/fuzz/lancer.sh is missing, instead of using the PR's. Meta-test: a variant of
  the code that exits by itself with 0 must turn the step red.
files: [bee/fuzz/lancer.sh, .github/workflows/bee-ci.yml]
reach: 1.0
metric: null
acceptance_criteria:
  - "an early exit with 0 of the judged code turns the fuzzing step red (meta-test documented in the PR)"
  - "with no harness in the base, the step fails instead of using the PR's"
  - "an honest PR keeps a green step"
out_of_scope: [libyaml's sources, A/B bench]
