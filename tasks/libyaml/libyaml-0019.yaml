title: 'English bee/ folder and root guides: README, AGENTS.md, CLAUDE.md and printed messages'
context: 'Founder''s decision of 31/10: the hive moves to English before the first outside bee. The place is La
  Ruche; the tool and the agents stay `bee`. The commandments become authoritative in English when the council records
  it in docs/decisions.md; any other text stays authoritative in French until the council records, when it merges
  the English version, that this version is authoritative. Start once the commandments decision is on main. Size:
  a translated line counts as one changed line. Translate what a bee reads or sees printed: bee/README.md, the root
  AGENTS.md and CLAUDE.md, and the messages the scripts print (Makefile help, sandbox, bench, ci, juge, tests, fuzz,
  commun). Code comments stay. The verdict JSON keys and values and the CONTRIBUTION.yaml keys stay as they are
  (ruche-0070). These paths are judge paths: R3 asks for a favorable review by a guardian, the council or a Confirmé.
  About ten open tasks edit the same files: land between them. Measure first: if the lines to translate exceed 400,
  release the task with a note proposing a split. No change to libyaml itself, nor to the judge being built (libyaml-0013
  to libyaml-0018), whose new code is written in English.'
