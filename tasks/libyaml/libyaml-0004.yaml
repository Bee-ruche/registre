id: libyaml-0004
project: libyaml
category: parsing-serialization
type: test
size: S
title: "Parser fuzzing: a YAML dictionary and targeted seeds"
context: >
  Review of libyaml-0002 (27 Oct, clang 18 + libFuzzer, sandbox): the differential harness does flag
  a seeded regression when given the input that triggers it, but 60 s of libFuzzer (about 25,000
  inputs) did not find on its own a simple regression in the escapes of quoted scalars (\0 rendered
  as '0' in src/scanner.c). Fuzzing starts from the generated corpus, with no dictionary: YAML's rare
  tokens (escapes \0 \x \u \U \N \_ \L \P, indicators %YAML %TAG ! !! & * ? | > ---  ..., BOM, tabs,
  CR and CRLF line endings) appear only by chance. Add a libFuzzer dictionary (bee/fuzz/yaml.dict,
  passed with -dict= in bee/fuzz/lancer.sh) and a few short seeds targeting these tokens, generated
  by lancer.sh (no versioned input files). The gcc fallback may ignore the dictionary.
files: [bee/fuzz/yaml.dict, bee/fuzz/lancer.sh]
reach: 1.0
metric: null
acceptance_criteria:
  - "green CI (R2); the fuzzing job runs 10 min with no new discrepancy on the base"
  - "three seeded regressions in the escapes and the indicators (including \\0 rendered as '0' in scanner.c), each found in less than 120 s of libFuzzer in at least 2 runs out of 3; figures before and after in the manifest"
  - "no faulty input or trace published (discreet mode unchanged)"
  - "the fuzzing throughput (inputs per second) does not drop by more than 10%"
out_of_scope: [libyaml's sources, bee/fuzz/fuzz_parse.c, serialization of the event stream]
depends_on: [libyaml-0002]
