title: "libyaml's isolated judge, step 6/6: wiring into CI and threat model"
context: >
  Split of libyaml-0005 (an isolated judge for libyaml), last step of 6; useful on its own: it is the step
  that allows R3's review gate to be lifted for libyaml (RULES.md, value if_judge_incomplete), which the
  plugin and the harness of libyaml-0013 to libyaml-0017 do not lift as long as CI does not call them.
  bee-ci.yml then calls the common judge (Bee-ruche/registre/.github/workflows/juge.yml) at a version
  pinned by tag or by SHA, as minizBee has done since its PR #16, and verdict.json carries the judge
  section that bee record-verdict reads. The optimizations libyaml-0010 and libyaml-0011 depend on this
  task. The gate really falls only once a real optimization has been judged end to end, as miniz-0013-c1
  was for miniz on 29 Oct. This step touches the fork's CI: adversarial review, and merge by the council
  or by the architect, never automatic.
files: [.github/workflows/bee-ci.yml, bee/README.md]
