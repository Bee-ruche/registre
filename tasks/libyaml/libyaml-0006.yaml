id: libyaml-0006
project: libyaml
category: parsing-serialization
type: test
size: M
title: "Aller-retour par l'API document (yaml_parser_load, yaml_emitter_dump) et réglages de l'émetteur"
context: >
  L'oracle d'aller-retour de libyaml-0003 (bee/tests/aller_retour.c) passe par l'API événements
  (yaml_emitter_emit) avec les réglages par défaut. Or la métrique debit_emission mesure
  yaml_emitter_dump d'un document chargé (bee/bench/banc.c, bee_passe_emission) : une optimisation
  de src/dumper.c seul, ou du chemin de chargement (src/loader.c), ne serait pas jugée par
  l'aller-retour. Étendre aller_retour.c (ou un second harnais) : (1) charger chaque document par
  yaml_parser_load, le ré-émettre par yaml_emitter_dump, ré-analyser et comparer le flux
  d'événements au flux d'origine, avec les mêmes normalisations N1 à N4 et, s'il en faut d'autres
  (ancres renommées par le dumper, par exemple), les ajouter une par une, justifiées par une règle de
  src/dumper.c ; (2) répéter l'aller-retour des deux API avec des réglages non par défaut de
  l'émetteur : canonique (yaml_emitter_set_canonical), unicode, largeur et indentation extrêmes,
  sauts de ligne CR et CRLF. Empreintes propres à chaque configuration, régénérées sur la base.
  Constats de l'agent de libyaml-0003 (manifeste de cette tâche) : le corpus ne déclenche aucune
  normalisation, les 22 cas intégrés à aller_retour.c le font.
files: [bee/tests/aller_retour.c, bee/tests/empreintes-aller-retour.txt, bee/tests/lancer.sh, bee/Makefile]
reach: 0.8
metric: null
acceptance_criteria:
  - "CI verte (R2), x86-64 et ARM64"
  - "l'aller-retour par yaml_emitter_dump est stable sur tout le corpus et les cas intégrés ; normalisations supplémentaires listées et justifiées"
  - "une mutation de src/dumper.c qui change la structure ré-analysée (par exemple ancres ou alias perdus) fait échouer le test"
  - "chaque réglage non par défaut a ses empreintes ; durée totale de bee/tests/lancer.sh inférieure à 30 s en CI"
out_of_scope: [sources de libyaml, corpus (bee/corpus/), oracle d'analyse (oracle.c)]
depends_on: [libyaml-0003]
