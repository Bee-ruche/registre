id: libyaml-0006
project: libyaml
category: parsing-serialization
type: test
size: M
title: "Round trip through the document API (yaml_parser_load, yaml_emitter_dump) and emitter settings"
context: >
  The round-trip oracle of libyaml-0003 (bee/tests/aller_retour.c) goes through the event API
  (yaml_emitter_emit) with the default settings. Yet the metric debit_emission measures
  yaml_emitter_dump of a loaded document (bee/bench/banc.c, bee_passe_emission): an optimization of
  src/dumper.c alone, or of the loading path (src/loader.c), would not be judged by the round trip.
  Extend aller_retour.c (or a second harness): (1) load each document with yaml_parser_load, re-emit
  it with yaml_emitter_dump, re-parse it and compare the event stream with the original stream, with
  the same normalizations N1 to N4 and, if others are needed (anchors renamed by the dumper, for
  example), add them one by one, each justified by a rule of src/dumper.c; (2) repeat the round trip
  of both APIs with non-default emitter settings: canonical (yaml_emitter_set_canonical), unicode,
  extreme width and indentation, CR and CRLF line breaks. Fingerprints specific to each
  configuration, regenerated on the base. Findings of libyaml-0003's agent (that task's manifest):
  the corpus triggers no normalization; the 22 cases built into aller_retour.c do.
files: [bee/tests/aller_retour.c, bee/tests/empreintes-aller-retour.txt, bee/tests/lancer.sh, bee/Makefile]
reach: 0.8
metric: null
acceptance_criteria:
  - "green CI (R2), x86-64 and ARM64"
  - "the round trip through yaml_emitter_dump is stable on the whole corpus and the built-in cases; additional normalizations listed and justified"
  - "a mutation of src/dumper.c that changes the re-parsed structure (for example lost anchors or aliases) makes the test fail"
  - "each non-default setting has its fingerprints; total duration of bee/tests/lancer.sh under 30 s in CI"
out_of_scope: [libyaml's sources, corpus (bee/corpus/), parsing oracle (oracle.c)]
