id: libyaml-0015
project: libyaml
category: parsing-serialization
type: test
size: M
title: "libyaml's isolated judge, step 3/6: randomly drawn inputs"
context: >
  Split of libyaml-0005 (an isolated judge for libyaml), step 3 of 6; useful on its own: the judge can no
  longer be passed by learning the corpus by heart. libyaml-0014's plugin compares the outputs only on the
  corpus: a variant that recognizes the corpus files (a table of precomputed answers) would pass there. The
  plugin's verification method therefore draws, from a seed, inputs that the base and the PR both parse:
  generated YAML documents, mutations of the corpus, invalid inputs. The first byte given to bee_flux
  (bee/fuzz/fuzz_parse.c, libyaml-0002) chooses the reading: 0 all at once, k > 0 in chunks of k bytes
  (the reader's buffer boundaries). Model: the verification method of minizBee's plugin
  (bee/juge/projet.py, entrees_aleatoires). Until libyaml-0018, CI does not call bee/juge/: this step
  changes no verdict. It touches the judges: reviewed by a guardian or by the council.
files: [bee/juge/projet.py, bee/juge/test_juge.py]
reach: 0.8
metric: null
acceptance_criteria:
  - "same seed, same inputs: generated documents (nesting, anchors and aliases, scalar styles, flow and block, directives, UTF-8 and UTF-16), mutations of the corpus, invalid inputs, and chunked reading through bee_flux's first byte"
  - "\"precomputed table\" meta-test: a variant that recognizes the corpus files is refused"
  - "on an invalid input, the base and the PR must return the same error at the same positions"
