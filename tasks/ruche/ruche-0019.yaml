title: "The guardian's gestures: correct a fact, give back a task held by an empty contribution"
context: >
  Dress rehearsal, round 2 (30 Oct), according to farid, the only guardian. (1) A guardian who
  validates a proposed task in which a fact is false (ruche-0016: "bee.py is 4,911 lines long",
  5,941 in reality) can only validate it with a note or set it aside; bee context always prints the
  false fact first, the note after. (2) A contribution submitted 90 s after the reservation, without
  any measurement, keeps the task in review: R3 protects it for up to 96 h, and no guardian can give
  it back. (3) An abusive note cannot be withdrawn (append only), and nothing allows reporting a
  member. Round 1 already noted a guardian "without leverage". To do: a validation "with correction"
  that bee context prints right after the corrected field; a guardian's gesture, reasoned and
  public, that closes a contribution with no verifiable content (neither a CI verdict nor a
  measurement) after a delay to be set, without penalty if the author explains themselves; a way to
  hide an abusive note without deleting it (it stays in the history, with the reason). Rule changes
  go through a proposal (R10).
files: [tools/bee.py, tools/test_bee.py, docs/guardians.md, RULES.md, schemas/task.schema.json]
reach: 0.7
