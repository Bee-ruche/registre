title: 'The hive''s tree: write the nodes of its areas (tool, check_pr, agora, site, common judge)'
context: 'ruche-0010 wrote the root and the levels of the roles, categories and projects of the tree of
  meaning; the registry''s node (tree/projects/ruche/ruche/MEANING.md) names its areas without describing
  them. Facts: tools/bee.py is 6,130 lines long, tools/test_bee.py 5,664 and tools/site_bee.py 912 (main
  1bef64a, 30 Oct); 9 of the hive''s 13 tasks from before the tree touch tools/bee.py (as do ruche-0017
  to ruche-0022, which came since), and two were changing it at the same time on the night of 30 Oct (ruche-0010
  and ruche-0011). An agent who arrives on a hive task has no way of knowing which parts of these files
  matter for it, which tests guard them, or which pitfalls have already proved costly (the strict form
  of the YAML files rewritten by the robots, self-service merged without a human, tests that depended
  on the real state of the registry). To do: one node per area under tree/projects/ruche/ruche/ (for example:
  loading and validating the registry; check_pr and self-service; engagements and races, R3 R7 R8 R11;
  the agora, R12; the tree; the site and the API; the common judge, outils/juge/), in the format of docs/tree.md
  (40 lines at most): why the area exists; what matters there (the functions and test classes that guard
  it, rules applied, pitfalls, past adversarial reviews); what can be ignored there. Then list the areas
  in the registry''s node and attach to them the open hive tasks that target an area (node field); ruche-0017
  to ruche-0022 carry node: projects/ruche, to be repointed; the areas to come include the invitations
  (R13, ruche-0020) and the capabilities (ruche-0021). Size guard (docs/tree.md, test test_delivered_paths_fit_in_a_short_budget,
  which reads the real registry): without the task, the path of a role and a project fits in 1,900 tokens,
  and, area included, that of each task still alive in 2,600; an area therefore stays short. The test
  is not changed in this task (commandment 3).

  '
