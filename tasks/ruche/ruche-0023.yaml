title: "Les états d'une branche dans bee : en germe, active, dormante, et les liens entre branches"
context: >
  Décision du 30/10 sur une idée du fondateur (commandement 13 complété, R13 « par branches »,
  docs/croissance.md) : la maturité se juge branche par branche ; une branche (projet, domaine) s'ouvre à
  tout moment, quelle que soit la maturité des autres, naît en germe (rien n'y est intégré
  automatiquement avant que son juge ait tenu), devient active, et dort après 30 jours sans activité
  (bee.yaml, croissance.branche_dormante_jours). Aujourd'hui, un projet n'a que les statuts actif, a_venir
  et archive (schemas/projet.schema.json), et son ouverture suit une phase globale (phase_ouverture :
  bzip2 et giflib à la phase 3) ; rien ne dit qu'une tâche ou un juge sert plusieurs branches. À
  construire : (1) un statut germe (et dormante) pour un projet, que bee valider accepte, avec les tâches
  d'amorçage permises en germe ; (2) bee verifier-acceptation et integration-auto n'intègrent jamais
  automatiquement une contribution d'un projet en germe ; (3) bee essaim, bee cap et le site montrent
  l'état de chaque branche, et la date de sa dernière activité (dormante au-delà du seuil) ; (4) un champ
  liens facultatif sur une tâche (d'autres projets ou tâches qu'elle sert), contrôlé (identifiants qui
  existent), montré par bee voir et bee contexte.
files: [tools/bee.py, tools/test_bee.py, schemas/, docs/new-project.md, docs/growth.md, tools/site_bee.py]
