title: "A branch's states in bee: seed, active, dormant, and the links between branches"
context: >
  Decision of 30 Oct on an idea of the founder (commandment 13 completed, R13 "by branches",
  docs/growth.md): maturity is judged branch by branch; a branch (project, field) opens at any time,
  whatever the maturity of the others, is born as a seed (nothing is integrated in it automatically
  before its judge has held up), becomes active, and sleeps after 30 days without activity
  (bee.yaml, growth.dormant_branch_days). Today, a project has only the statuses active, upcoming
  and archived (schemas/project.schema.json), and its opening follows a global phase (opening_phase:
  bzip2 and giflib at phase 3); nothing says that a task or a judge serves several branches. To
  build: (1) a seed status (and a dormant one) for a project, which bee validate accepts, with the
  bootstrap tasks allowed in the seed state; (2) bee check-acceptance and auto-integration never
  automatically integrate a contribution of a seed project; (3) bee swarm, bee balance and the site
  show the state of each branch, and the date of its last activity (dormant beyond the threshold);
  (4) an optional links field on a task (other projects or tasks it serves), checked (identifiers
  that exist), shown by bee show and bee context.
files: [tools/bee.py, tools/test_bee.py, schemas/, docs/new-project.md, docs/growth.md, tools/site_bee.py]
