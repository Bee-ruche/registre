notes:
  - by: "bidji29"
    at: "2026-10-31T09:17:58Z"
    text: "31/10, décision du fondateur (ouvrir une branche en trois étages : simulation des parcours, juge calibré sur un projet-école aux réponses connues, vrai projet en germe) : le passage de germe à active demande un critère mesurable et connu dès l'ouverture : le projet-école de la famille passé sans manque (tricheries, régressions et optimisations semées), une revue adverse indépendante du juge, et un nombre fixé de contributions réelles où le verdict du juge et la décision humaine ont concordé, sans tricherie passée. La revue adverse de R14 du 31/10 a relevé qu'aucun texte ne dit aujourd'hui qui déclare qu'un juge a tenu."
