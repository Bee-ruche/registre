title: "R13 trouvable et suivable : rôle pour inviter, dates, identifiant de site, incidents"
context: >
  Issue de la répétition générale n° 4 du 31/10 (détails remis au constructeur par l'architecte). À faire
  avant la première invitation envoyée. Un membre qui veut inviter, ou suivre une invitation, doit trouver R13
  sans connaître la ruche par cœur. À construire : (1) bee contexte connaît un rôle pour inviter ; (2)
  AGENTS.md renvoie à docs/croissance.md là où il parle d'inviter ; (3) bee voir I-nnnn donne les dates de
  l'invitation et son échéance ; (4) l'identifiant site: distingue une page personnelle d'un domaine partagé
  (une université n'est pas une seule personne) ; (5) un gardien a un geste pour signaler un incident (R13,
  frein).
  Décision du conseil (2 Nov 2026) : le point (4) devient la tâche ruche-0106 ; il ne tenait pas dans la taille S.
