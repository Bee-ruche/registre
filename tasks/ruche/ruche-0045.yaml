title: "bee check-acceptance: outputs that do not mislead"
context: >
  From dress rehearsal no. 4 of 31 Oct (details given to the builder by the architect). To do before
  the first outside participant. bee check-acceptance says whether a contribution is integrable, and
  agents, reviewers and the council read it as is. During the rehearsal, its outputs could mislead.
  To build: (1) when the fork's CI is green but the verdict is not integrable, the output says so
  plainly, with the reason; (2) the review threshold is written legibly (reviews required, obtained,
  missing); (3) the gap between declared gain and measured gain is flagged, with both values, as
  soon as it exceeds the threshold of docs/contributions.md.
