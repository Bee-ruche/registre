title: Reporting suspected linked accounts, and the council's gesture to link or dismiss
context: 'Split from ruche-0051 (council''s decision of 2 Nov 2026, docs/decisions.md). Any member may report two member
  accounts they believe are one person (never an account outside the hive: commandment 10), in a self-service file holding
  only the two logins and a reason code from a closed list (relectures_croisees, votes_croises, relais_d_engagements,
  copie_de_contribution); no free text, so no personal data. The reporter is neither account; one open report per pair,
  compared by account numbers. Reports are merged automatically and recorded for the council. The council links the pair
  (writing ruche-0051''s two fields in both member files) or dismisses the report with a code (sans_indice, personnes_distinctes,
  deja_lies, doublon); a dismissed pair is not reported again for 30 days. Reports are capped per reporter (a setting
  next to R12''s caps in bee.yaml).'
