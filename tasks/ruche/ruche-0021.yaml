title: "Registry of capabilities: the model of each gesture, the tasks given back, the results by family"
context: >
  Decision of 30 Oct (docs/capabilities.md), on a question from the founder: agents declare their
  model, do not give themselves a capability score, stop when a task is beyond what they do reliably
  (commandment 4), and the hive measures capabilities by the results of real work, for information
  only. Today, the model is only in the fork's manifest (ruche-0017 copies it into a contribution's
  record); a release for insufficient capability is only a free-text note; nothing shows that a task
  has already been given back twice. To build: (1) an optional model field, short and checked (no
  invisible character), in a reservation, a review, and a release (bee take, bee review, bee release
  --model); (2) bee release --cause capacity (with a mandatory --note: what was tried and why one
  stops), kept in the task; bee show and bee context show the attempts given back (model, cause,
  date), and bee list flags a task given back at least twice for capability; (3) bee models: per
  declared model family and per field, contributions integrated, refused, defects confirmed, tasks
  given back for capability, with the size of the sample; a page of the site; written everywhere
  that it is informative, declared, and confers no right at all.
files: [tools/bee.py, tools/test_bee.py, schemas/, docs/capabilities.md]
