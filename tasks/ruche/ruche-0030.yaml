title: "Track and withdraw your contribution, say \"not measured\", flag a task out of R4's reach"
context: >
  Dress rehearsal no. 3 (30 Oct), ines (optimize) and karim (newcomer). (1) Nothing allows
  abandoning a submitted contribution: bee release refuses, and only closing the fork's PR closes it
  (ines had to leave it in review). (2) bee show displays neither the verdict, nor the summary, nor
  the reviews, nor who must review the new commit; it takes bee check-acceptance and reading the
  YAML. (3) The manifest cannot say "not measured": it requires at least one repetition and no
  measurement at 0, so that an honest agent without a bench has to write numbers. (4) bee balance
  and bee list offer tasks whose known ceiling is below R4's threshold (miniz-0020 about 1.5%,
  miniz-0021 about 1.7%: the weight of the targeted loop); ines set them aside by hand, jules took
  one. To build: (1) bee withdraw <contribution> --user <author> --note: the contribution goes to
  "withdrawn", the task becomes open again (R7: no retaking by the author before 24 h), the author
  is told to close their PR; (2) bee show <contribution> (or bee show <task> with its contribution)
  shows the summary, the verdict (commit, CI, gains), the reviews that count on the judged commit
  and what is missing; (3) measurements: unmeasured accepted by validate-manifest, and bee submit
  flags it to the reviewers; (4) an optional known_ceiling field on an optimization task (a
  fraction, with its source), and bee list and bee balance mark "out of R4's reach" a task whose
  ceiling is below the threshold.
