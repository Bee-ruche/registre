  entry is dated between the push and the check: add one row each with such an entry. (2) Since ruche-0042, a vote on
  a contribution is closed by its folder and by its `sujet` alike; make the closure of a proposition''s vote the same
  (a vote file whose folder or `sujet` names a closed proposition is refused), and test both.'
