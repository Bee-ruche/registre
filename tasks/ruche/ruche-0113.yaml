title: 'Two pins left by reviews: clock order guards (ruche-0091) and proposition vote closure (ruche-0042)'
context: 'Follow-ups of two reviews, test-first. (1) ruche-0091 pinned every rule of the gate to its documented clock
  (TestClocksRuche0091), except three order guards: a note''s `precedent`, the order of parallel registrations, and the
