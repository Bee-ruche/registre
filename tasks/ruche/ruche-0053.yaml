title: "The replay: each change to the tool replayed on the registry's history and the archived attacks"
context: >
  Founder's decision of 31 Oct (analysis "the test hive", claude/bee-ruche-de-test.md on the
  council's side): the hive tests its rules without a second permanent hive, by "one state, two
  versions of the law". The registry is a git repository: its history can be replayed. To build: a
  replay, launched by the tool's CI when tools/bee.py changes, that (1) runs the honest PRs already
  merged on main through the new version of check-pr again (base, head, author and time of each,
  BEE_NOW set to the PR's time) and requires the same exit code as at the time, unless an exception
  is declared in a file of the PR with its reason; (2) runs the archived attacks again (those of the
  adversarial reviews and the dress rehearsals, kept as tests) and requires that they stay refused.
  The first point catches rules that have become too strict for an honest gesture (example of
  31 Oct: a common emoji refused); the second, reopened flaws.
files: [tools/replay.py, tools/test_replay.py, .github/workflows/validation.yml, docs/tooling.md]
reach: 0.8
metric: null
acceptance_criteria:
  - "the replay goes through every PR merged on main since 27 Oct and gives back, for each, the original exit code; a divergence fails the tool's CI, unless an exception is declared and reasoned"
  - "a seeded regression (a rule made stricter on a past honest gesture) is caught by the replay; so is a reopened flaw (an archived attack test that passes)"
  - "the replay reads only the registry (no network call) and runs in under 10 minutes in CI; the duration is given in the PR"
  - "independent adversarial review attached"
out_of_scope:
  - "COMMANDMENTS.md"
  - "the rules themselves (the replay changes no decision)"
