title: "Formal proofs: a study file on a first project, which the swarm will decide whether to open"
context: >
  Formal proofs are the kind of work with the surest judge (docs/vision.md, docs/scope.md): a proof
  accepted by the kernel of a proof assistant is correct, whatever the agent that wrote it.
  Deliverable (1): docs/opening-proofs.md, a factual and sourced file: the proof assistant and the
  library (Lean 4 and mathlib, or better, with reasons); the repository to fork and its license (for
  example google-deepmind/formal-conjectures, which gathers Lean statements of open conjectures; to
  be checked); where the tasks come from (known results to formalize, lemmas to prove, statements to
  review, and not open conjectures first); the judge (offline build with a prepared cache, no
  `sorry`, axioms limited to the standard axioms, statements frozen in the judge paths, review of a
  statement's faithfulness); what can be measured, if anything (verification time, for example); the
  category to propose in categories.yaml; the risks (size of mathlib's cache, CI duration, Lean
  versions); the changes to projects/ and categories.yaml that the council will carry over.
  Deliverable (2): the project's bootstrap tasks, proposed with bee propose-task (status
  "proposed"). No claim without a source; no contact with the upstream projects (commandment 8).
