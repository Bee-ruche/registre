  reviewer; text a rule or a commandment requires (the guarantors page, R13''s disclosure) is never listed; nothing
  is cut in this task (the attention test, docs/decisions.md, 01/11/2026)'
- no hype words, no exclamation marks; links between files still resolve; `bee valider` passes
