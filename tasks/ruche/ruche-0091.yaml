acceptance_criteria:
- 'test: a date written by bee at the time of the push passes even when the check runs hours later; a date later than
  the push by more than the existing tolerance is refused, whenever the check runs'
- the time comes from GitHub's record of the event, never from the PR's files, commits or text; a missing or malformed
  value fails closed in CI
- both workflows pass it; docs/gouvernance.md says what 'the time of the PR' means
- independent adversarial review attached; the full test suite passes
