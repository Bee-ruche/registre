title: 'Gate: declared dates are checked against the time of the push, not the time of the check'
context: 'Follow-up of ruche-0043''s review. bee verifier-pr checks every date a member declares (a reservation, a parallel
  registration, a submission, a note, a vote, a member file) against the moment the check runs, within 2 hours. In CI
  that moment comes after the full test suite (60 to 80 minutes) and, for the automatic merge, after the validation run:
  an honest PR is refused when the pipeline is late (council record PR #107, 1 Nov 2026), and a date can be declared
  later than the push by up to the CI delay. Give verifier-pr the time GitHub recorded for the push being checked (for
  example the creation time of the validation run that the push triggered: github.event.workflow_run.created_at in fusion-auto.yml,
  the run''s own creation time in validation.yml), never a time the author writes, and check declared dates against it.
  Run locally without it, bee keeps using the current time.'
