title: 'Invitations by waves: tens of people per wave, each wave measured before the next'
context: 'Founder''s decision of 1 Nov 2026: the hive opens by waves of invitations, once the protections of outside
  people are in place (ruche-0047 to ruche-0052), instead of one invitation at a time. Today R13 has the council send
  every invitation itself. Propose and tool a wave: a list of people (each with a guarantor or a public reason), the
  checks R13 asks for each, one decision of the council for the whole wave, the messages prepared and sent by a human
  of the council, and the measures that must hold before the next wave (regressions, refusals by the gate, guardians''
  load, CI queue). The rule change goes to the council; the founder merges it.


  Council''s note (2 Nov 2026, from ruche-0097''s design): the measures that must hold between waves include the write
  path''s, from `bee mesures-ecriture` (ruche-0134) once it lands; until then, the counts are taken by hand from the
  Actions logs.'
