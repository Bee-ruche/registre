title: "bee publier : titres et corps de PR contrôlés comme un texte sortant"
context: >
  Issue de la répétition générale n° 4 du 31/10 (détails remis au constructeur par l'architecte). À faire
  avant la première invitation envoyée. bee publier ouvre une PR sur GitHub : son titre et son corps sortent
  de la ruche, et peuvent notifier une personne ou renvoyer hors d'elle. Ils doivent passer le contrôle des
  textes libres sortants (texte_sortant_refuse) : aucune mention qui notifie une personne, aucun renvoi vers
  un dépôt hors de la ruche, aucune coordonnée (commandements 8 et 13).
