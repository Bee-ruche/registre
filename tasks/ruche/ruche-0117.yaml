title: 'Common judge before juge-v3: what the reviews of ruche-0037 and ruche-0038 left'
context: 'Follow-up of the adversarial reviews of ruche-0037 and ruche-0038 (details in the architect''s brief). To
  do before the council tags juge-v3: (1) the cap on suspicious constructs in juge.json keeps the most serious first
  and counts each kind, and each detail is shortened when built; (2) juge.yml publishes the code only after the report
  is checked, or a failed check forces a non-zero code; `rapport.py --verifier` also checks the code and the base and
  head against the PR''s; the docs say any non-zero exit blocks; (3) the inputs and the variant copy are created again
  just before each container, so no file time differs between phases, and the spy compares every time it can read; (4)
  a fixed metric that no scenario computes from its timed outputs is flagged in juge.json, and a fork cannot keep a verification-only
  ratio for a verdict; (5) the identity check counts comparable outputs per scenario, not per side; (6) the outputs folder
  of each container is its own size-limited tmpfs, so one side cannot fill the other''s.


  Council''s note (2 Nov 2026, from an adversarial review): (7) nothing the judge''s setup lets a container observe may
  depend on the run''s progress: its position in the order, the variant pass, the repetition, or whether it is verified
  or measured. Details in the architect''s brief. The builder estimates the size first; if it passes M, the council re-sizes
  or splits the task before work starts.'
