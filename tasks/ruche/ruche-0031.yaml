title: "R4 : le chronomètre ARM64 du juge commun compte comme mesure d'une autre configuration"
context: >
  Répétition générale n° 3 (30/10), constat du conseil : R4 exige, quand le chronomètre ne confirme pas un
  gain d'instructions au-delà du bruit, qu'une mesure d'une autre configuration voie le gain (bee
  enregistrer-mesure), mais personne n'est chargé de la faire, et un utilisateur ne mesure pas ses propres
  contributions (commandement 3). miniz-0017-c1 et miniz-0018-c1 attendent depuis le 28/10. ruche-0024
  ajoute au juge commun un chronomètre ARM64 (runner GitHub, même juge, même graine), publié dans
  juge.json par architecture. À construire : (1) bee enregistrer-verdict recopie le chronomètre de chaque
  architecture, borné et typé ; (2) R4 : pour un gain d'instructions au-dessus du seuil, la confirmation
  vient du chronomètre x86-64 ou de celui d'ARM64 au-delà du bruit, à condition qu'aucune des deux
  architectures ne recule au-delà du bruit (un recul est un refus) ; (3) avec ruche-0028, chaque verdict
  d'un même contenu doit confirmer, sur la même architecture ; (4) verifier-acceptation et le site disent
  quelle architecture a confirmé ; (5) REGLES.md (R4) et docs/evaluation.md le disent. Une mesure d'un
  autre utilisateur (bee enregistrer-mesure) reste une autre configuration, comme aujourd'hui.
files: [tools/bee.py, tools/test_bee.py, schemas/contribution-record.schema.json, RULES.md, docs/evaluation.md]
