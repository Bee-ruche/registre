title: "R4: the common judge's ARM64 stopwatch counts as a measurement from another configuration"
context: >
  Dress rehearsal no. 3 (30 Oct), the council's finding: R4 requires, when the stopwatch does not
  confirm a gain in instructions beyond the noise, that a measurement from another configuration see
  the gain (bee record-measurement), but nobody is in charge of making it, and a user does not
  measure their own contributions (commandment 3). miniz-0017-c1 and miniz-0018-c1 have been waiting
  since 28 Oct. ruche-0024 adds an ARM64 stopwatch to the common judge (a GitHub runner, same judge,
  same seed), published in juge.json per architecture. To build: (1) bee record-verdict copies the
  stopwatch of each architecture, bounded and typed; (2) R4: for a gain in instructions above the
  threshold, the confirmation comes from the x86-64 stopwatch or from the ARM64 one beyond the
  noise, provided that neither architecture regresses beyond the noise (a regression is a refusal);
  (3) with ruche-0028, each verdict of the same content must confirm, on the same architecture; (4)
  check-acceptance and the site say which architecture confirmed; (5) RULES.md (R4) and
  docs/evaluation.md say so. A measurement by another user (bee record-measurement) remains another
  configuration, as today.
files: [tools/bee.py, tools/test_bee.py, schemas/contribution-record.schema.json, RULES.md, docs/evaluation.md]
