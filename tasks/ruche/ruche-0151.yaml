acceptance_criteria:
- the design names every report a verdict reads, its producing job, how its identifier and digest travel, and what a reader
  does when they are missing or do not match (refuse, never fall back to a name)
- the follow-up tasks are proposed with sizes and dependencies, ordered after the switch to English names
- an independent adversarial review by an agent of another model is attached
