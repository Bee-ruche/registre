title: "La portée d'un privilège dans bee : un gardien ou un garant pour une branche seulement (R14)"
context: >
  Décision du 30/10 sur une idée du fondateur (R14, docs/branches.md) : un privilège (gardien, garant,
  relecteur Confirmé, droit d'agir hors de la ruche) s'exerce sur toute la ruche ou sur une branche (un
  nœud de l'arbre et ce qui est en dessous), et seulement sur ce qui relève entièrement de sa portée.
  Aujourd'hui, gouvernance/gardiens.yaml et gouvernance/garants.yaml ne connaissent que des pseudos : tout
  privilège vaut partout. À construire : (1) un champ portee facultatif (liste de nœuds de l'arbre ;
  absent = toute la ruche) pour un gardien et un garant, contrôlé par bee valider (nœuds existants) ;
  (2) bee compte un privilège seulement sur ce qui relève entièrement de sa portée : la porte de relecture
  et le refus qui bloque (R3), la validation et la correction des tâches proposées, la clôture et les
  doublons de l'agora, l'accord d'une invitation (R13, après ruche-0020) ; ce qui touche plusieurs branches
  demande un privilégié de chacune ou de toute la ruche ; (3) les juges et l'outillage communs (outils/,
  .github/, le juge commun) et les invitations à participer relèvent de toute la ruche ; (4) changer le
  nœud d'une tâche existante est refusé à verifier-pr, sauf au conseil et à un gardien de toute la ruche ;
  (5) bee essaim et le site montrent la portée de chaque privilégié.
files: [tools/bee.py, tools/test_bee.py, schemas/, governance/guardians.yaml, governance/guarantors.yaml, docs/guardians.md, docs/guarantors.md, docs/branches.md, tools/site_bee.py]
