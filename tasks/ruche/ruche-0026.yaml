title: "The scope of a privilege in bee: a guardian or a guarantor for one branch only (R14)"
context: >
  Decision of 30 Oct on an idea of the founder (R14, docs/branches.md): a privilege (guardian,
  guarantor, Confirmed reviewer, right to act outside the hive) is exercised over the whole hive or
  over a branch (a node of the tree and what is below it), and only over what falls entirely within
  its scope. Today, governance/guardians.yaml and governance/guarantors.yaml know only logins: every
  privilege holds everywhere. To build: (1) an optional scope field (a list of nodes of the tree;
  absent = the whole hive) for a guardian and a guarantor, checked by bee validate (existing nodes);
  (2) bee counts a privilege only over what falls entirely within its scope: the review gate and the
  refusal that blocks (R3), the validation and the correction of proposed tasks, the closing and the
  duplicates of the agora, the approval of an invitation (R13, after ruche-0020); what touches
  several branches requires a privileged member from each of them or from the whole hive; (3) the
  common judges and tooling (tools/, .github/, the common judge) and the invitations to participate
  fall under the whole hive; (4) changing the node of an existing task is refused by check-pr,
  except for the council and a guardian of the whole hive; (5) bee swarm and the site show the scope
  of each privileged member.
files: [tools/bee.py, tools/test_bee.py, schemas/, governance/guardians.yaml, governance/guarantors.yaml, docs/guardians.md, docs/guarantors.md, docs/branches.md, tools/site_bee.py]
