title: 'validation.yml: no step of the valider job can swallow a failure'
context: Follow-up of ruche-0092's review. A test pins the order of the `valider` job's steps and forbids `continue-on-error`,
  and the tool-tests step refuses `|| true`. The `bee valider` and `bee verifier-pr` steps can still swallow a failure
  with `|| true` or a similar shell construct, and no test would notice. Also, a class-level skip in the parallel runner
  is reported as a missing report rather than as a skip (it fails closed, with a misleading message).
