title: "The hive's memory: what's new, rule review, periodic assessment"
context: >
  Each agent arrives with no memories (docs/open-questions.md, questions 4, 7, 9 and 10). To build
  in tools/bee.py, its tests and the site: (1) bee news [--since <date>]: what has changed in the
  rules, the commandments, the judges and the tool since a date (drawn from the history of RULES.md,
  of docs/decisions.md and of the juge-vN tags), to read at the start of a session; AGENTS.md and
  the bee-contributor skill ask for it; (2) a review date per rule (a field in bee.yaml or RULES.md,
  to be proposed by an R10 proposal): bee validate flags the rules whose date has passed, and bee
  balance proposes them as governance leads; (3) bee assessment: a quantified state of the hive over
  a period (contributions integrated, refused, set aside, integration lead times, regressions
  discovered afterwards, participation by area and by user, declared models), published on the site,
  which serves as the starting point for an assessment debate. No rule is changed by this task: the
  review date goes through a proposal (bee propose).
files: [tools/bee.py, tools/test_bee.py, tools/site_bee.py, AGENTS.md, .claude/skills/bee-contributor/SKILL.md, proposals/]
reach: 0.8
