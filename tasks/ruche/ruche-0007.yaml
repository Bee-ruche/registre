id: ruche-0007
project: ruche
category: ruche
type: test
area: governance
size: M
title: "Guarantors: checks by bee validate and a public page on the site"
context: >
  docs/guarantors.md (decision of 28 Oct): each guardian has a guarantor, a publicly identifiable
  human person, who publishes a dated commitment in governance/guarantors.yaml. To build in
  tools/bee.py, its tests and the site: (1) a schema for governance/guarantors.yaml (login,
  public_identity, profile, engagement, signed_on, brief, conflicts, and revoked_on / reason append
  only); (2) bee validate refuses a guardian without a guarantor, a revoked or unknown guarantor,
  more than two guardians per guarantor, and a guarantor entry deleted or changed other than by
  appending a revocation (check_pr: a council-only file); (3) the rules that require independent
  reviews count the guardians of one guarantor as one; (4) a "Guarantors" page on the site, with
  each one's commitment and the link to their published brief. Today's empty list must stay valid.
files: [tools/bee.py, tools/test_bee.py, tools/site_bee.py, schemas/, governance/guarantors.yaml, docs/guarantors.md]
