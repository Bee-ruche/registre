title: "Garants : contrôle par bee valider et page publique du site"
context: >
  docs/garants.md (décision du 28/10) : chaque gardien a un garant, personne humaine identifiable
  publiquement, qui publie un engagement daté dans gouvernance/garants.yaml. À construire dans
  outils/bee.py, ses tests et le site : (1) un schéma pour gouvernance/garants.yaml (pseudo,
  identite_publique, profil, engagement, signe_le, consignes, conflits, et revoque_le / motif en ajout
  seul) ; (2) bee valider refuse un gardien sans garant, un garant révoqué ou inconnu, plus de deux
  gardiens par garant, et une entrée de garant supprimée ou modifiée autrement que par l'ajout d'une
  révocation (verifier_pr : fichier réservé au conseil) ; (3) les règles qui exigent des relectures
  indépendantes comptent les gardiens d'un même garant pour un seul ; (4) une page « Garants » sur le
  site, avec l'engagement de chacun et le lien vers ses consignes publiées. La liste vide d'aujourd'hui
  doit rester valide.
files: [outils/bee.py, outils/test_bee.py, outils/site_bee.py, schemas/, gouvernance/garants.yaml, docs/garants.md]
