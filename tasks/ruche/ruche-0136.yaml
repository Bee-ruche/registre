title: 'Common judge after juge-v3: machine failures, where seeds came from, a mount depth per folder'
context: Follow-up of the reviews of ruche-0117 (details in the architect's brief). Three things the common judge
  should state or hold on its own. A failure of the machine that runs the judge (the container engine or its runtime)
  is an error of the environment, never a refusal of the judged code. The report (juge.json) says whether each seed was
  drawn by the judge or given on its command line for a local reproduction. Each folder the judge mounts into a
  container sits at a depth of its own. Ships under the next version of the common judge, which the council tags.
