title: 'Judge capacity: measure what one judgment costs and how many fit in a night'
context: 'Founder''s goal (1 Nov 2026): thousands of bees within weeks, so up to a thousand judgments a night. Every
  contribution to a fork runs the common judge on GitHub''s runners, sharing the organisation''s concurrent jobs with
  the registry''s CI (20 on the free plan, 60 on Team, 500 on Enterprise). Measure, from real runs on minizBee and libyamlBee:
  the jobs and minutes per judgment, the time a judgment waits in the queue, what the registry''s own workflows take;
  then compute how many judgments fit in a night at 20, 60 and 500 jobs, and what would raise the ceiling (fewer repetitions
  where noise allows, splitting x86 and ARM, caching builds, larger runners).'
