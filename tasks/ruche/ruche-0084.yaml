title: 'Rules version, part 1: a version computed from the rules, stamped on every grant by the gate'
context: 'Adapted from DeepSeek''s dsh-superagent prototype (https://github.com/deepseek-ai/dsh-superagent-prototype,
  MIT): docs/002-authorization.md ("Policy version", "Revalidation before resume") and docs/001-domain.md (a rules change
  is delivered rather than cancelling running work, which would leave it half-finished). The source notifies live holders
  and revalidates on resume; La Ruche is stricter, because its contributors are not one trusted team. A reservation (`bee
  prendre`), a parallel enrolment, a promotion and an appointed privilege (ruche-0081''s entries, which the council writes
  by hand) are granted under the rules of the day; nothing records which. Part 1: define the rules version as a content
  hash over the values that decide grants, named in bee.yaml (so a typo or a translation does not change it; ruche-0058
  and ruche-0070 rename files and keys: the list follows them), and have the gate require it on every new grant, computed
  from the pull request''s base, never trusted from the pull request. Part 2 (ruche-0085) refuses acts under grants that
  no longer hold. R3 already binds a verdict to the commit it judged: this extends the idea to grants. Rebase on ruche-0082
  and ruche-0026 if they are integrated first. If the work outgrows L, stop and propose a split (commandment 4).'
