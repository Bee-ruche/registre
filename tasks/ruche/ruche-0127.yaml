title: One queued push step shared by every robot that writes main; passes keep replace semantics
context: 'Write path at scale, step 1, task E5b (docs/architecture.md, section 4, step 1; ruche-0097, decided by the
  council on 2 Nov 2026). Every robot pass (fusion, verdicts, integration, expirations) keeps the default semantics of
