- 'a test: for a member, RULES.md, REGLES.md, COMMANDMENTS.md, COMMANDEMENTS.md, AGENTS.fr.md, CLAUDE.md and bee.yaml
  are all governance (refused), and CHEMINS_OUTILLAGE is unchanged'
- a warning, never an error (the robots run `bee valider` before they push), flags REGLES.md when RULES.md has changed
  since the commit its header names
- 'every rule value unchanged (bee.yaml diff: comments only); the full test suite passes'
- on merge, the council records in docs/decisions.md that these files are now authoritative in English
