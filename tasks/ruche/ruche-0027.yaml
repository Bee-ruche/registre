id: ruche-0027
project: ruche
category: ruche
type: test
area: governance
size: M
title: "A branch's local rules in bee: derogations written, printed, applied (R14)"
context: >
  Decision of 30 Oct on an idea of the founder (R14, docs/branches.md): a branch may specify,
  replace or set aside a rule of the branch above, for what falls entirely within it, never the base
  (the commandments, R2, the integrity of verdicts and judges of R3, R7, R8, R10 and the levels,
  R12, R13, R14 and R15, added to the base on 31 Oct), through a derogation that asks more than an
  ordinary rule (14 days in the agora before the whole hive, 3/4 of the branch's votes without
  opposition from the majority of the hive, the agreement of a guardian of the whole hive and of the
  council, a review date at most six months later). The details wait for debate D-0023: start only
  after it closes, following its outcome. To build: (1) a derogation format (a rule proposal with
  the branch, the rule set aside, the replacement, the review date) that bee validate checks, the
  base refused; (2) bee tally applies R14's thresholds; (3) the adopted derogation is written in its
  branch's node and bee context prints it on the path; it lapses on its review date; (4) at least
  one rule is read per branch in bee (for example R4's threshold, min_gain, for a branch without a
  throughput metric), the strictest version applying to a contribution that touches several
  branches.
files: [tools/bee.py, tools/test_bee.py, schemas/, docs/branches.md, docs/tree.md]
reach: 0.6
metric: null
acceptance_criteria:
  - "test: a derogation from the base is refused by bee validate, whatever its form"
  - "test: an adopted derogation is printed in bee context for a task of its branch, and only there"
  - "test: a lapsed derogation no longer applies; a contribution on two branches follows the strictest rule"
  - "independent adversarial review attached"
out_of_scope: [COMMANDMENTS.md, an actual derogation (it goes through the agora and the council)]
