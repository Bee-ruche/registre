title: 'Tests: a small fixed registry instead of a copy of the live one'
context: 'Measured on 1 Nov 2026: every test copies the live registry, and every bee command a test runs loads and validates
  every task, contribution and debate in it (about 1.7 s with 146 tasks). The suite runs bee hundreds of times, so it
  gets slower with every task the hive adds: 30 to 45 minutes on 31 Oct, 80 minutes on 1 Nov on the same machine, with
  7% more tests. Give the tests a small fixed registry: the real rules, schemas, bee.yaml, projects, tree and governance
  files, plus only the tasks, contributions and other data the tests name (written in the tests or kept in one fixture
  folder). Keep one test that validates the real registry as it is. Tests that read real workflow files or docs keep
  reading them from the repository.'
