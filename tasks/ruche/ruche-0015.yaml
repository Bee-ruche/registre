title: 'libyaml''s tree: write the nodes of its areas (reading, scanner, parser, loader, emitter)'
context: 'ruche-0010 wrote the root and the levels of the roles, categories and projects of the tree of
  meaning; libyaml''s node (tree/projects/parsing-serialization/libyaml/MEANING.md) names its areas without
  describing them. Facts: of the 9 libyaml tasks, 7 build the fork''s tooling (oracle, round trip, fuzzing,
  isolated judge) and 2 target the code, both blocked by the tooling: libyaml-0010 (src/reader.c, yaml_parser_update_buffer,
  UTF-8 decoding) and libyaml-0011 (src/scanner.c, yaml_parser_scan_plain_scalar). The fork''s bee/README.md
  (l. 60) notes that parsing is CPU-bound: a drop in instructions shows on the stopwatch (miniz''s node
  says the opposite for its decompression, which is memory-bound). To do: one node per area under tree/projects/parsing-serialization/libyaml/
  (reading and decoding, scanner, parser, loader, emitter), in the format of docs/tree.md (40 lines at
  most): why the area exists; what matters there (hot functions and their share of the instructions according
  to a callgrind profile of the bench, cited with its command (the fork has no profiler like minizBee''s
  bee/bench/profil.py; libyaml-0010 and libyaml-0011 cite 16.6% and 24.4%), what the oracle checks in
  this area, states and invariants that the optimizations touch, known pitfalls); what can be ignored
  there. Then list the areas in libyaml''s node and attach the open libyaml tasks to them (node field);
  src/writer.c and src/dumper.c go with the emitter. Size guard (docs/tree.md, test test_delivered_paths_fit_in_a_short_budget,
  which reads the real registry): without the task, the path of a role and a project fits in 1,900 tokens,
  and, area included, that of each task still alive in 2,600; an area therefore stays short. The test
  is not changed in this task (commandment 3).

  '
