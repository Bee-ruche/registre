title: 'Agent accounts: a declared agent account acts as its person, never as the council'
context: 'Since 1 Nov 2026 the agent principal works under its own GitHub account, laruche-architect, created by the
  founder (bidji29), instead of the founder''s account; the tool could not tell a council decision from a gesture of
  its agent (decision 5 of the organisation; first point of R14''s adversarial review, noted on ruche-0027). The gate
  ties every self-service PR to its author''s login (verifier_pr, fusion-auto.yml, integration-auto.yml), so a reservation
  or a submission for the founder''s work, opened from the new account, is refused. Add declared agent accounts: a council-only
  file lists each agent account and the person it acts for. An agent account counts as that person everywhere a person
  is counted (R8 and the other caps, commandment 3''s independence, R4''s exclusion, conflicts of interest, votes, reviews):
  it never adds weight, never makes a second person. It is never the council or a guardian, even when its person is:
  council-only paths still need a PR by a council member. Declare laruche-architect for bidji29. Must be merged before
  the next night of the bees (Friday 6 Nov 2026). The founder merges it: it changes what the agent principal''s account
  can do.'
