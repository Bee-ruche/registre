acceptance_criteria:
- a self-service PR opened by a declared agent account is checked exactly as if its person had opened it; tested for
  a reservation, a submission and a vote
- 'an agent account is never counted as a second person: same caps, same independence, same exclusions as its person;
  tested'
- an agent account of a council member gets no council path and no council exemption (code 3 where a council member's
  PR would pass); tested
- the file is council-only; an agent account that is also a member, a guardian, a guarantor, a council member or another
  account's agent is refused by bee valider; case variants follow the existing pseudo rules
- integration-auto accepts the PR of a contribution opened by its author's declared agent account, and nothing else
- independent adversarial review attached; the full test suite passes; the founder merges
