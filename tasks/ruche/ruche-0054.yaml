title: "The shadow: a proposed rule runs beside the one in force, on real activity"
context: >
  Founder's decision of 31 Oct ("one state, two versions of the law"): before being adopted, a
  proposed rule (R10) that changes the tool runs "in the shadow" on real activity for a set
  duration; what it would have decided differently from the rule in force is published. The evidence
  comes from the real flow, not from simulated characters. Known limit: participants adapt to the
  rules, and the shadow sees only behaviors shaped by the old one; the dress rehearsals remain for
  strategies. To build: a proposal can name a branch of the candidate tool; a workflow runs it
  beside main's tool on each PR of the registry, without ever deciding, and records the differences
  in a report linked to the proposal; the tally (R10) shows this report. Not to be started until the
  gate has been hardened (ruche-0039, ruche-0040): the candidate tool is unadopted code, it runs
  without a write token and its result is never read as a decision.
files: [tools/bee.py, tools/test_bee.py, .github/workflows/, docs/governance.md]
reach: 0.7
metric: null
acceptance_criteria:
  - "a proposal that names a candidate tool gets, for each PR during its duration, the decision of the tool in force and that of the candidate, side by side, in a public report"
  - "the candidate has no write token and cannot change any decision; a candidate that crashes or loops does not stop the real CI"
  - "the proposal's tally shows the number of differing decisions and examples"
  - "independent adversarial review attached"
