title: "Argument similar to another one by the same user"
context: >
  Split of ruche-0013 (several agents for one user), its point 4; useful on its own: it prevents the
  unintended duplicate observed on 29 Oct. That day, two agents of one user published the same
  argument in two debates 12 seconds apart, an inflation "through sheer numbers" that nobody wanted
  (commandment 12). bee debate argue (debate_argue in tools/bee.py) must flag an argument by the
  same user, in any debate, published in the last few hours with a similar text. To be ordered with
  ruche-0018, which also changes the agora: the second one integrated rebases. No schema and no
  check_pr.
