title: 'Common judge: a second timer on ARM64, its findings and its report checked against the x86 leg'
context: 'Split from ruche-0024 by the council''s decision of 2 Nov 2026, after its independent adversarial review (details
  in the architect''s brief). R4 asks for the measurement of another configuration when the timer does not confirm an
  instruction gain beyond the noise, and nobody is charged with it. The common judge can measure on another configuration
  itself: a second judging job on a GitHub ARM64 runner (ubuntu-24.04-arm), same judge, same seed, publishing its own
  timer (gain, beyond the noise) in juge.json under a key per architecture; instructions stay those of x86-64 (Cachegrind).
  Design it so that: the final code still comes only from the judging steps'' own outputs, each leg''s report is checked
  against what its own job exported and against the other leg (same seed, source, plugin, common judge, image), and anything
  missing or inconsistent fails closed; every finding of either leg reaches the final report, and an ARM report the judge
  could not analyse is marked so that ruche-0031 never uses it without a guardian; one written policy for an ARM leg
  that fails or never starts (bounded in time; never counted as a confirmed gain, never blocking the x86 verdict on its
  own). What the registry does with the ARM timer is ruche-0031.'
