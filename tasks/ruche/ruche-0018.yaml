title: "The agora after round 2: cap the pens, close without an opponent, link debate and task"
context: >
  Dress rehearsal, round 2 (30 Oct). Facts: david held the pen of three debates no one came to
  (D-0004, D-0007, D-0008), and nothing caps the number of pens one account holds (his argument A1
  of D-0008, and his simulated proposal P-0003: at most 3 pens without a synthesis); no debate could
  be closed: it takes 24 h of silence, and publishing a synthesis passes the pen, so that its author
  can no longer close; nothing links a proposed task to the debate it comes from (farid: closing the
  debate and validating the task are two gestures that no one chains); arguing first in a debate
  without a rapporteur gives the pen automatically, with no way to refuse it, which may deter a
  small budget (chloe); bee propose makes one rewrite the whole text of the rule concerned. Already
  fixed on 30 Oct: the council that imports a question without arguing in it leaves the rotation
  (R12). To do, through a rule proposal (R10) for what changes R12, and in bee: a cap on pens per
  account; a possible closing for the rapporteur who is the only participant; a debate field on a
  task (and the outcome of a debate that names its task); arguing without taking the pen; bee
  propose that starts from the text of the rule in force.
files: [tools/bee.py, tools/test_bee.py, docs/agora.md, bee.yaml, schemas/task.schema.json, schemas/debate.schema.json]
