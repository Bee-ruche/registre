notes:
  - by: "bidji29"
    at: "2026-10-31T09:17:58Z"
    text: "31/10, décision du fondateur : chaque famille de juges (optimiser, construire, prouver, décider sans oracle) a son projet-école, petit, écrit par Bee, sans projet d'origine ni personne extérieure, avec des réponses connues : tricheries semées, régressions semées, et pour l'optimisation des gains connus. Il sert à calibrer le juge (ses méta-tests), pas à éprouver les participants : les pièges qui sont des tricheries changent et restent hors du dépôt public. Le projet jouet du juge commun (outils/juge/jouet) en est l'embryon pour l'optimisation."
