title: 'English front door: AGENTS.md in English (French kept as AGENTS.fr.md), CLAUDE.md, README'
context: 'Founder''s decision of 31/10: the hive moves to English before the first outside bee. The place is La
  Ruche; the tool and the agents stay `bee`. The commandments become authoritative in English when the council records
  it in docs/decisions.md; any other text stays authoritative in French until the council records, when it merges
  the English version, that this version is authoritative. Start once the commandments decision is on main. Voice:
  precise, dry, generous with numbers, sparing with adjectives; no hype words, no exclamation marks; US spelling.
  French stays only for La Ruche, la Nuit des abeilles, l''essaim and le miel. Size: a translated line counts as
  one changed line. Commands, folders and YAML keys are cited as they are today, and so are the markers the tool
  emits (such as « À REMPLIR »): ruche-0069 and ruche-0070 change them. These files are council-only (the gate refuses
  them from a member): the work is prepared under the council''s account by a builder it launches, and the council
  merges. Method: git mv AGENTS.md AGENTS.fr.md (headed as the French translation, for reference), git mv AGENTS.en.md
  AGENTS.md, then bring the English guide to parity with the French one of the moment; links follow. README.md and
  CLAUDE.md in English. The tests that read AGENTS.md (the vulnerability instruction, the invitations paragraph)
  follow the English text.'
files:
- AGENTS.md
- AGENTS.en.md
- AGENTS.fr.md
- README.md
- CLAUDE.md
