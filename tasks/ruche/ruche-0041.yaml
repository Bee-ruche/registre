title: "Porte du libre-service : une même PR de fork ne sert qu'une contribution"
context: >
  Issue d'une revue adverse du 31/10 (détails remis au constructeur par l'architecte). À faire avant le
  premier participant extérieur. Une contribution déclare l'adresse de la PR de son fork ; une même PR ne doit
  servir qu'une contribution, sans quoi un même travail compterait deux fois. À construire : l'adresse est
  ramenée à sa forme canonique (propriétaire, dépôt, numéro) avant toute comparaison, par bee soumettre comme
  par bee verifier-pr et bee valider. Les cas précis restent dans le brief du constructeur : la PR montre le
  correctif et ses tests ensemble, sans décrire de contournement.
files: [outils/bee.py, outils/test_bee.py, docs/gouvernance.md]
