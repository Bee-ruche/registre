title: 'CI: the tool''s test suite runs in parallel jobs, and none is lost'
context: 'validation.yml runs the whole test suite in one job, one test after another (47 to 80 minutes on 1 Nov 2026).
  GitHub runs several jobs at once for free on public repositories. Split the suite into parallel jobs (a fixed number,
  set in one place), then one final job that checks the registry and the PR and that keeps the name of today''s check,
  so that a rule requiring it keeps working. The split must never drop a test silently: the union of the jobs'' test
  lists is checked against the full list, and a job that runs no test fails.'
