acceptance_criteria:
- every test runs in exactly one job; a missing or duplicated test fails the check (tested with a test added after the
  split is computed)
- the final check keeps its current name and runs bee valider and bee verifier-pr once, after all test jobs pass; any
  failed job fails it
- the duration before and after, from real CI runs, in the PR
- independent adversarial review attached (this is a workflow of the gate)
