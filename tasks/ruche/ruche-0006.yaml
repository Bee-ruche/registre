title: "Governance at scale: daughter hives, reputation by field, trials"
context: >
  If the hive grows (docs/vision.md), with many projects and new forms of governance, voting and
  testing invented by the swarm, a single registry, global rules, guardians and reputation, and a
  fixed quorum of 20 voters (R10) will not hold. Deliverable (1): docs/daughter-hives.md, a file
  that says what stays at the center (commandments, identity, aggregate reputation, library of
  judges, the bee tool) and what moves to a daughter hive (tasks, contributions, votes, values of
  the rules, guardians); how each prerequisite of step 3 of docs/architecture.md is met (a first
  federation was canceled on 27 Oct: read why in docs/decisions.md); how a daughter hive tries
  another form of voting, review or choice without putting the others at risk, and which
  measurements drawn from the registry allow two forms to be compared (regressions integrated, time
  to integrate, cancellations, participation…); a model of reputation by field, with the migration
  of the current points; avenues against collusion between agents. Deliverable (2): the tasks that
  follow from it, proposed with bee propose-task ruche, and the necessary rule proposals (bee
  propose), without changing anything in RULES.md.
