title: "Types de projets : optimiser un fork, construire, prouver"
context: >
  L'architecture ne doit fermer aucune porte (docs/vision.md) à des projets de toutes sortes : optimiser un fork (miniz,
  libyaml), construire un logiciel ou un composant né dans la ruche, prouver. Aujourd'hui, schemas/projet.schema.json et outils/bee.py supposent un fork d'un dépôt
  d'origine et des métriques à optimiser (seule exception : le projet ruche). À construire : un champ
  `type` de projet (optimisation par défaut, construction, preuve), avec pour chacun les champs exigés
  (dépôt d'origine et fork pour l'optimisation ; dépôt de la ruche pour un projet né dans la ruche ;
  métriques seulement pour l'optimisation), les types de tâches permis (pas d'optimisation dans un
  projet de preuve), la validation par bee valider, l'affichage sur le site et la mise à jour de
  docs/nouveau-projet.md. Le projet ruche devient un cas de ce modèle plutôt qu'une exception. Les
  projets et tâches existants doivent rester valides sans modification.
files: [schemas/project.schema.json, tools/bee.py, tools/site_bee.py, tools/test_bee.py, docs/new-project.md, docs/vision.md]
reach: 0.8
metric: null
acceptance_criteria:
