    text: "Conseil, 30/10 : R4 se lit dans REGLES.md, pas dans le critère « gain >= 2 % sur debit_decompression, au-delà du bruit » de cette tâche, laissé tel quel parce que la contribution est soumise. Pour un débit : au moins 2 % d'instructions en moins sur instructions_decompression, que le chronomètre confirme au-delà du bruit ; sinon une mesure d'une autre configuration doit voir le gain (bee enregistrer-mesure). Verdict de miniz-0017-c1 sur 430695c : instructions_decompression −5,1 %, chronomètre −0,01 %, dans le bruit. La phrase « Aucun essai exploratoire n'a été fait » du contexte date de la création de la tâche. Zone : projets/compression-sans-perte/miniz/inflate (chemin rapide et ses bornes ; flux-1 ne l'exerce pas)."
