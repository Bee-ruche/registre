id: miniz-0030
project: miniz
category: lossless-compression
type: test
size: M
title: "Meta-tests: ensure the judges catch a set of seeded regressions"
context: >
  The judges (bee/tests, bee/fuzz, bee/bench) can be changed by tasks of type test or measurement
  (this is intended: the hive builds its own tooling, see the registry's docs/tooling.md). The
  danger is that a "faster oracle" quietly catches fewer defects. Safeguard: a meta-test harness
  that seeds known regressions into miniz's sources and checks that the differential tests flag ALL
  of them. Write bee/tests/meta.sh: for each mutation of a versioned list (for example a match
  distance off by 1, a truncated length, a flipped Huffman byte, a shortened output buffer), apply
  the mutation to a copy of the sources, run bee/tests/lancer.sh, and require that it FAILS (output
  not identical or round trip broken). A mutation that passes the tests is a coverage hole: the
  meta-test fails and names the mutation. Keep the mutations readable (one patch per mutation,
  commented). The CI can then require that a change of judge passes meta.sh, hence that it does not
  weaken detection.
files: [bee/tests/meta.sh]
reach: 0.5
metric: null
acceptance_criteria:
  - "green CI (R2) on the base and on this contribution"
  - "at least 6 seeded regressions, each one actually caught by bee/tests/lancer.sh"
  - "meta.sh fails, naming it, if a mutation is not caught (shown by disabling a test)"
  - "meta.sh never modifies the versioned sources (it works on a copy) and finishes in under 60 s"
out_of_scope: [miniz code, new dependency, existing tests (additions only)]
