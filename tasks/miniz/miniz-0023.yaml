title: "Differential tests of the strategies: MZ_FILTERED, MZ_HUFFMAN_ONLY, MZ_RLE, MZ_FIXED"
context: >
  The differential tests of bee/tests/differentiel.c use only MZ_DEFAULT_STRATEGY. A coverage
  measurement (gcc --coverage on bee/tests/lancer.sh) shows that the lines specific to the other
  strategies are never executed: the RLE search of tdefl_compress_normal (miniz_tdef.c
  l. 1163-1174), the translation of the strategies in tdefl_create_comp_flags_from_zip_params
  (l. 1471-1477); and the TDEFL_FILTER_MATCHES branch of the condition at l. 1181 is never taken.
  Current coverage of miniz_tdef.c: 77.8% of the lines and 70.2% of the branches taken. An
  optimization that broke these paths would therefore pass the differential tests (only the
  compression fuzzing draws a strategy at random). Add, for each strategy and levels 1, 6 and 9:
  round trips miniz->zlib and miniz->miniz, and a determinism fingerprint (new levels « 6r »,
  « 6h »…, to be added to empreintes-reference.txt by regenerating it on the base). Keep the total
  duration under 30 s.
files: [bee/tests/differentiel.c, bee/tests/empreintes-reference.txt]
