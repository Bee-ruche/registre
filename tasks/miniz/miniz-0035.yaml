title: "bee-ci.yml: outputs without workflow commands, judge SHA verified, PR tests without sudo"
context: >
  Second adversarial review of minizBee PR #16 (miniz-0032, 30 Oct). M-4: the output of the PR's
  binaries (upstream tests and fuzzing, through bee/ci/etape.sh) reaches the CI log as it is; a line
  « ::error:: », « ::add-mask:: » or « ::stop-commands:: » written by the PR becomes a workflow
  command there (fake annotations, masking). The exit code goes through GITHUB_OUTPUT and stays
  intact. To do: wrap these outputs in ::stop-commands::<random token> (a token drawn at each step).
  M-5: the test that compares the SHA in the uses: of juge.yml with the one of the checkouts only
  checks its form; an update could point to a commit that exists only in a fork of the registry. To
  do: the test checks with the API that this SHA is an ancestor of main of Bee-ruche/registre, or
  that a juge-v* tag designates it. Verification of PR #16 (30 Oct), two minor points: (1) on
  GitHub-hosted machines, sudo does not ask for a password; the code of a PR that runs in a job
  (outillage-pr, meta-juge, when the PR changes bee/ci, bee/juge or bee-ci.yml) can read the memory
  of the Runner.Worker, take ACTIONS_RUNTIME_TOKEN from it and replace an artifact of another job of
  the same run. The registry already marks these PRs modified_judges (review required, R3). To do:
  run pr/bee/ci/test_verdict.py under a user without sudo; eventually, each artifact read by
  verdict.py is bound to a SHA-256 fingerprint published as an output of its job; qualify the
  workflow comment that says no write by the PR reaches the verdict. (2) Under the `introduction`
  rule, the verdict's assembler is the PR's own: the bootstrap flag (`amorcage` in minizBee's
  verdict.json until miniz-0050, which bee reads only before 2027-01-01; `bootstrap` from then on)
  is declarative there; write this in bee/README.md.
files: [bee/ci/etape.sh, .github/workflows/bee-ci.yml, bee/ci/test_verdict.py]
reach: 0.5
metric: null
