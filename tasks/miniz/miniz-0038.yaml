id: miniz-0038
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tdefl_find_match: reduce the fixed cost of each call at level 1"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a; Cachegrind, first 128 KiB of each
  file). At level 1 (greedy parsing, m_max_probes[0] = 2, hence 3 probes at most), tdefl_find_match
  is called 521,383 times on the sub-corpus and makes only 1.41 probes per call on average
  (stats_lz.py): the fixed cost of each call dominates. The function's entry (miniz_tdef.c
  l. 862-877 at a2f939a) costs 24.0 instructions per call, against 14.8 per probe, budget included
  (11.9 without); it accounts for 7.29% of the judge's instruction count at level 1 (juge_parts.py),
  plus 1.26% for the budget (l. 880). L. 870 alone (pointers s and pTail) counts 15 instructions per
  call, including the bounds of the 64-bit word comparison that gcc hoists there: in the disassembly
  (gcc 13.3 -O3, the bench's object file), the tdefl_find_match inlined into tdefl_compress_normal
  writes six values to the stack on each call (0x40, 0x34, 0x28, 0x20, 0x18 and 0x14(%rsp)) and
  rereads lookahead_pos from the stack in the third probe (movzwl 0xc(%rsp)). Known ceiling: 7.29%
  of instructions_n1 (8.55% with the budget), above R4's 2% threshold. Leads not yet tried: a short
  search for small budgets (m_max_probes[0] <= 2) that does not spill registers; moving out of the
  call the computations that depend only on d; helping gcc (short-scoped local variables, order of
  the tests). Invariants: exactly the same probes and the same matches, at every level; levels 6 and
  9 must not regress (R5). Known risk: the cost of the inlined tdefl_find_match varies with gcc's
  register allocation (bee/README.md, deflate node; notes of miniz-0019 and miniz-0020): compare the
  disassembly before and after, and also measure levels 6 and 9. Touches the same function as
  miniz-0036 (probe loop): whichever is integrated second rebases. miniz-0037 adds a live variable
  in the same function: the same register pressure.
files: [miniz_tdef.c]
reach: 1.0
