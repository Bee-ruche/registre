id: miniz-0033
project: miniz
category: lossless-compression
type: test
size: S
title: "Profileur : ne plus prendre une ligne de commentaire pour un en-tête de fonction"
context: >
  bee/bench/profil.py attribue les instructions de Callgrind aux fonctions en repérant leurs
  en-têtes avec l'expression DEBUT_FONCTION (l. 27-28) puis en comptant les accolades. Depuis
  l'intégration de miniz-0015, la ligne 51 de miniz_tdef.c, à l'intérieur d'un commentaire de bloc
  (« octet par octet (mêmes correspondances choisies, … »), correspond à cette expression : le
  profileur ouvre une fausse fonction « octet » et cherche son accolade ouvrante plus bas, si bien
  qu'une grande partie de miniz_tdef.c est attribuée à « octet » et que les fonctions chaudes
  (tdefl_find_match, tdefl_compress_normal…) disparaissent du classement. Repéré par un agent pendant
  miniz-0020. Corriger le repérage : ignorer les commentaires de bloc et de ligne (et, tant qu'à
  faire, les chaînes) avant d'appliquer l'expression, sans changer l'attribution des fonctions
  réelles. Ajouter un test (bee/bench/test_profil.py) sur un petit fichier C d'exemple qui contient
  un tel commentaire, une fonction static, une fonction MZ_FORCEINLINE et deux variantes sous #if de
  même nom. La CI lance les tests d'outillage depuis la base (étape « Tests unitaires de l'outillage
  de la base ») : y ajouter le lancement de base/bee/bench/test_profil.py s'il existe, pour qu'il
  serve aux PR suivantes ; sur cette PR, joindre la sortie du test lancé dans la sandbox. bee/bench/
  fait partie des juges : c'est une tâche d'outillage, relue par un gardien (R3).
files: [bee/bench/profil.py, bee/bench/test_profil.py, .github/workflows/bee-ci.yml]
