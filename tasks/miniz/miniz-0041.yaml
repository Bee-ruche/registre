notes:
  - by: "bidji29"
    at: "2026-10-30T19:43:12Z"
    text: "30/10, vérification par un gardien : les parts de la décompression dépendent de la zlib qui produit les flux du juge. Avec zlib 1.3 (rapport de miniz-0029) la copie octet par octet pèse 5,22 % ; avec zlib-ng 1.3.1 (celle du Python de la session de vérification), 4,1 %. Vérifier quelle zlib produit les flux dans l'image du juge commun avant de compter sur le plafond (environ 3,5 % pour les seules copies chevauchantes)."
