  - "R4: at least 2% fewer instructions on debit_decompression (instructions_decompression), confirmed by the stopwatch beyond the noise (otherwise a measurement from another configuration)"
  - "no other metric degraded by more than 1% (R5)"
  - "inflate fuzzing (fuzz_inflate) for 10 minutes without a discrepancy; flux-1 and flux-4096 without a discrepancy"
  - "manifest: decompression throughput of the repetitif family before and after (ab.py --corpus bee/corpus/donnees/repetitif)"
  - "manifest: stopwatch before and after on synthetic periodic data (periods 1 to 15 and 48 to 127, as in miniz-0012), with no regression beyond the noise"
