id: miniz-0041
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tinfl_decompress: copy overlapping matches by words rather than byte by byte"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a; Cachegrind, first 128 KiB of each
  file). Since miniz-0012, non-overlapping matches of 4 bytes or more are copied by words
  (miniz_tinfl.c l. 587-613 at a2f939a); the others go through the byte-by-byte loop, 3 bytes per
  iteration (l. 615-630): the matches of length 3, and the overlapping matches (distance D smaller
  than the length L). This loop accounts for 5.22% of the judge's instruction count in decompression
  (juge_parts.py, zlib streams at level 6), at 8.1 instructions per iteration of 3 bytes
  (l. 617-622: 4.27%). On these streams (stats_lz.py), it copies 22.6% of the bytes produced
  (501,901 out of 2,221,670); the 2,382 overlapping matches (1.8% of the matches) contribute about
  409,000 of them, almost all in the repetitif family (75% of its bytes), and the 30,880 matches of
  length 3 (23.7%) the rest, mostly in binaire. Among the overlapping ones: D = 1 for 41%, D from 2
  to 7 for 37%, D of 8 or more for 22%. On the bench, 61.6% of the loop's instructions come from
  repetitif, 19.9% from binaire. Known ceiling: 5.22% of instructions_decompression for the loop,
  about 3.5% for the overlapping matches alone (their share of the bytes); above R4's 2% threshold,
  by a small margin. Already tried: D = 1 by memset (miniz-0012's note of 27 Oct, base 2948eeb):
  instructions −0.75%, stopwatch within the noise; a copy by 8 bytes accepting the overlap from
  D = 8 (miniz-0012's manifest in the fork): throughput −38% on periodic data of period 9 to 15, −7
  to −11% from 48 to 127, because the memory-to-register transfer fails (store-to-load forwarding,
  comment of l. 582-586); rejected. Lead not yet tried: for D < 8, build once an 8-byte word that
  repeats the pattern of the D preceding bytes and write it in steps of 8 (pattern shifted by 8 mod
  D when D does not divide 8), without rereading the bytes just written; D >= 8 goes by words only
  if the periodic measurements above do not regress. The stopwatch decides, the repetitif family
  included (decompression 2.4 GB/s, TABLEAUX.md section 4). Touches the test l. 587, like
  miniz-0042: whichever is integrated second rebases. Invariants: never a write past the end of the
  match nor past pOut_buf_end; the same residual value of counter as the original loop (comment
  l. 612); slow paths (end of buffer, the circular buffer of mz_inflate when streaming) stay intact.
files: [miniz_tinfl.c]
