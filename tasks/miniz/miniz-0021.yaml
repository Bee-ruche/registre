id: miniz-0021
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tdefl_flush_block: write a fallback raw block with memcpy rather than byte by byte"
context: >
  Callgrind profile of the base 2948eeb (python3 bee/bench/profil.py: measured passes only, first
  128 KiB of each file of the corpus, 2.2 MB). When a compressed block would be larger than the
  original (incompressible data), tdefl_flush_block rewrites a raw block, byte by byte, with
  TDEFL_PUT_BITS(…, 8) (miniz_tdef.c l. 672-675). This loop costs 1.7% of the instructions at
  level 1, 0.9% at level 6 and 0.6% at level 9, on average over the corpus. On binaire/aleatoire.bin
  (1 MiB, incompressible), it is the main path at every level. At the time of this loop, m_bits_in
  is 0 (byte alignment, l. 664-667): the bytes can be copied with memcpy from m_dict, in two pieces
  if the circular window wraps around (TDEFL_LZ_DICT_SIZE_MASK), within the limit of
  m_pOutput_buf_end. Reduced reach: only incompressible data benefits, hence a metric targeted at
  level 1, where the share is highest. No exploratory trial was made for this lead: the gain is not
  demonstrated, only the share of the cost is (profile above).
files: [miniz_tdef.c]
reach: 0.3
metric: compression_throughput_n1
compressed_output: identical
acceptance_criteria:
  - "green CI (R2), x86-64 and ARM64 (R6)"
  - "R4: at least 2% fewer instructions on compression_throughput_n1 (instructions_n1), confirmed by the stopwatch beyond the noise (otherwise a measurement from another configuration)"
  - "no other metric degraded by more than 1% (R5)"
  - "gain also measured on binaire/aleatoire.bin alone and reported in the manifest"
out_of_scope: [output format, public API, new dependency, the rule that chooses the raw block]
depends_on: [miniz-0001]
