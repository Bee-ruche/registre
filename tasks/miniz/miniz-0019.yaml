title: "tdefl_compress_normal: simplify the advance and the flush decision after each symbol"
context: >
  Callgrind profile of the base 2948eeb (python3 bee/bench/profil.py: measured passes only, first
  128 KiB of each file of the corpus, 2.2 MB). At each literal or match, tdefl_compress_normal
  advances the window (miniz_tdef.c l. 1224-1227: m_lookahead_pos, m_lookahead_size, m_dict_size
  through MZ_MIN), then decides whether to flush the block (l. 1229-1237: two comparisons, including
  a multiplication by 115 and a shift). These lines cost 5.7% of the instructions at level 1, 3.2%
  at level 6 and 2.2% at level 9. Everything goes through the pointer d, whereas tdefl_compress_fast
  (l. 885-1056) keeps these counters in local variables and copies them back into d only before
  tdefl_flush_block. Lead: the same technique in tdefl_compress_normal (lookahead_pos,
  lookahead_size, dict_size and total_lz_bytes as locals), plus a precomputed flush threshold. The
  exact moment of each flush must stay identical: it sets the split into blocks, hence the output. A
  trial of this lead is measured in miniz-0020's note of 28 Oct: there, the LZ state in locals in
  tdefl_compress_normal gives +0.22%, with register spills; the note states neither the quantity
  measured (instructions or throughput), nor the machine, nor the commit: to be measured again. The
  gain is therefore not demonstrated; only the share of the cost is (profile above).
