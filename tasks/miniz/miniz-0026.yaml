size: S
title: "Tests des cas limites de l'API compatible zlib (paramètres, tampons trop petits, erreurs)"
context: >
  La couverture de miniz.c par les tests différentiels est de 75,3 % des lignes et 55,0 % des
  branches prises (gcc --coverage). Les retours d'erreur de l'API compatible zlib ne sont jamais
  exécutés : mz_deflateInit2 avec un window_bits ou un mem_level invalide (miniz.c l. 203-204),
  mz_deflate sans next_out ou avec avail_out = 0 (l. 247-250), mz_compress2 avec un tampon trop
  petit (l. 337-341, doit rendre MZ_BUF_ERROR), mz_uncompress2 sur une sortie trop petite (l.
  580-586), mz_deflateReset et mz_inflateReset (l. 232-238, 412-435). Comparer, pour chaque cas,
  le code de retour de miniz à celui de zlib (même appel), et documenter les écarts de code
  tolérés plutôt que de les masquer. C'est un garde-fou pour les optimisations de miniz.c et de
  tdefl_compress.
