title: "Profiler: give inline memcpy back to their function and simulate caches and branches as an option"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md, TABLEAUX.md and cachegrind.py in
  the fork, branch tache/miniz-0029, PR #18; sources of master a2f939a). bee/bench/profil.py files
  under « hors miniz (libc : memset, memcpy…) » any cost that callgrind_annotate does not attribute
  to a line of miniz_tdef.c, miniz_tinfl.c or miniz.c. Yet Ubuntu compiles with _FORTIFY_SOURCE:
  every fixed-size memcpy of miniz (unaligned reads, tinfl's copy by words) is inlined, and its
  instructions carry the line of /usr/include/…/bits/string_fortified.h, with miniz's function as
  their name. Measured: 3.83% of the judge's count in decompression (tinfl_decompress: reads of the
  Adler-32 and of the copy by words) and 1.44% at level 1 (tdefl_compress_normal) are miniz code
  shown as libc. Conversely, the memset with which tdefl_init resets to zero (m_hash 64 KiB and
  m_dict 33 KiB per stream, 61 streams) counts 6,014,295 instructions, 3.51% of the judge's count at
  level 1, because Valgrind counts rep stosb at roughly one instruction per byte: the petits family
  runs at 0.05 ns per instruction against 0.117 for the whole corpus at level 1 (TABLEAUX.md section
  4). An instruction "gain" on these memset calls would be an artifact of the measurement, which the
  profile must flag. Finally, profil.py counts only instructions, while miniz-0029 shows that L1
  misses weigh on the time of levels 6 and 9. Measurement task (tooling): in profil.py, give the
  lines of string_fortified.h back to the function named by callgrind (name without the .constprop
  suffix), under a label « inline memcpy »; flag the libc's memset and memcpy separately; an option
  --cache that runs Cachegrind with --cache-sim=yes --branch-sim=yes and explicit caches, and adds
  L1 misses, LL misses and mispredicted branches per function
  (bee/resultats/miniz-0029/cachegrind.py shows one way to read the cachegrind.out file); tests
  without Valgrind in test_profil.py; README up to date (profile table redone on the master of the
  day). Touches the same files as miniz-0034: depends on it.
