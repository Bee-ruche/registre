id: miniz-0036
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tdefl_find_match: fewer instructions per probe, exactly the same probes"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a; Cachegrind, first 128 KiB of each
  file). The probe loop of tdefl_find_match (miniz_tdef.c l. 878-893 at a2f939a: budget
  --num_probes_left l. 880, macro TDEFL_PROBE l. 882-889 unrolled three times l. 890-892) weighs, in
  the judge's instruction count (juge_parts.py: the whole process of bee/juge/execution.c), 63.9% at
  level 9 (probes 60.4% + budget 3.5%) and 49.5% at level 6 (46.6% + 3.0%). Known ceiling: 63.9% of
  instructions_n9, far above R4's 2% threshold. Level 9 makes 40.7 probes per call (median 4, p90
  98, p99 762; budget 768) and 22.7 million probes on the sub-corpus, at 13.6 instructions each,
  budget included (stats_lz.py and cachegrind.py). Disassembly (gcc 13.3 -O3, the bench's object):
  13 instructions per probe: read of m_next; zero test (test, je); copy, subtraction, movzwl
  extension, comparison and jump for dist > max_dist; the mask TDEFL_LZ_DICT_SIZE_MASK computed
  twice (mov, and, and); comparison of the 2 tail bytes and jump. Already integrated in this loop:
  miniz-0014 (the 2 tail bytes read as 16 bits from pTail). Already tried without gain (miniz-0014's
  manifest in the fork, n9 instructions): probe_pos or next_probe_pos as size_t, distance test
  reordered, dist recomputed after the loop, lookahead_pos truncated once: identical or slower code;
  the missed probe already cost 13 instructions there (a useless copy of probe_pos). Leads not
  tried: a single mask; (mz_uint16)(lookahead_pos - next) > max_dist is equivalent to
  (mz_uint16)(next - (lookahead_pos - max_dist)) > max_dist, with the base computed once per call,
  without copy or extension; the zero test is redundant only if (mz_uint16)lookahead_pos > max_dist
  (about half of the positions of a long stream), hence a second version of the loop for that case.
  dist serves only the candidates (5.3% of the probes at level 6, 3.9% at level 9). Touches the same
  function as miniz-0038: whichever is integrated second rebases. Invariants: exactly the same
  probes, the same count of num_probes_left (it also depends on the number of candidates, which
  restart the inner loop) and the same matches; a null m_next stays an end of chain. The stopwatch
  will follow less than the instructions: 0.64 simulated L1 miss per probe at level 9 (90% of the
  scenario's L1 misses), and a model fitted on the bench attributes about 41% of level 9's time to
  L1 misses (TABLEAUX.md, section 4).
