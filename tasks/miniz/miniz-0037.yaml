id: miniz-0037
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tdefl_compress_normal: keep the rolling hash across iterations instead of recomputing it"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a; Cachegrind, first 128 KiB of each
  file). Before inserting the new bytes into the chains, each iteration of tdefl_compress_normal
  recomputes the hash of the last two bytes of the window (miniz_tdef.c l. 1181-1188 at a2f939a:
  test l. 1181, dst_pos and ins_pos l. 1183, hash from two masked reads of m_dict l. 1184,
  num_bytes_to_process l. 1185, test of the common case l. 1188). At level 1, there are 521,383
  iterations on the sub-corpus (0.235 per byte) and l. 1181-1188 account for 9.73% of the judge's
  instruction count (juge_parts.py; 10.35% with the entry and the loop test l. 1177): l. 1184 2.73%,
  l. 1181 1.83%, l. 1183 and l. 1185 1.52% each, l. 1188 1.51%, l. 1186-1187 0.61%. L. 1183 and
  1185-1188 remain necessary: the lead's ceiling, 4.56% of instructions_n1 (l. 1184 and the test
  l. 1181), 2.73% for l. 1184 alone; above R4's 2% threshold, by a small margin. Verifiable fact:
  TDEFL_LZ_HASH_SHIFT equals ceil(TDEFL_LZ_HASH_BITS / 3) (5 for 15 bits, 4 for 12 with
  TDEFL_LESS_MEMORY), so the oldest byte drops out of the mask: the value of hash left by the
  insertion loop, once updated by ((hash << SHIFT) ^ c) & (TDEFL_LZ_HASH_SIZE - 1), gives exactly
  the same value as the recomputed hash (m_dict[ins_pos] << SHIFT) ^ m_dict[ins_pos + 1] then
  updated the same way. Lead: keep hash in a variable of the function from one iteration to the
  next, recompute it only on entry to tdefl_compress_normal (streaming call) and after the
  start-of-stream path (l. 1235-1253); lighten the test l. 1181 along the way, always true after the
  first two bytes until the next full flush (MZ_FULL_FLUSH resets m_dict_size to 0). Already tried,
  on the loop as it was before miniz-0013 (miniz-0013's manifest in the fork): −7.8% n1 instructions
  against −8.3% for the version kept, but one more live variable took a register from the inlined
  tdefl_find_match (lookahead_pos reread from the stack in the third probe) and level 9 regressed on
  the stopwatch (B wins 1 pair out of 10); abandoned. Not measured on the current loop. Invariants:
  the same writes to m_hash and m_next, in the same order (miniz-0013); the same flushes. Overlaps
  neither miniz-0019 (advance and flush, l. 1327-1341) nor miniz-0020 (tdefl_record_*). Caution:
  their notes also show that state kept in local variables can make gcc spill registers (+0.22%);
  the same pressure as miniz-0038: check the disassembly of the probe loop before concluding. At
  level 1, time follows instructions (0.117 ns per instruction, TABLEAUX.md section 4).
