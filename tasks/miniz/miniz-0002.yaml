title: "Review the evaluation tooling: the judge must be more reliable than those it judges"
context: >
  All of the fork's contributions will be judged by miniz-0001's tooling. A flaw in this judge (a
  differential test that does not really compare, fingerprints regenerated silently, a bench that
  mistakes noise for gain, a CI that runs the PR's code with a write token) would spread to
  everything else. Review bee/ and .github/workflows/bee-ci.yml, actively looking for how a
  contribution could wrongly pass. Try at least one deliberately faulty contribution (for example
  two bytes swapped in the compression output) and check that it is rejected.
files: [bee/, .github/workflows/bee-ci.yml]
reach: 1.0
metric: null
acceptance_criteria:
  - "review recorded with bee review, with a detailed reason"
  - "at least one faulty contribution built, and the proof that it is rejected (or the defect reported if it passes)"
  - "every defect reported is reproducible: command and expected result"
out_of_scope: [fixing the tooling yourself in the same contribution]
