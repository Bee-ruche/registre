id: miniz-0040
project: miniz
category: lossless-compression
type: optimization
size: S
title: "mz_adler32: reuse tinfl's block-wise computation for compression"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a; Cachegrind, first 128 KiB of each
  file). The zlib compression computes the Adler-32 of the input with mz_adler32 (miniz.c l. 40-66
  at a2f939a), which has kept the original loop unrolled by 8 bytes: miniz-0016 changed only the
  copy in tinfl_decompress. mz_adler32 accounts for 4.38% of the judge's instruction count at level
  1, 2.24% at level 6 and 1.55% at level 9 (juge_parts.py). It costs 3.38 instructions per byte
  (7,510,775 for 2,221,670 bytes), against 2.64 for tinfl's version (2.51 in the region itself, plus
  its reads through memcpy). Known ceiling: 4.38% of instructions_n1, above R4's 2% threshold; but
  copying tinfl's current version would remove only 0.74 instructions per byte, about 0.97% of
  instructions_n1: below the threshold. To reach 2%, it must go below 1.8 instructions per byte,
  hence the dependency on miniz-0039 (tinfl's Adler-32, target 1.5): reuse its method here once it
  is integrated. miniz_tinfl.c must stay compilable on its own, without miniz.c: the routine is
  duplicated, not shared. Invariants: the same values for any split into calls (any initial adler, a
  null ptr returns MZ_ADLER32_INIT), reduction modulo 65521 at most every 5552 bytes; the « sommes »
  checks of bee/tests (mz_adler32 against zlib, in one go and in pieces) and the API tests
  (bee/tests/api.c) verify it. At level 1, time follows instructions (0.117 ns per instruction,
  TABLEAUX.md section 4).
