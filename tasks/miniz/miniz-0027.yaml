id: miniz-0027
project: miniz
category: lossless-compression
type: measurement
area: governance
size: S
title: "Add a ratio_n1 and throughputs per corpus family to the bench"
context: >
  The bench (bee/bench/banc.c) measures the ratio only at level 6 (ratio_n6) and aggregates the
  whole corpus. Two blind spots follow. (1) A task that changes level 1 and accepts a change of the
  output (for example re-enabling tdefl_compress_fast, miniz_tdef.c l. 885-1056: in a trial outside
  the repository, n1 throughput ×1.85 but n1 ratio from 2.833 to 2.587, −8.7%) cannot be judged, for
  lack of a ratio_n1. (2) The families react very differently: at level 6, text 19.0 MB/s,
  structured 19.8, binary 16.7, repetitive 433, small files 26.5; an optimization that gains only on
  the repetitive family would come out inflated. Add to the bench's JSON, on top of the six existing
  metrics and without changing them: ratio_n1, ratio_n9, and an object « par_famille » (n1, n6, n9
  and decompression throughputs per corpus folder). Update ab.py (medians and sign test for the new
  keys) and the README. The new metrics must then be proposed to the registry (projects/miniz.yaml)
  by the council: note it in the manifest.
files: [bee/bench/banc.c, bee/bench/ab.py, bee/README.md]
reach: 0.5
metric: null
