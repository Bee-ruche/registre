id: miniz-0042
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tinfl_decompress: fewer checks per match between the distance and the copy"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a; Cachegrind, first 128 KiB of each
  file). Between the decoding of the distance and the copy, each match goes through fixed
  computations and tests (miniz_tinfl.c at a2f939a): dist_from_out_buf_start l. 535 (1.64% of the
  judge's instruction count in decompression), the distance check l. 536 (2.05%, with the test of
  TINFL_FLAG_USING_NON_WRAPPING_OUTPUT_BUF at each match), pSrc with the mask out_buf_size_mask
  l. 541 (2.05%), the end-of-buffer test l. 543 with MZ_MAX (2.87%), then the overlap test l. 587
  (2.42%), the choice of 4 or 8 bytes l. 590 (0.61%) and counter %= 3 after the copy by words l. 612
  (1.52%). That is 13.2% of instructions_decompression for 130,049 matches (juge_parts.py, zlib
  streams at level 6), of which 8.61% (21 instructions per match) for l. 535-543. Known ceiling:
  13.2%, above R4's 2% threshold. Leads not yet tried: in non-circular mode
  (TINFL_FLAG_USING_NON_WRAPPING_OUTPUT_BUF, the one of mz_uncompress and of the judge),
  out_buf_size_mask equals (size_t)-1 and pSrc = pOut_buf_cur - dist; testing the flag once outside
  the loop (two versions of this section); sharing the computations of l. 543 and 587. The residue
  of counter (l. 612) is used only for the saved state (r->m_counter) if the coroutine stops before
  the next symbol: keep it identical, or show that it is rewritten before any read. Invariants: on
  invalid input, the same statuses and the same bytes produced before the stop (dist zero or larger
  than the output already produced: TINFL_STATUS_FAILED); the circular path of mz_inflate when
  streaming stays intact. miniz-0017 (in review) rewrites l. 513-534 just before, without touching
  l. 535-613 (diff from a2f939a to 430695c): if it is integrated first, rebase. Touches the test
  l. 587, like miniz-0041: whichever is integrated second rebases. Stopwatch: miniz-0017-c1 (−5.1%
  instructions) and miniz-0018-c1 (−3.7%) stayed within the noise; tinfl_decompress has 8.8%
  mispredicted branches (TABLEAUX.md section 1), which weigh on the time without counting in the
  instructions: plan a measurement from another configuration (R4).
files: [miniz_tinfl.c]
reach: 1.0
metric: decompression_throughput
compressed_output: identical
acceptance_criteria:
  - "green CI (R2), x86-64 and ARM64 (R6)"
  - "R4: at least 2% fewer instructions on decompression_throughput (instructions_decompression), confirmed by the stopwatch beyond the noise (otherwise a measurement from another configuration)"
  - "no other metric degraded by more than 1% (R5)"
  - "inflate fuzzing (fuzz_inflate) for 10 minutes without a discrepancy; flux-1 and flux-4096 without a discrepancy"
  - "manifest: instructions per match of l. 535-613 before and after"
