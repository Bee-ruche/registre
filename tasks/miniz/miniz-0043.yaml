title: "Cache misses and mispredicted branches: hardware counters against Cachegrind's simulation"
context: >
  Source: miniz-0029's report (bee/resultats/miniz-0029/RAPPORT.md and TABLEAUX.md in the fork,
  branch tache/miniz-0029, PR #18; sources of master a2f939a). The reference machine (virtualized
  2.1 GHz Xeon) does not have perf: miniz-0029 could only simulate the caches and the branches with
  Cachegrind (48 KiB L1d, 2 MiB LL). Simulated results, first 128 KiB of each file: the probe loop
  of tdefl_find_match makes 0.55 L1 miss per probe at level 6 and 0.64 at level 9, that is 84% and
  90% of the L1 misses of these scenarios (m_next 64 KiB, m_dict 33 KiB and m_hash 64 KiB do not fit
  in the L1); tinfl_decompress has 8.8% mispredicted branches, among them the reload of bit_buf
  (miniz_tinfl.c l. 443, 47.5%), the choice of 4 or 8 bytes (l. 590, 36%) and the end of the copy by
  words (l. 607, 32%). A linear model fitted on the bench's stopwatch (15 points: levels 1, 6, 9 × 5
  families) gives 0.138 ns per instruction plus 2.84 ns per simulated L1 miss (R² 0.989, against
  0.913 with the instructions alone), and attributes to L1 misses about 10%, 33% and 41% of the time
  of levels 1, 6 and 9; it does not see the branches (unstable coefficient). These orders of
  magnitude decide whether cache or branch tasks, whose gain shows only on the stopwatch (R4's
  second route), are worth opening, and why tinfl's instruction gains (miniz-0017, miniz-0018) stay
  within the noise. Measurement task, with no instruction ceiling: on a machine that has hardware
  counters (perf, ideally not virtualized; x86-64 or ARM64), measure for the bench's n1, n6, n9 and
  decompression scenarios (first 128 KiB of each file, same commands as
  bee/resultats/miniz-0029/cachegrind.py): cycles, instructions, L1d and LLC misses, mispredicted
  branches, per scenario and per family (perf stat), then per function and per line for the probe
  loop and tinfl_decompress (perf record and perf annotate, with or without precise sampling).
  Compare with the simulated values of bee/resultats/miniz-0029/donnees/cachegrind.json and with the
  model above. No change to miniz.
