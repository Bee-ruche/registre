title: "Corpus: add missing realistic families (HTML, compressed logs, executable binaries)"
context: >
  The reference corpus (bee/corpus/generer.py, 61 files, 12.0 MB) is entirely synthetic, apart from
  miniz's sources. It lacks families that dominate web traffic: HTML and CSS, minified JavaScript,
  executable binary (machine code), and already compressed data (PNG, gzip), on which the raw
  fallback block of tdefl_flush_block (miniz_tdef.c l. 657-676) is the main path. The current split
  by family (text 3.6 MB, structured 3.4 MB, binary 2.1 MB, repetitive 1.6 MB, code 1.3 MB, small
  files 10 KB) favors highly compressible data. Add 2 to 4 MB of these families, deterministically:
  free sources pinned by git object ID (like SOURCES_FIGEES) or generators with a fixed seed, with
  no download at generation time. Regenerate SHA256SUMS and the reference fingerprints on the base.
  Total size under 16 MB.
files: [bee/corpus/generer.py, bee/corpus/SHA256SUMS, bee/tests/empreintes-reference.txt]
reach: 0.7
metric: null
acceptance_criteria:
  - "green CI (R2) on the base and on this contribution"
  - "identical generation under Python 3.10, 3.11, 3.12 and 3.13 (checksums attached)"
  - "each source taken in: compatible license and pinned identifier stated in the manifest"
  - "total corpus between 12 and 16 MB, ab.py's A/A test within the noise on the new corpus"
