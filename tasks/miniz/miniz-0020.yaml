id: miniz-0020
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tdefl_record_literal and tdefl_record_match: fewer writes to the state per symbol"
context: >
  Callgrind profile of the base 2948eeb (python3 bee/bench/profil.py: measured passes only, first
  128 KiB of each file of the corpus, 2.2 MB). tdefl_record_literal (miniz_tdef.c l. 1059-1070) and
  tdefl_record_match (l. 1072-1098) together cost 5.6% of the instructions at level 1 (2.3% and
  3.3%) and 2.3% at level 6. Each call reads and rewrites m_pLZ_code_buf, m_pLZ_flags,
  m_num_flags_left and m_total_lz_bytes through d. In tdefl_record_match, the distance goes through
  two tables (s_tdefl_small_dist_sym l. 57-70 and s_tdefl_large_dist_sym l. 83-87) with a mask & 127
  that is useless if match_dist < 32768. Leads: write the length byte and the 2 distance bytes at
  once (a 2-byte memcpy, as tdefl_compress_fast already does at l. 954-958); avoid rereading
  *m_pLZ_flags when the flag is already known. The content of m_lz_code_buf must stay identical byte
  for byte. A trial is measured in the note of 28 Oct below: a ceiling of about 1.5% fewer
  instructions at level 1, under R4's threshold; best variant, 0.73% fewer n1 instructions, but a 4%
  regression on the stopwatch (10 pairs out of 10); the note states neither the metric of this
  regression, nor the machine, nor the commit: to be measured again. The gain is therefore not
  demonstrated; only the share of the cost is (profile above).
files: [miniz_tdef.c]
reach: 0.3
metric: compression_throughput_n1
compressed_output: identical
acceptance_criteria:
  - "green CI (R2), x86-64 and ARM64 (R6)"
  - "R4: at least 2% fewer instructions on compression_throughput_n1 (instructions_n1), confirmed by the stopwatch beyond the noise (otherwise a measurement from another configuration)"
  - "no other metric degraded by more than 1% (R5)"
  - "bee/tests/lancer.sh --sanitiseurs (ASan and UBSan) stays clean"
out_of_scope: [output format, public API, new dependency, format of m_lz_code_buf]
depends_on: [miniz-0001]
node: projects/lossless-compression/miniz/deflate
status: open
