title: "Fuzzing the stream state: changing the flush and the buffers during compression"
context: >
  The harness bee/fuzz/fuzz_compression.c keeps the same buffer size and the same flush policy for a
  whole input. Yet tdefl's state (m_output_flush_remaining, m_lookahead_size, m_saved_match_len;
  miniz_tdef.c l. 1370-1436, tdefl_compress, and l. 1289-1326, the pending match of
  tdefl_compress_normal, at the fork's 9977da4) depends on the exact sequence of calls. Write a
  third harness, bee/fuzz/fuzz_flux.c: the bytes of the input drive a sequence of mz_deflate calls
  (input size, output size of at least 8 bytes with MZ_SYNC_FLUSH, as zlib's manual requires, choice
  among MZ_NO_FLUSH, MZ_SYNC_FLUSH, MZ_FULL_FLUSH and MZ_FINISH), then check that zlib decompresses
  the whole into the original data, and that the output without flush is identical to mz_compress2.
  Add it to bee/fuzz/lancer.sh and to the Makefile (targets fuzz-libfuzzer and fuzz-gcc). The
  harness must run 60 s without a false positive on the base.
files: [bee/fuzz/fuzz_flux.c, bee/fuzz/lancer.sh, bee/Makefile]
