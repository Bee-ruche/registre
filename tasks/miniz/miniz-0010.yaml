id: miniz-0010
project: miniz
category: lossless-compression
type: optimization
size: S
title: "tdefl_find_match: compare matches 16 bits at a time, without undefined behavior"
context: >
  Callgrind profile of the base 2948eeb (python3 bee/bench/profil.py: measured passes only, first
  128 KiB of each file of the corpus, 2.2 MB). tdefl_find_match is the most expensive function of
  compression: 60.0% of the instructions at level 6, 72.1% at level 9, 22.7% at level 1. The three
  TDEFL_PROBE (miniz_tdef.c l. 851-853) alone make up 42.4% at level 6, and the byte-by-byte
  comparison (l. 857-869) 10.7%. miniz already contains a variant that compares 2 bytes at a time
  (l. 776-827: TDEFL_READ_UNALIGNED_WORD, c01/s01, a loop of 4 × 16 bits), but it is compiled only
  if MINIZ_USE_UNALIGNED_LOADS_AND_STORES is 1, and miniz.h sets it to 0 by default, x86-64 included
  (l. 218-227): the byte-by-byte variant (l. 829-871) is the one that runs everywhere. WARNING:
  enabling this variant as it is changes the compressed output (41 fingerprints out of 305, see the
  verified note below); the task asks for a 16-bit comparison that chooses EXACTLY the same matches.
  Exploratory measurements: a trial outside the repository, on a shared machine (virtualized 2.1 GHz
  Xeon, 2 cores, gcc 13.3), ab.py with 10 repetitions; to be redone, they are not authoritative.
  Instructions −7.9% (n6), −8.4% (n9), −5.2% (n1); throughput +16.9% at level 6 (10/10 pairs), +8.0%
  at level 9 (10/10), +4.6% at level 1 (8/10, within the noise); decompression unchanged. Unaligned
  reads without undefined behavior: memcpy into a local variable (the compiler makes it a single
  instruction), never a pointer cast nor a strict-aliasing violation. Caution: miniz.h (l. 210-215)
  sets the option back to 0 when clang compiles with UBSan; bee/tests/lancer.sh --sanitiseurs
  compiles with gcc, which does not define __has_feature, and therefore does test the new path:
  check in the manifest that it does (for example with a temporary #error). The functions
  TDEFL_READ_UNALIGNED_WORD and TDEFL_READ_UNALIGNED_WORD2 (l. 760-771) already do so under
  MINIZ_UNALIGNED_USE_MEMCPY. The byte-by-byte path must stay available (R6) for the targets where
  the option is disabled, and the choice must not touch the other uses of
  MINIZ_USE_UNALIGNED_LOADS_AND_STORES (tasks miniz-0011 and miniz-0012). Caution: at l. 819, the
  end of the comparison reads one byte of p and q for the last character; check that it never goes
  past m_dict (TDEFL_LZ_DICT_SIZE + TDEFL_MAX_MATCH_LEN - 1 bytes).
files: [miniz_tdef.c]
reach: 0.3
metric: debit_compression_n6
compressed_output: identical
