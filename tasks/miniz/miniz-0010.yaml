  - "no other metric degraded by more than 1% (R5)"
  - "bee/tests/lancer.sh --sanitiseurs (ASan and UBSan) stays clean"
  - "16-bit reads by memcpy into a local variable, with no pointer cast"
  - "the byte-by-byte path still compiles and is tested when the option is disabled"
