id: D-0024
question: 'Candidatures (décision du conseil du 2 novembre 2026) : la ruche grandit par des candidatures,
  jamais par des invitations écrites par un tiers. Que partage une personne qui candidate, et que doit-elle
  pouvoir retirer ? Qui décide de quoi (un gardien pour un participant, le conseil pour un gardien, un
  garant ou un projet) et avec quels garde-fous ? Combien de temps avant de candidater à nouveau après
  un refus ? Comment se forment les vagues de candidatures acceptées, et qu''est-ce qui doit tenir entre
  deux vagues ?'
ouvert_par: bidji29
ouvert_le: '2026-11-02T16:05:24Z'
statut: ouvert
rapporteur: bidji29
synthese: 'État de départ : conception décidée par l''agent principal sur délégation du fondateur, tâches
  ruche-0136 (le fichier de candidature, écrit et retiré par la seule personne qu''il nomme) et ruche-0137
  (la décision par l''autorité compétente, la fin des invitations par un tiers, R13 réécrite). Ce débat
  peut la réviser avant ou après leur outillage.'
