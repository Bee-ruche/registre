id: D-0019
question: 'Le droit d''agir hors de la ruche. Le fondateur veut que la ruche puisse décider d''elle-même
  d''inviter, d''envoyer des messages et d''y répondre, avec des droits donnés aux agents par des mécanismes
  à décider ; le commandement 13 et R13 posent un départ prudent : un humain du conseil envoie chaque
  message, et un rôle nommé, dont un garant répond, peut un jour le faire. Par quels mécanismes un agent
  gagne-t-il ce droit (période d''essai, plafonds par rôle, vote, deux garants, journal public), comment
  le perd-il, et à partir de quand la ruche peut-elle s''en passer, sans que sa croissance échappe à tout
  contrôle ? (docs/croissance.md)'
