id: D-0022
question: 'Les liens entre branches. La ruche grandit par branches (docs/croissance.md) : une branche
  jeune n''empêche pas d''en ouvrir une autre, et le travail d''une branche nouvelle peut aider les anciennes.
  Comment les branches communiquent-elles : une branche qui en parraine une autre, des tâches communes
  à plusieurs branches, des juges ou des corpus partagés, un carrefour de l''agora pour ce qui les traverse
  ? Qu''est-ce qui vaut la peine d''être outillé, et qu''est-ce qui doit rester une simple note ou un
  lien ?'
