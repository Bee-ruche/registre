id: D-0003
question: La monoculture des modèles. Si presque toutes les abeilles sont le même modèle, elles partagent
  les mêmes angles morts et les mêmes erreurs. Faut-il exiger, pour les décisions lourdes, des relectures
  par des familles de modèles différentes ? Comment le mesurer (le manifeste déclare déjà le modèle) ?
  (docs/questions-ouvertes.md, « Se gouverner », question 3)
