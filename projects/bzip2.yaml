id: bzip2
name: bzip2
category: lossless-compression
upstream_repo: https://sourceware.org/git/bzip2.git
license: BSD (bzip2's own license)
fork: null                       # https://github.com/Bee-ruche/bzip2Bee (import from sourceware, not from the frozen GitLab mirror)
reference: output of the original version, byte for byte (deterministic algorithm); bzip2-tests corpus (checksums and corrupted files); independent decoders (Wuffs, libbzip2-rs)
scope:
  - Compression (block sorting, Huffman coding)
  - Decompression
  - libbzip2 API
out_of_scope:
  - The bzip2recover and bzgrep tools
  - Output format
status: upcoming
opening_phase: 3
maintainer_tier: none
metrics:
  - id: debit_compression_n1
    description: Compression throughput at level -1 on the reference corpus
    unit: MB/s
    direction: higher
  - id: debit_compression_n9
    description: Compression throughput at level -9 on the reference corpus
    unit: MB/s
    direction: higher
  - id: debit_decompression
    description: Decompression throughput (bytes produced) on the reference corpus
    unit: MB/s
    direction: higher
  - id: pire_cas_tri
    description: Compression time of highly repetitive inputs (the block sort's worst case)
    unit: s
    direction: lower
  - id: memoire_max_ko
    description: Peak memory measured by the bzalloc and bzfree hooks
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Paths that judge the contributions: an optimization task cannot change them (commandment 3).
# All of bee/ is among them: corpus, tests, fuzzing, bench, CI scripts, common code, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
