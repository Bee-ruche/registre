id: lodepng
name: LodePNG
category: image-decoding
upstream_repo: https://github.com/lvandeve/lodepng
license: zlib
fork: null                       # https://github.com/Bee-ruche/<Name>Bee once forked (reserve, phase 4)
reference: libpng (same pixels on the same corpus)
scope:
  - PNG decoding
out_of_scope:
  - PNG encoding
  - C++ convenience API
status: upcoming
opening_phase: 4
maintainer_tier: none
metrics:
  - id: decode_throughput
    description: Decoding throughput on the reference image corpus
    unit: Mpixels/s
    direction: higher
  - id: max_memory_kb
    description: Maximum resident memory during the bench
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
# Paths that judge the contributions: an optimization task cannot change them (commandment 3).
# All of bee/ is among them: corpus, tests, fuzzing, bench, CI scripts, common code, Makefile.
judge_paths:
  - "bee/**"
  - ".github/**"
