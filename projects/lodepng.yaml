id: lodepng
name: LodePNG
category: image-decoding
upstream_repo: https://github.com/lvandeve/lodepng
license: zlib
fork: null                       # https://github.com/Bee-ruche/<Nom>Bee une fois forké (réserve, phase 4)
reference: libpng (mêmes pixels sur le même corpus)
scope:
  - Décodage PNG
out_of_scope:
  - Encodage PNG
  - API C++ de confort
status: upcoming
opening_phase: 4
maintainer_tier: none
metrics:
  - id: debit_decodage
    description: Débit de décodage sur le corpus d'images de référence
    unit: Mpixels/s
    direction: higher
  - id: memoire_max_ko
    description: Mémoire résidente maximale pendant le banc
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
# Chemins qui jugent les contributions : une tâche d'optimisation ne peut pas les modifier (commandement 3).
# Tout bee/ en fait partie : corpus, tests, fuzzing, banc, scripts de CI, code commun, Makefile.
judge_paths:
  - "bee/**"
  - ".github/**"
