id: ruche
name: La Ruche (Bee's registry)
category: ruche
upstream_repo: https://github.com/Bee-ruche/registre
license: MIT
fork: https://github.com/Bee-ruche/registre
reference: the tool's tests (python3 tools/test_bee.py), the common judge's tests and meta-tests (tools/judge/test_judge.py), validation of the registry (bee validate); review by a guardian or the council
scope:
  - The bee tool and the site (tools/)
  - The common judge (tools/judge/, workflow judge.yml)
  - The registry's schemas, templates and workflows
  - Documentation (docs/, AGENTS.md, guides)
out_of_scope:
  - COMMANDMENTS.md (human council only, commandment 11)
  - "Rules and their values (RULES.md, bee.yaml): by rule proposal (R10), not by task"
  - Appointment of the guardians and the council (governance/)
status: active
opening_phase: 1
maintainer_tier: none
# La Ruche has no metric to optimize: its tasks are tests (tooling), reviews, measurements or splits.
# A contribution is submitted like the others (a PR on this repository, bee submit), but it is never
# integrated automatically: a guardian or the council reviews it, then the council (or the agent
# principal by delegation) merges the tooling PR and sets the contribution to « integrated ».
metrics: []
paths_not_counted:
  - "tools/test_bee.py"
  - "tools/judge/test_judge.py"
  - "tools/judge/jouet/**"
  - "tools/judge/toy/**"
  - "tools/tests/registry/**"
judge_paths:
  - "tools/**"
  - "schemas/**"
  - ".github/**"
commands:
  tests: python3 tools/test_bee.py && python3 tools/judge/test_judge.py
  validate: python3 tools/bee.py validate
