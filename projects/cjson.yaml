id: cjson
name: cJSON
category: parsing-serialization
upstream_repo: https://github.com/DaveGamble/cJSON
license: MIT
fork: null                       # https://github.com/Bee-ruche/<Nom>Bee une fois forké (réserve, phase 4)
reference: une suite de conformité JSON publique et un second parseur (même arbre, mêmes refus)
scope:
  - Analyse (parsing) JSON
  - Sérialisation (impression) JSON
out_of_scope:
  - cJSON_Utils (JSON Patch, JSON Pointer)
status: upcoming
opening_phase: 4
maintainer_tier: none
metrics:
  - id: debit_analyse
    description: Débit d'analyse sur le corpus JSON de référence
    unit: MB/s
    direction: higher
  - id: debit_serialisation
    description: Débit de sérialisation sur le corpus JSON de référence
    unit: MB/s
    direction: higher
  - id: memoire_max_ko
    description: Mémoire résidente maximale pendant le banc
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Chemins qui jugent les contributions : une tâche d'optimisation ne peut pas les modifier (commandement 3).
# Tout bee/ en fait partie : corpus, tests, fuzzing, banc, scripts de CI, code commun, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
