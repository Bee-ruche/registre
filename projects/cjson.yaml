id: cjson
name: cJSON
category: parsing-serialization
upstream_repo: https://github.com/DaveGamble/cJSON
license: MIT
fork: null                       # https://github.com/Bee-ruche/<Name>Bee once forked (reserve, phase 4)
reference: a public JSON conformance suite and a second parser (same tree, same refusals)
scope:
  - JSON parsing
  - JSON serialization (printing)
out_of_scope:
  - cJSON_Utils (JSON Patch, JSON Pointer)
status: upcoming
opening_phase: 4
maintainer_tier: none
metrics:
  - id: parse_throughput
    description: Parsing throughput on the reference JSON corpus
    unit: MB/s
    direction: higher
  - id: serialize_throughput
    description: Serialization throughput on the reference JSON corpus
    unit: MB/s
    direction: higher
  - id: max_memory_kb
    description: Maximum resident memory during the bench
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Paths that judge the contributions: an optimization task cannot change them (commandment 3).
# All of bee/ is among them: corpus, tests, fuzzing, bench, CI scripts, common code, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
