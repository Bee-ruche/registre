id: giflib
name: giflib
category: image-decoding
upstream_repo: https://sourceforge.net/p/giflib/code/
license: MIT
fork: null                       # https://github.com/Bee-ruche/giflibBee (import from SourceForge)
reference: independent GIF decoders (Wuffs std/gif, stb_image, libnsgif); same color indices, palettes and error codes
scope:
  - GIF decoding (DGifSlurp, DGifGetLine)
out_of_scope:
  - GIF encoding
  - Command-line tools
status: upcoming
opening_phase: 3
maintainer_tier: none
metrics:
  - id: debit_decodage
    description: Decoding throughput on the reference GIF corpus
    unit: Mpixels/s
    direction: higher
  - id: debit_animation
    description: Frames decoded per second on the corpus's animated GIFs
    unit: frames/s
    direction: higher
  - id: latence_icones
    description: Average decoding time of a small icon (under 64 × 64)
    unit: µs
    direction: lower
  - id: memoire_max_ko
    description: Peak heap during DGifSlurp
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Paths that judge the contributions: an optimization task cannot change them (commandment 3).
# All of bee/ is among them: corpus, tests, fuzzing, bench, CI scripts, common code, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
