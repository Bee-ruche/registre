id: libyaml
name: libyaml
category: parsing-serialization
upstream_repo: https://github.com/yaml/libyaml
license: MIT
fork: https://github.com/Bee-ruche/libyamlBee
reference: yaml-test-suite (expected event streams, through tests/run-parser-test-suite.c) and libfyaml; same event stream, same errors
scope:
  - Parsing (scanner, parser)
  - Document loader
  - Emitter
out_of_scope:
  - Public API (yaml.h)
status: active
opening_phase: 1
maintainer_tier: none
metrics:
  - id: parse_throughput
    description: Throughput of the parser alone (events) on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_parse
  - id: load_throughput
    description: Throughput of the document loader on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_load
  - id: emit_throughput
    description: Throughput of the emitter on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_emit
  - id: max_memory_kb
    description: Peak heap during loading
    unit: KB
    direction: lower
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Paths that judge the contributions: an optimization task cannot change them (commandment 3).
# All of bee/ is among them: corpus, tests, fuzzing, bench, CI scripts, common code, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
# Oracle: for each file of the corpus, tests/run-parser-test-suite emits the canonical event stream
# (yaml-test-suite format). An optimization must produce a STRICTLY identical stream and the same
# error status (SHA-256 fingerprints, as for miniz). The emitter is checked by round trip (events →
# YAML → events). Differential fuzzing compares base and candidate on an arbitrary input: same
# stream, same error, plus ASan/UBSan.
commands:
  corpus: python3 bee/corpus/generer.py
  tests: bee/tests/lancer.sh
  ab_bench: python3 bee/bench/ab.py --base upstream/master --candidate HEAD
  fuzz: bee/fuzz/lancer.sh 600
