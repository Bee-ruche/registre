id: miniz
name: miniz
category: lossless-compression
upstream_repo: https://github.com/richgel999/miniz
license: MIT
fork: https://github.com/Bee-ruche/minizBee
reference: zlib (ce que miniz compresse, zlib doit le décompresser, et inversement)
scope:
  - Compression Deflate (tdefl)
  - Décompression Inflate (tinfl)
  - API compatible zlib (mz_compress, mz_uncompress, mz_deflate, mz_inflate)
out_of_scope:
  - Archives ZIP
  - Écriture PNG
status: active
opening_phase: 1
maintainer_tier: none
metrics:
  - id: compression_throughput_n1
    description: Débit de compression au niveau 1 sur le corpus de référence
    unit: MB/s
    direction: higher
    instructions: instructions_n1
  - id: compression_throughput_n6
    description: Débit de compression au niveau 6 sur le corpus de référence
    unit: MB/s
    direction: higher
    instructions: instructions_n6
  - id: compression_throughput_n9
    description: Débit de compression au niveau 9 sur le corpus de référence
    unit: MB/s
    direction: higher
    instructions: instructions_n9
  - id: decompression_throughput
    description: Débit de décompression sur le corpus de référence
    unit: MB/s
    direction: higher
    instructions: instructions_decompression
  - id: ratio_n6
    description: Taille originale divisée par taille compressée, niveau 6
    unit: ratio
    direction: higher
  - id: max_memory_kb
    description: Mémoire résidente maximale pendant le banc
    unit: KB
    direction: lower
# Chemins exclus du décompte des lignes modifiées (règle R1).
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Chemins qui jugent les contributions : une tâche d'optimisation ne peut pas les modifier (commandement 3).
# Tout bee/ en fait partie : corpus, tests, fuzzing, banc, scripts de CI, code commun, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
# ruche-0025 : les vieilles branches de minizBee déclarent details.base (ancêtre de master) mais jamais base_juge (miniz-0032).
verdict_requires_judge_base: true
commands:
  corpus: python3 bee/corpus/generer.py
  tests: bee/tests/lancer.sh
  ab_bench: python3 bee/bench/ab.py --base upstream/master --candidate HEAD
  fuzz: bee/fuzz/lancer.sh 600
