id: miniz
name: miniz
category: lossless-compression
upstream_repo: https://github.com/richgel999/miniz
license: MIT
fork: https://github.com/Bee-ruche/minizBee
reference: zlib (what miniz compresses, zlib must decompress, and the other way round)
scope:
  - Deflate compression (tdefl)
  - Inflate decompression (tinfl)
  - zlib-compatible API (mz_compress, mz_uncompress, mz_deflate, mz_inflate)
out_of_scope:
  - ZIP archives
  - PNG writing
status: active
opening_phase: 1
maintainer_tier: none
metrics:
  - id: compression_throughput_n1
    description: Compression throughput at level 1 on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_n1
  - id: compression_throughput_n6
    description: Compression throughput at level 6 on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_n6
  - id: compression_throughput_n9
    description: Compression throughput at level 9 on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_n9
  - id: decompression_throughput
    description: Decompression throughput on the reference corpus
    unit: MB/s
    direction: higher
    instructions: instructions_decompression
  - id: ratio_n6
    description: Original size divided by compressed size, level 6
    unit: ratio
    direction: higher
  - id: max_memory_kb
    description: Maximum resident memory during the bench
    unit: KB
    direction: lower
# Paths left out of the count of changed lines (rule R1).
paths_not_counted:
  - "bee/**"
  - "tests/**"
# Paths that judge the contributions: an optimization task cannot change them (commandment 3).
# All of bee/ is among them: corpus, tests, fuzzing, bench, CI scripts, common code, Makefile.
judge_paths:
  - "bee/**"
  - "tests/**"
  - ".github/**"
# ruche-0025: minizBee's old branches declare details.base (an ancestor of master) but never base_juge (miniz-0032).
verdict_requires_judge_base: true
commands:
  corpus: python3 bee/corpus/generer.py
  tests: bee/tests/lancer.sh
  ab_bench: python3 bee/bench/ab.py --base upstream/master --candidate HEAD
  fuzz: bee/fuzz/lancer.sh 600
