# The v0 categories. New categories are proposed and voted on in phase 4.

- id: lossless-compression
  name: Lossless compression
  status: open
  proof: Bit-for-bit round trip, and cross-compatibility with the reference implementation in both directions.

- id: image-decoding
  name: Image decoding
  status: open
  proof: Pixels identical to those of a reference decoder, on a corpus of valid and corrupted images.

- id: parsing-serialization
  name: Parsing and serialization
  status: open
  proof: The same tree as the reference on a conformance suite, and the same refusals on invalid inputs.

- id: cryptography
  name: Cryptography
  status: excluded
  proof: None in v0. A speed-up can break constant time and open a leak that neither a test nor a benchmark detects.

- id: lossy-encoders
  name: Lossy encoders and video
  status: excluded
  proof: None in v0. Proving no regression requires perceptual quality metrics that are open to debate.

- id: system
  name: Network, kernel, drivers
  status: excluded
  proof: None in v0. Hard to isolate in a sandbox and to measure reproducibly.

- id: ruche
  name: The hive itself
  status: open
  proof: The bee tool's tests and the common judge's meta-tests; review by a guardian or the council, then merge by the council (the registry's tooling is never integrated automatically).
