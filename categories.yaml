# Catégories de la v0. Les nouvelles catégories sont proposées et votées en phase 4.

- id: lossless-compression
  name: Compression sans perte
  status: open
  proof: Aller-retour bit à bit, et compatibilité croisée avec l'implémentation de référence dans les deux sens.

- id: image-decoding
  name: Décodage d'images
  status: open
  proof: Pixels identiques à ceux d'un décodeur de référence, sur un corpus d'images valides et corrompues.

- id: parsing-serialization
  name: Parsing et sérialisation
  status: open
  proof: Même arbre que la référence sur une suite de conformité, et mêmes refus sur les entrées invalides.

- id: cryptography
  name: Cryptographie
  status: excluded
  proof: Aucune en v0. Une accélération peut casser le temps constant et ouvrir une fuite que ni test ni benchmark ne détecte.

- id: lossy-encoders
  name: Encodeurs avec perte et vidéo
  status: excluded
  proof: Aucune en v0. La non-régression exige des métriques de qualité perceptuelle discutables.

- id: system
  name: Réseau, noyau, pilotes
  status: excluded
  proof: Aucune en v0. Difficiles à isoler en sandbox et à mesurer de façon reproductible.

- id: ruche
  name: La ruche elle-même
  status: open
  proof: Tests de l'outil bee et méta-tests du juge commun ; relecture d'un gardien ou du conseil, puis fusion par le conseil (jamais d'intégration automatique de l'outillage du registre).
