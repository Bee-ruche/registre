hand:
  issue:
    english:
    - issue
    - outcome
    why: key -> outcome (debates, incidents, reports, outputs); the removal channel value « issue » stays
  signalement:
    english:
    - decide-report
    - report
    why: command -> decide-report; gate nature -> report
  consignes:
    english:
    - brief
    - briefs
    why: the guarantors' key -> brief; the folder gouvernance/consignes/ -> governance/briefs/
  juge-commun:
    english:
    - common-judge
    - judge-meta-tests
    why: docs/juge-commun.md -> docs/common-judge.md; .github/workflows/juge-commun.yml -> judge-meta-tests.yml
  archive:
    english:
    - archive
    - archived
    why: the project status archive -> archived; git archive and tar archives stay
  registre:
    english:
    - registre
    - registry
    why: the folder outils/tests/registre/ -> tools/tests/registry/ and the identifier -> registry; the repository Bee-ruche/registre
      keeps its name
  contribution:
    english:
    - contribution
    - manifest
    why: the key and value stay contribution; the schema contribution.schema.json -> manifest.schema.json (it validates
      the forks manifest)
  manifestes:
    english:
    - manifestes
    - manifests
    why: 'the forks manifest folder: manifests/, and manifestes/ read until date D (plan, section 3.1, R-s): by hand'
