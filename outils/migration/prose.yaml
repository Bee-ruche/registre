# P7 of bee check-migration (ruche-0153, reviews of b2245cf and 6efd815), per base file, each list approved by hand:
#   renamed       each word the switch renames inside the prose of its strings (a string part that holds a blank), with its count;
#   beside_french those of them renamed beside a French word (or French themselves), one by one in their context « prev [word] next »;
#   kept          each French name of the map (a key or a domain value it renames) left where a message names data (in « » or
#                 backticks, beside an interpolation, at a label's start, in a list with an English name), in its context, with
#                 its count: ordinary French there, decided by hand;
#   prose_words   each French name of the map left elsewhere in the strings (docstrings aside), with its count: ordinary French;
#   lone          each blank-less literal the switch renames where the code writes text (« scope [old -> new] »), with its count.
# A new entry, one more, or one the switch no longer needs fails the check until a human updates this file: regenerate the
# candidate, read the diff, then commit it.
